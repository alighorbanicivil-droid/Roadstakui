* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 "Vazirmatn", "Vazir", "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", system-ui, sans-serif;
  padding-top: calc(var(--top-h) + env(safe-area-inset-top));
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
}
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.35; }
h2 { font-size: 1.1rem; } h3 { font-size: 1rem; }
p { margin: .25rem 0 .6rem; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.num, td.n, .rd-v { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.num { display: inline-block; }
.mono { font-family: var(--mono); }

/* نوار بالا */
#top {
  position: fixed; inset: 0 0 auto 0; z-index: 30; height: calc(var(--top-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 12px 0; display: flex; align-items: center; gap: 10px;
  background: var(--primary); color: var(--primary-ink);
}
#top .title { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top .title small { display: block; font-weight: 400; opacity: .85; font-size: .72rem; line-height: 1.1; }
#top .btn { min-height: 38px; padding: 0 14px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--staff); margin-inline-end: 6px; }

/* ناوبری پایین */
#nav {
  position: fixed; inset: auto 0 0 0; z-index: 30; display: flex; background: var(--card); border-top: 1px solid var(--line);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
}
#nav a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); text-decoration: none; font-size: .68rem; min-width: 0; padding: 4px 0;
}
#nav a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#nav a.on { color: var(--primary); font-weight: 700; box-shadow: inset 0 3px 0 var(--primary); }

main { padding: 12px; max-width: 980px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.card.hl { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 120px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .82rem; color: var(--muted); }

/* ورودی و دکمه */
.inp, select.inp, .cell {
  width: 100%; min-height: 46px; padding: 8px 10px; font: inherit; color: var(--ink); background: var(--card);
  border: 1.5px solid var(--line); border-radius: 10px; direction: rtl;
}
.inp.ltr, .cell.ltr, .inp[data-t=num], .inp[data-t=raw], .inp[data-t=stn] { direction: ltr; text-align: left; font-variant-numeric: tabular-nums; }
.inp:focus, .cell:focus, select:focus { outline: 3px solid var(--primary-soft); border-color: var(--primary); }
.inp.bad, .cell.bad { border-color: var(--err); background: var(--err-soft); }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 16px;
  font: inherit; font-weight: 600; color: var(--ink); background: var(--card); border: 1.5px solid var(--line);
  border-radius: 10px; cursor: pointer; touch-action: manipulation;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
#top .btn.primary { background: var(--staff); color: var(--staff-ink); border-color: var(--staff); }
.btn.danger { color: var(--err); border-color: var(--err); }
.btn.sm { min-height: 38px; padding: 0 10px; font-size: .9rem; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.icon { padding: 0; width: 42px; min-height: 42px; font-size: 1.2rem; }

/* پیام‌ها */
.msg { border-radius: 10px; padding: 8px 12px; margin: 6px 0; font-size: .92rem; border: 1px solid; }
.msg.err { background: var(--err-soft); color: var(--err); border-color: var(--err); }
.msg.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.msg.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.msg.info { background: var(--primary-soft); border-color: var(--primary); }
.msg ul { margin: 4px 0 0; padding-inline-start: 20px; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: .78rem; font-weight: 700; border: 1px solid currentColor; }
.chip.L { color: var(--left); background: var(--left-soft); } .chip.C { color: var(--axis); background: var(--axis-soft); } .chip.R { color: var(--right); background: var(--right-soft); } .chip.M { color: var(--mid); background: var(--mid-soft); }

/* جدول ورود */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { background: var(--axis-soft); font-weight: 700; position: sticky; top: 0; }
td .cell { min-width: 108px; min-height: 40px; padding: 4px 8px; text-align: left; }
td .cell.id { min-width: 70px; } td select.cell { min-width: 130px; text-align: right; direction: rtl; }
tr.bad td { background: var(--err-soft); }

/* جدول سه‌نقطه‌ای */
#calcTbl td.n { text-align: right; }
#calcTbl td.stn { position: sticky; inset-inline-start: 0; background: var(--card); font-weight: 700; border-inline-end: 2px solid var(--line); z-index: 1; }
#calcTbl tr.s-left td:not(.stn):not(.hi) { background: var(--left-soft); }
#calcTbl tr.s-right td:not(.stn):not(.hi) { background: var(--right-soft); }
#calcTbl tr.s-axis td:not(.stn):not(.hi) { background: var(--axis-soft); }
#calcTbl tr.s-mid td:not(.stn):not(.hi) { background: var(--mid-soft); }
#calcTbl tr.grp-end td { border-bottom: 3px solid var(--line); }
#calcTbl td.rd { font-weight: 800; font-size: 1.12rem; min-width: 96px; background: var(--staff) !important; color: var(--staff-ink); }
#calcTbl td.rd.bad { background: var(--err-soft) !important; color: var(--err); font-size: .85rem; }
#calcTbl td.rd.none { background: transparent !important; color: var(--muted); font-weight: 400; }

/* صفحه پیاده‌سازی */
.stake-bar { display: flex; gap: 8px; align-items: stretch; position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top)); z-index: 5; background: var(--bg); padding: 8px 0; }
.stake-bar .stn-box { flex: 1; text-align: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 4px 6px; }
.stn-box b { font-size: 1.35rem; display: block; line-height: 1.3; }
.stn-box input { width: 100%; text-align: center; font: inherit; font-size: 1.35rem; font-weight: 800; border: 0; background: transparent; color: var(--ink); direction: ltr; }
.rd-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; margin-bottom: 8px; border-radius: 16px; border: 3px solid var(--line); background: var(--card); }
.rd-card.L { border-color: var(--left); } .rd-card.C { border-color: var(--axis); } .rd-card.R { border-color: var(--right); } .rd-card.M { border-color: var(--mid); }
.rd-card .lbl { font-size: 1.15rem; font-weight: 800; }
.rd-card .sub { font-size: .85rem; color: var(--muted); }
.rd-card > div:first-child { min-width: 0; flex: 1; }
.rd-card .rd-v { flex: none; font-size: clamp(2.1rem, 12.5vw, 3.4rem); font-weight: 900; line-height: 1.05; font-family: var(--mono); background: var(--staff); color: var(--staff-ink); padding: 4px 14px; border-radius: 12px; min-width: 6.2ch; text-align: center; }
.rd-card.bad { background: var(--err-soft); border-color: var(--err); }
.rd-card.bad .rd-v { background: transparent; color: var(--err); font-size: 2rem; text-decoration: none; }
.rd-card .strike { text-decoration: line-through; opacity: .75; }
.rd-card .warn-t { color: var(--err); font-weight: 700; font-size: .88rem; margin-top: 4px; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 10px 0; }
.nav-big { position: fixed; inset-inline: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 20; display: flex; gap: 10px; padding: 8px 12px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.nav-big .btn { flex: 1; min-height: 60px; font-size: 1.15rem; }
.stake-pad { height: 80px; }

/* مودال و اعلان */
#modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, .55); padding: 18px; }
#modal.on { display: flex; }
#modal .box { background: var(--card); border-radius: 16px; padding: 18px; max-width: 460px; width: 100%; max-height: 85vh; overflow: auto; }
#modal .acts { display: flex; gap: 10px; margin-top: 14px; } #modal .acts .btn { flex: 1; }
#toast { position: fixed; z-index: 70; inset-inline: 12px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 76px); display: flex; justify-content: center; pointer-events: none; }
#toast div { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; max-width: 520px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
#toast div.err { background: var(--err); color: #fff; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .92rem; }
.kv b { font-weight: 600; color: var(--muted); }
details > summary { cursor: pointer; font-weight: 700; padding: 8px 0; min-height: 44px; display: flex; align-items: center; }
code, pre.code { direction: ltr; unicode-bidi: isolate; font-family: var(--mono); font-size: .82rem; background: var(--axis-soft); border-radius: 6px; padding: 1px 6px; }
pre.code { display: block; padding: 8px 10px; overflow-x: auto; white-space: pre; text-align: left; margin: 6px 0; }
.pill-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.sec-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }

#printArea { display: none; }
@media print {
  body > *:not(#printArea) { display: none !important; }
  body { padding: 0; background: #fff; color: #000; }
  #printArea { display: block; direction: rtl; font-size: 10pt; }
  #printArea table { font-size: 9pt; } #printArea th, #printArea td { border: 1px solid #888; padding: 2px 5px; }
  #printArea tr { page-break-inside: avoid; }
  #printArea .rdp { font-weight: 800; background: #ffe45c; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ورودی فایل: مخفی ولی قابل لمس (سازگار با مرورگرهای موبایل) */
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
label.btn { position: relative; }

/* ===== v2: نوار زمینه، داشبورد، پیشرفت، ثبت عملیات ===== */
#nav a { font-size: .62rem; }
#nav a svg { width: 22px; height: 22px; }
.ctx { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; position: sticky; top: calc(var(--top-h) + env(safe-area-inset-bottom, 0px) + env(safe-area-inset-top)); z-index: 6; background: var(--bg); padding: 6px 0; }
.ctx .field > span { font-size: .72rem; }
.ctx select.inp { min-height: 42px; font-weight: 700; }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin: 8px 0; }
.kpi div { background: var(--axis-soft); border-radius: 12px; padding: 8px 10px; text-align: center; }
.kpi b { display: block; font-size: 1.3rem; line-height: 1.3; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .75rem; color: var(--muted); }
.bar { height: 12px; background: var(--axis-soft); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--ok); }
.lrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; margin: 6px 0; font-size: .9rem; }
.lrow .bar { grid-column: 1 / -1; height: 8px; }
.tag { display: inline-block; padding: 0 8px; border-radius: 99px; font-size: .75rem; font-weight: 700; border: 1px solid var(--line); background: var(--axis-soft); color: var(--muted); }
.tag.done { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.tag.issue { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.tag.skipped { background: var(--err-soft); color: var(--err); border-color: var(--err); }
.tag.arch { background: var(--axis-soft); }
.opline { font-size: .8rem; color: var(--muted); margin-top: 4px; }
.rd-card .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
textarea.inp { min-height: 76px; font: inherit; direction: rtl; text-align: right; }
.hist { font-size: .82rem; }
.hist div { border-top: 1px dashed var(--line); padding: 4px 0; }
.sticky-act { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 76px); }
#top .save { font-size: .72rem; opacity: .92; }
#top .save.err { color: var(--staff); font-weight: 700; }

/* ---- v2: تب‌ها، گفتگوها، وضعیت ذخیره، ردیف فعال ---- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; margin-bottom: 8px; -webkit-overflow-scrolling: touch; }
.tabs a { flex: none; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; font-size: .9rem; font-weight: 700; }
.tabs a.on { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.crumb { margin: 2px 2px 6px; }
.dlg-body { margin: 6px 0 10px; font-size: .95rem; }
.dlg-err:empty { display: none; }
.ok-t { color: var(--ok); font-weight: 700; }
.err-t { color: var(--err); font-weight: 700; }
.radios { display: flex; flex-wrap: wrap; gap: 10px 14px; }
.radio { display: inline-flex; align-items: center; gap: 6px; }
.dis { opacity: .4; pointer-events: none; }
tr.focus td { background: var(--primary-soft); }

/* مشخصات بنچ‌مارک، لایه‌ی پیاده‌سازی */
.bm-info { margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: var(--axis-soft); color: var(--ink); line-height: 1.7; }
.stake-layer { margin: 0 0 8px; padding: 10px 12px; border-radius: 12px; background: var(--primary-soft); color: var(--ink); font-size: 1.05rem; text-align: center; }
.stake-layer.on { background: var(--warn-soft); color: var(--warn); border: 2px solid var(--warn); font-size: 1.2rem; }
.layer-tag { display: inline-block; font-weight: 700; font-size: .8rem; padding: 0 8px; border-radius: 8px; background: var(--axis-soft); color: var(--axis); }
.layer-tag.on { background: var(--warn-soft); color: var(--warn); }
.bm-it { display: inline-block; margin-inline-end: 14px; }
.bm-desc { margin-top: 2px; color: var(--muted); }

/* ===== v1.6: شیب عرضی، نمودارها، چیدن ستون‌ها ===== */
#nav a { min-width: 0; }
@media (max-width: 430px) { #nav a { font-size: .56rem; } #nav a svg { width: 20px; height: 20px; } }
.dr { display: inline-block; padding: 0 6px; border-radius: 6px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
.dr.dn { color: var(--err); background: var(--err-soft); }
.dr.up { color: var(--ok); background: var(--ok-soft); }
.dr.z { color: var(--muted); }
td.dirs { white-space: nowrap; }
.qa-prev { margin: 6px 0; }
.lon-sum { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 8px; }
.xs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.xs-card { border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--card); min-width: 0; }
.xs-head { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; align-items: baseline; margin-bottom: 4px; }
.xs-rng { margin-top: 4px; }
.cols { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
.col-row { display: grid; grid-template-columns: 1fr minmax(120px, 170px) auto auto; gap: 6px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.col-row.used { border-color: var(--primary); background: var(--primary-soft); }
.col-info { min-width: 0; }
.col-ex { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-h { font-weight: 700; color: var(--primary); }
@media (max-width: 440px) { .col-row { grid-template-columns: 1fr auto auto; } .col-row > select { grid-column: 1 / -1; order: 3; } }

/* ===== v1.6: استقرارها، قالب خروجی، برداشت ===== */
.badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-width: 150px; }
.bdg { display: inline-block; padding: 0 8px; border-radius: 99px; font-size: .74rem; font-weight: 700; border: 1px solid currentColor; white-space: normal; text-align: center; }
.bdg.ok { color: var(--ok); background: var(--ok-soft); } .bdg.warn { color: var(--warn); background: var(--warn-soft); }
.bdg.err { color: var(--err); background: var(--err-soft); } .bdg.info { color: var(--primary); background: var(--primary-soft); }
tr.act-row td { background: var(--primary-soft); }
td .cell.sel { min-width: 118px; }
.fm-row { display: grid; grid-template-columns: minmax(120px, 1.2fr) 1fr auto auto auto; gap: 6px; align-items: center; margin-bottom: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.fm-row .txt { grid-column: 1 / -1; }
@media (max-width: 440px) { .fm-row { grid-template-columns: 1fr auto auto auto; } .fm-row > :first-child { grid-column: 1 / -1; } .fm-row > input.inp:nth-child(2) { grid-column: 1 / -1; } }
.sl-list label { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.sl-list label.dis { opacity: .5; }
.sv-in { flex: none; width: 9.5ch; font: inherit; font-family: var(--mono); font-size: clamp(1.8rem, 9vw, 2.6rem); font-weight: 800; text-align: center; direction: ltr; padding: 4px 6px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); min-height: 58px; }
.sv-in:focus { outline: 3px solid var(--primary-soft); border-color: var(--primary); }
.sv-in:disabled { opacity: .4; }
.sv-res { margin-top: 4px; font-size: .88rem; line-height: 1.7; }
.sv-st { display: inline-block; padding: 0 9px; border-radius: 99px; font-size: .8rem; font-weight: 800; border: 1px solid currentColor; }
.sv-st.ok { color: var(--ok); background: var(--ok-soft); } .sv-st.cut { color: var(--err); background: var(--err-soft); }
.sv-st.fill { color: var(--warn); background: var(--warn-soft); } .sv-st.nodesign, .sv-st.badreading, .sv-st.nohi { color: var(--muted); background: var(--axis-soft); }
.sv-err { font-weight: 800; }
.sv-err.ok { color: var(--ok); } .sv-err.cut { color: var(--err); } .sv-err.fill { color: var(--warn); }
.stake-bar .btn.icon { align-self: center; flex: none; }
.nav-big .btn.primary.wide { flex: 2.2; }

/* ---- محور: پیش‌نمایش درج، شیب طولی، دکمه‌ی درج ---- */
.qa-pre { margin-top: 8px; line-height: 1.8; }
.lon-up { color: var(--right); font-weight: 700; } .lon-dn { color: var(--err); font-weight: 700; }
td.nw { white-space: nowrap; }
#midTbl .cell { min-width: 64px; }
tr.auto-row td { background: var(--axis-soft); }
.bdg.info { white-space: nowrap; }

.qa-more{margin-top:8px}.qa-more summary{cursor:pointer;color:var(--muted)}
.qa-hr{border:0;border-top:1px solid var(--line,#8884);margin:14px 0 10px}
.lon-in{width:68px;text-align:center}.lon-in.lon-up{color:var(--ok,#157a3c)}.lon-in.lon-dn{color:var(--bad,#c0392b)}

.desc-c{white-space:nowrap}
#printArea.rp { --left: #1565c0; --right: #2e7d32; --axis: #0b2a40; --axis-soft: #e8eef3; --ink: #1d2733; --muted: #5a6875; --mid: #b45309; --card: #fff; --line: #c4ced6; }
@page { size: A4; margin: 14mm 12mm 16mm; @bottom-center { content: counter(page); font: 8pt 'Vazirmatn', Tahoma, sans-serif; color: #667; } }
@media print {

/* ===== مرحله ۱ — نسخه‌ی پررنگ‌تر ===== */

.hm-card.open { opacity: 1; box-shadow: 0 0 0 2px var(--gold), 0 12px 26px rgba(11,42,67,.3); }

  <script>/*!
 * RoadCore — ماژول مستقل و قابل آزمایش محاسبات پیاده‌سازی راه
 * ----------------------------------------------------------------------------
 * این فایل هیچ وابستگی‌ای به DOM یا مرورگر ندارد (UMD) و با Node نیز اجرا می‌شود.
 *
 * قراردادها (Conventions) — حتماً بخوانید:
 *
 *  ۱. دستگاه مختصات: X = شرقی (Easting)، Y = شمالی (Northing)، Z = ارتفاع.
 *  ۲. جهت مسیر = جهت افزایش کیلومتراژ (ترتیب نقاط محور).
 *     «چپ» و «راست» از دید فردی است که در جهت افزایش کیلومتراژ ایستاده است.
 *  ۳. بردار یکه مماس u = (ux, uy). بردار عمود چپ  n_L = (−uy, +ux)،
 *     بردار عمود راست n_R = (+uy, −ux). (مثلاً مسیر رو به شمال: چپ = غرب.)
 *  ۴. جهت مقطع در هر نقطه (computeDirections):
 *       • نقطه‌ی میانی با انحراف ≈ ۰ ........ نیم‌ساز دو پاره‌خط (مماس مستقیم)
 *       • نقطه‌ی میانی با انحراف ≤ زاویه‌ی شکست: مماس دایره‌ی گذرنده از سه نقطه‌ی
 *         (قبل، خود نقطه، بعد) ← مماس واقعی قوس، نه وتر.
 *       • نقطه‌ی میانی با انحراف > زاویه‌ی شکست: «شکست هندسی» (گوشه). مقطع روی
 *         نیم‌ساز دو پاره‌خط قرار می‌گیرد و (اگر mitre فعال باشد) فاصله‌ی افقی
 *         لبه‌ها در راستای نیم‌ساز به اندازه‌ی ۱/cos(δ/2) بزرگ می‌شود تا فاصله‌ی
 *         عمودی هر لبه تا هر دو پاره‌خط برابر عرض بماند.
 *       • نقطه‌ی ابتدا/انتها: اگر نقطه‌ی مجاور «قوس» باشد، مماس دایره‌ی سه نقطه‌ی
 *         اول (یا آخر) در همان نقطه؛ در غیر این‌صورت جهت اولین (آخرین) پاره‌خط.
 *     هیچ‌گاه جهت از یک نقطه‌ی منفرد حدس زده نمی‌شود.
 *  ۵. شیب عرضی هر سمت «افت» (fall) است: مثبت = لبه پایین‌تر از محور
 *     (قرارداد پیش‌فرض positiveMeans='down'). با positiveMeans='up' علامت ورودی
 *     وارونه تفسیر می‌شود (مثبت = لبه بالاتر).
 *        ΔZ = Z_لبه − Z_محور = − fall × عرض افقی          (fall بر حسب m/m)
 *     یعنی همان Delta Z = Width × Crossfall با علامت جهت شیب.
 *  ۶. وضعیت مقطع:
 *       crown            : شیب چپ و راست مستقل؛ هر دو مطابق مقدار واردشده.
 *       oneway_right_low : شیب یک‌طرفه؛ سمت راست پایین، چپ بالا (|شیب| = sL).
 *       oneway_left_low  : شیب یک‌طرفه؛ سمت چپ پایین، راست بالا (|شیب| = sL).
 *  ۷. شیب/عرض متغیر: جدول ایستگاه‌ها؛ مقادیر مؤثر (عرض و fall) بین دو ایستگاه

 *     بیرون از بازه، مقدار نزدیک‌ترین ایستگاه ثابت می‌ماند.
 *  ۸. نیوو:  HI = Z_بنچ‌مارک + قرائت_عقب ،  قرائت_شاخص = HI − Z_هدف.
 *     قرائت فقط وقتی «قابل اجرا» است که  0 < قرائت ≤ طول شاخص
 *     (مقایسه پس از گرد کردن به دقت نمایش، تا −0.000 و 0.000 یکسان رفتار شوند).
 *  ۹. همه‌ی محاسبات با دقت کامل double انجام می‌شود؛ گرد کردن فقط برای نمایش/خروجی.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RoadCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  تنظیمات و ساختار پروژه
   * ------------------------------------------------------------------ */
  function defaultSettings() {
    return {
      coordSystem: 'UTM',       // 'UTM' | 'LOCAL'
      utmZone: 39,
      hemisphere: 'N',          // 'N' | 'S'
      datum: 'WGS84',
      unit: 'm',                // فقط برچسب: 'm' | 'ft'
      decimals: 3,              // ≥ 3
      staffLength: 4.0,
      stationDisplay: 'chainage', // 'chainage' (1+250.000) | 'numeric'
      stationExport: 'numeric',   // 'numeric' | 'chainage'
      slopeUnit: 'percent',     // 'percent' | 'ratio'
      positiveMeans: 'down',    // 'down' (افت) | 'up' (خیز)
      interpolate: true,
      breakAngle: 25,           // درجه
      mitre: true,
      columnPreset: 'PSXYZD',
      surveyTolMm: 10,          // حد انطباق برداشت (میلی‌متر)
      codes: { axis: 'CL', left: 'LE', right: 'RE' },
      suffix: { left: 'L', right: 'R' }
    };
  }

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function newProject(name) {
    const now = new Date().toISOString();
    return {
      schema: 1,
      id: uid('p'),
      name: name || 'پروژه جدید',
      createdAt: now,
      updatedAt: now,
      settings: defaultSettings(),
      points: [],
      sections: [{ station: 0, wL: 3.5, wR: 3.5, mode: 'crown', sL: 2, sR: 2 }],
      benchmarks: [],
      setups: [],
      activeSetupId: null
    };
  }

  /** ادغام تنظیمات ذخیره‌شده با پیش‌فرض‌ها (برای سازگاری با نسخه‌های قدیمی) */
  function normalizeSettings(s) {
    const d = defaultSettings();
    const o = Object.assign({}, d, s || {});
    o.codes = Object.assign({}, d.codes, (s && s.codes) || {});
    o.suffix = Object.assign({}, d.suffix, (s && s.suffix) || {});
    if (!(o.decimals >= 3)) o.decimals = 3;
    if (o.decimals > 6) o.decimals = 6;
    return o;
  }

  /* ------------------------------------------------------------------ *
   *  تبدیل ورودی‌ها
   * ------------------------------------------------------------------ */
  const FA = '۰۱۲۳۴۵۶۷۸۹';
  const AR = '٠١٢٣٤٥٦٧٨٩';

  function normalizeDigits(s) {
    return String(s)
      .replace(/[۰-۹]/g, function (c) { return FA.indexOf(c); })
      .replace(/[٠-٩]/g, function (c) { return AR.indexOf(c); });
  }

  /**
   * تبدیل متن به عدد. ارقام فارسی/عربی، ممیز «٫»، جداکننده‌ی هزارگان «٬»،
   * منفی یونیکد و (در نبود نقطه) «,» یا «/» به‌عنوان ممیز اعشار پذیرفته می‌شوند.
   * خروجی NaN یعنی نامعتبر.
   */
  function toNumber(v) {
    if (typeof v === 'number') return Number.isFinite(v) ? v : NaN;
    if (v === null || v === undefined) return NaN;
    let s = normalizeDigits(v).trim();
    if (s === '') return NaN;
    s = s.replace(/[−–—]/g, '-')
      .replace(/٫/g, '.')
      .replace(/[٬‌‏‎\s]/g, '');
    if (s.indexOf('.') === -1) {
      const n = (s.match(/[,\/]/g) || []).length;
      if (n === 1) s = s.replace(/[,\/]/, '.');
      else if (n > 1) return NaN;
    } else if (s.indexOf(',') !== -1) {
      s = s.replace(/,/g, '');
    }
    if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
    return parseFloat(s);
  }

  /** «12+345.678» یا عدد ساده (متر) ← متر. NaN اگر نامعتبر. */
  function parseStation(v) {
    if (typeof v === 'number') return Number.isFinite(v) ? v : NaN;
    if (v === null || v === undefined) return NaN;
    const s = normalizeDigits(v).trim().replace(/\s+/g, '');
    if (s === '') return NaN;
    const idx = s.indexOf('+', 1);
    if (idx > 0) {
      const kmTxt = s.slice(0, idx);
      const km = toNumber(kmTxt);
      const m = toNumber(s.slice(idx + 1));
      if (!Number.isFinite(km) || !Number.isFinite(m)) return NaN;
      if (!Number.isInteger(Math.abs(km)) || m < 0 || m >= 1000) return NaN;
      const sign = kmTxt.charAt(0) === '-' ? -1 : 1;
      return sign * (Math.abs(km) * 1000 + m);
    }
    return toNumber(s);
  }

  function fmt(v, d) {
    if (typeof v !== 'number' || !Number.isFinite(v)) return '';
    let s = v.toFixed(d === undefined ? 3 : d);
    if (/^-0(\.0+)?$/.test(s)) s = s.slice(1); // بدون «−۰.۰۰۰»
    return s;
  }

  function formatStation(m, d) {
    if (typeof m !== 'number' || !Number.isFinite(m)) return '';
    d = d === undefined ? 3 : d;
    const f = Math.pow(10, d);
    const neg = m < 0;
    const r = Math.round(Math.abs(m) * f) / f;
    const km = Math.floor(r / 1000);
    const rem = r - km * 1000;
    const remTxt = rem.toFixed(d).padStart(d > 0 ? d + 4 : 3, '0');
    return (neg && r !== 0 ? '-' : '') + km + '+' + remTxt;
  }

  /* ------------------------------------------------------------------ *
   *  اعتبارسنجی محور
   * ------------------------------------------------------------------ */
  function ptLabel(p, i) {
    return 'ردیف ' + (i + 1) + (p && p.id ? ' (نقطه ' + p.id + ')' : '');
  }

  function deflectionOf(a, b, c) {
    const d1x = b.x - a.x, d1y = b.y - a.y, d2x = c.x - b.x, d2y = c.y - b.y;
    return Math.atan2(d1x * d2y - d1y * d2x, d1x * d2x + d1y * d2y);
  }

  function validateAxis(points, settings) {
    const st = normalizeSettings(settings);
    const errors = [], warnings = [];
    const err = function (i, code, msg) { errors.push({ index: i, code: code, msg: msg }); };
    const warn = function (i, code, msg) { warnings.push({ index: i, code: code, msg: msg }); };
    const pts = points || [];
    if (pts.length < 2) err(null, 'few', 'برای محاسبه حداقل دو نقطه‌ی محور لازم است.');

    const fin = Number.isFinite;
    const names = { station: 'کیلومتراژ', x: 'X', y: 'Y', z: 'Z' };
    const complete = pts.map(function (p, i) {
      let ok = true;
      ['station', 'x', 'y', 'z'].forEach(function (k) {
        if (!fin(p[k])) { err(i, 'missing', ptLabel(p, i) + ': مقدار ' + names[k] + ' خالی یا نامعتبر است.'); ok = false; }
      });
      if (!String(p.id == null ? '' : p.id).trim()) warn(i, 'noid', ptLabel(p, i) + ': شماره‌ی نقطه خالی است؛ از شماره‌ی ردیف استفاده می‌شود.');
      return ok;
    });

    // ترتیب کیلومتراژ، مختصات تکراری، برگشت مسیر
    let stationWarns = 0;
    let prevStn = -1;  // آخرین ردیف دارای کیلومتراژ معتبر (برای کنترل ترتیب)
    let prevIdx = -1;  // آخرین ردیف کامل (برای کنترل مختصات)
    for (let i = 0; i < pts.length; i++) {
      const b = pts[i];
      if (fin(b.station)) {
        if (prevStn >= 0) {
          const a = pts[prevStn];
          if (b.station === a.station) {
            err(i, 'dupstation', ptLabel(b, i) + ': کیلومتراژ تکراری است (' + formatStation(b.station) + ').');
          } else if (b.station < a.station) {
            err(i, 'order', ptLabel(b, i) + ': کیلومتراژ ' + formatStation(b.station) + ' کمتر از ردیف ' + (prevStn + 1) + ' (' + formatStation(a.station) + ') است؛ نقاط باید به‌ترتیب افزایش کیلومتراژ باشند.');
          }
        }
        prevStn = i;
      }
      if (!complete[i]) continue;
      if (prevIdx < 0) { prevIdx = i; continue; }
      const a2 = pts[prevIdx];
      prevIdx = i;
      const dist = Math.hypot(b.x - a2.x, b.y - a2.y);
      if (dist < 1e-6) {
        err(i, 'dupcoord', ptLabel(b, i) + ': مختصات X,Y با نقطه‌ی قبلی یکسان است؛ جهت مسیر قابل محاسبه نیست.');
        continue;
      }
      const ds = b.station - a2.station;
      if (ds > 0 && Math.abs(dist - ds) > Math.max(0.5, 0.05 * ds)) {
        if (stationWarns < 8) warn(i, 'stationdist', ptLabel(b, i) + ': اختلاف کیلومتراژ (' + fmt(ds) + ' m) با فاصله‌ی افقی (' + fmt(dist) + ' m) زیاد است؛ X/Y یا کیلومتراژ را بررسی کنید.');
        stationWarns++;
      }
    }
    if (stationWarns > 8) warn(null, 'stationdist', '… و ' + (stationWarns - 8) + ' مورد دیگر اختلاف کیلومتراژ با فاصله.');

    // برگشت تقریباً کامل مسیر
    for (let i = 1; i < pts.length - 1; i++) {
      if (!(complete[i - 1] && complete[i] && complete[i + 1])) continue;
      if (Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y) < 1e-6) continue;
      if (Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y) < 1e-6) continue;
      const defl = Math.abs(deflectionOf(pts[i - 1], pts[i], pts[i + 1])) * 180 / Math.PI;
      if (defl > 170) err(i, 'uturn', ptLabel(pts[i], i) + ': زاویه‌ی انحراف ' + fmt(defl, 1) + '° است؛ مسیر تقریباً روی خودش برمی‌گردد و جهت مقطع تعریف‌شده نیست.');
    }

    // تکرار شماره‌ی نقطه و مختصات غیرمتوالی
    const seenId = {}, seenXY = {};
    pts.forEach(function (p, i) {
      const id = String(p.id == null ? '' : p.id).trim();
      if (id) {
        if (seenId[id] !== undefined) warn(i, 'dupid', ptLabel(p, i) + ': شماره‌ی نقطه با ردیف ' + (seenId[id] + 1) + ' تکراری است.');
        else seenId[id] = i;
      }
      if (complete[i]) {
        const k = Math.round(p.x * 1000) + '|' + Math.round(p.y * 1000);
        if (seenXY[k] !== undefined && seenXY[k] !== i - 1) warn(i, 'dupxy', ptLabel(p, i) + ': مختصات X,Y با ردیف ' + (seenXY[k] + 1) + ' یکسان است.');
        if (seenXY[k] === undefined) seenXY[k] = i;
      }
    });

    // احتمال جابه‌جایی X و Y (فقط در UTM)
    if (st.coordSystem === 'UTM') {
      const bad = pts.filter(function (p, i) { return complete[i] && p.x > 1e6 && p.y < 1e6; }).length;
      const good = pts.filter(function (p, i) { return complete[i]; }).length;
      if (good && bad === good) warn(null, 'swapxy', 'احتمال جابه‌جایی X و Y: مقادیر X (شرقی) بزرگ‌تر از ۱٬۰۰۰٬۰۰۰ و Y کوچک‌تر از آن است. ترتیب ستون‌ها را در ورود فایل بررسی کنید.');
    }
    return { ok: errors.length === 0, errors: errors, warnings: warnings };
  }

  /* ------------------------------------------------------------------ *
   *  جهت مقطع
   * ------------------------------------------------------------------ */
  function unit(x, y) {
    const l = Math.hypot(x, y);
    return { x: x / l, y: y / l };
  }

  /**
   * مماس یکه‌ی دایره‌ی گذرنده از سه نقطه‌ی A,B,C در یکی از آن‌ها (at = 'A'|'B'|'C')
   * با جهت رو به حرکت A→B→C. اگر سه نقطه هم‌خط باشند null.
   * محاسبه نسبت به B انجام می‌شود تا از خطای دقت اعداد بزرگ UTM جلوگیری شود.
   */
  function circleTangent(A, B, C, at) {
    const ax = A.x - B.x, ay = A.y - B.y, cx = C.x - B.x, cy = C.y - B.y;
    const D = 2 * (ax * cy - ay * cx);
    if (Math.abs(D) < 1e-12) return null;
    const a2 = ax * ax + ay * ay, c2 = cx * cx + cy * cy;
    const ox = (cy * a2 - ay * c2) / D;
    const oy = (ax * c2 - cx * a2) / D;
    const P = at === 'A' ? { x: ax, y: ay } : at === 'C' ? { x: cx, y: cy } : { x: 0, y: 0 };
    const rx = P.x - ox, ry = P.y - oy;
    let tx = -ry, ty = rx;
    const ref = at === 'A' ? { x: -ax, y: -ay } : at === 'C' ? { x: cx, y: cy } : { x: cx - ax, y: cy - ay };
    if (tx * ref.x + ty * ref.y < 0) { tx = -tx; ty = -ty; }
    const l = Math.hypot(tx, ty);
    if (!(l > 0)) return null;
    return { x: tx / l, y: ty / l };
  }

  /**
   * جهت مقطع برای همه‌ی نقاط. خروجی برای هر نقطه:
   * { ux, uy, kind: 'start'|'end'|'straight'|'curve'|'break', deflectionDeg, mitre }
   */
  function computeDirections(points, opts) {
    opts = opts || {};
    const brk = (opts.breakAngle === undefined ? 25 : opts.breakAngle) * Math.PI / 180;
    const useMitre = opts.mitre !== false;
    const n = points.length;
    if (n < 2) throw new Error('حداقل دو نقطه‌ی محور لازم است.');
    const seg = [];
    for (let i = 0; i < n - 1; i++) {
      const dx = points[i + 1].x - points[i].x, dy = points[i + 1].y - points[i].y;
      if (Math.hypot(dx, dy) < 1e-9) throw new Error('نقاط ' + (i + 1) + ' و ' + (i + 2) + ' مختصات یکسان دارند.');
      seg.push(unit(dx, dy));
    }
    const out = new Array(n);
    // نقاط میانی
    for (let i = 1; i < n - 1; i++) {
      const d1 = seg[i - 1], d2 = seg[i];
      const defl = Math.atan2(d1.x * d2.y - d1.y * d2.x, d1.x * d2.x + d1.y * d2.y);
      const ad = Math.abs(defl);
      const deg = defl * 180 / Math.PI;
      if (ad < 1e-9) {
        const u = unit(d1.x + d2.x, d1.y + d2.y);
        out[i] = { ux: u.x, uy: u.y, kind: 'straight', deflectionDeg: deg, mitre: 1 };
      } else if (ad <= brk) {
        const t = circleTangent(points[i - 1], points[i], points[i + 1], 'B');
        const u = t || unit(d1.x + d2.x, d1.y + d2.y);
        out[i] = { ux: u.x, uy: u.y, kind: 'curve', deflectionDeg: deg, mitre: 1 };
      } else {
        const c = Math.cos(ad / 2);
        if (c < Math.cos(85 * Math.PI / 180)) throw new Error('زاویه‌ی انحراف نقطه‌ی ' + (i + 1) + ' بیش از حد است (' + fmt(Math.abs(deg), 1) + '°).');
        const u = unit(d1.x + d2.x, d1.y + d2.y);
        out[i] = { ux: u.x, uy: u.y, kind: 'break', deflectionDeg: deg, mitre: useMitre ? 1 / c : 1 };
      }
    }
    // ابتدا
    let u0 = seg[0];
    if (n >= 3 && out[1].kind === 'curve') {
      const t = circleTangent(points[0], points[1], points[2], 'A');
      if (t) u0 = t;
    }
    out[0] = { ux: u0.x, uy: u0.y, kind: 'start', deflectionDeg: 0, mitre: 1 };
    // انتها
    let u1 = seg[n - 2];
    if (n >= 3 && out[n - 2].kind === 'curve') {
      const t = circleTangent(points[n - 3], points[n - 2], points[n - 1], 'C');
      if (t) u1 = t;
    }
    out[n - 1] = { ux: u1.x, uy: u1.y, kind: 'end', deflectionDeg: 0, mitre: 1 };
    return out;
  }

  /* ------------------------------------------------------------------ *
   *  جدول عرض و شیب عرضی
   * ------------------------------------------------------------------ */
  const MODES = ['crown', 'oneway_right_low', 'oneway_left_low', 'inverted', 'flat'];
  const MODE_FA = {
    crown: 'تاج دوطرفه', oneway_left_low: 'یک‌طرفه (چپ پایین)', oneway_right_low: 'یک‌طرفه (راست پایین)',
    inverted: 'قوس معکوس', flat: 'تخت', none: 'بدون شیب'
  };

  /** علامت جهت افتِ هر سمت برای هر مدل: +۱ = لبه پایین‌تر از محور، −۱ = بالاتر، ۰ = تخت */
  function modeDirs(mode) {
    switch (mode) {
      case 'crown': return { l: 1, r: 1 };
      case 'oneway_left_low': return { l: 1, r: -1 };
      case 'oneway_right_low': return { l: -1, r: 1 };
      case 'inverted': return { l: -1, r: -1 };
      case 'flat': return { l: 0, r: 0 };
      default: return null;
    }
  }

  /** مدل مقطع از روی علامت افت دو سمت (برای ردیف‌هایی که مدل ندارند) */
  function modelFromFalls(fallL, fallR) {
    const sg = function (v) { return v > 1e-12 ? 1 : v < -1e-12 ? -1 : 0; };
    let l = sg(fallL), r = sg(fallR);
    if (l === 0) l = r;
    if (r === 0) r = l;
    if (l === 0) return 'flat';
    if (l > 0 && r > 0) return 'crown';
    if (l > 0 && r < 0) return 'oneway_left_low';
    if (l < 0 && r > 0) return 'oneway_right_low';
    return 'inverted';
  }

  /**
   * افت چپ/راست (m/m) یک ردیف.
   *  • ردیف جدید (unsigned=true): شیب‌ها بدون علامت‌اند و جهت از «مدل» می‌آید.
   *  • ردیف قدیمی: شیب با علامت (مثبت = افت) و یک‌طرفه با |sL| برای هر دو سمت.
   */
  function rowFalls(row, st) {
    const k = st.slopeUnit === 'ratio' ? 1 : 0.01;
    if (row.unsigned) {
      const d = modeDirs(row.mode);
      if (!d) return { fallL: NaN, fallR: NaN };
      if (row.mode === 'flat') return { fallL: 0, fallR: 0 };
      const l = Math.abs(toNumber(row.sL)) * k, r = Math.abs(toNumber(row.sR)) * k;
      return { fallL: d.l * l, fallR: d.r * r };
    }
    const sign = st.positiveMeans === 'up' ? -1 : 1;
    const l = toNumber(row.sL), r = toNumber(row.sR);
    if (row.mode === 'oneway_right_low') { const m = Math.abs(l) * k; return { fallL: -m, fallR: m }; }
    if (row.mode === 'oneway_left_low') { const m = Math.abs(l) * k; return { fallL: m, fallR: -m }; }
    if (row.mode === 'inverted') return { fallL: -Math.abs(l) * k, fallR: -Math.abs(r) * k };
    if (row.mode === 'flat') return { fallL: 0, fallR: 0 };
    return { fallL: sign * l * k, fallR: sign * r * k };
  }

  /**
   * تبدیل ردیف‌های قدیمیِ «شیب با علامت» به مدل بدون علامت (idempotent: ردیف unsigned دست‌نخورده می‌ماند).
   * جهت هر سمت از علامت افت تعیین و شیب به‌صورت قدر مطلق ذخیره می‌شود.
   */
  function migrateSlopeRows(rows, settings) {
    const st = normalizeSettings(settings);
    const kd = st.slopeUnit === 'ratio' ? 1 : 100;
    const r6 = function (v) { return Math.round(v * 1e6) / 1e6; };
    return (rows || []).map(function (row) {
      if (row && row.unsigned) return row;
      const f = rowFalls(row || {}, st);
      const base = { station: row ? row.station : null, wL: row ? row.wL : null, wR: row ? row.wR : null };
      if (!Number.isFinite(f.fallL) || !Number.isFinite(f.fallR)) {
        return Object.assign(base, { mode: 'crown', sL: row ? row.sL : null, sR: row ? row.sR : null, unsigned: true });
      }
      return Object.assign(base, { mode: modelFromFalls(f.fallL, f.fallR), sL: r6(Math.abs(f.fallL) * kd), sR: r6(Math.abs(f.fallR) * kd), unsigned: true });
    });
  }

  /**
   * ردیف‌های شیبِ «خودکار» (row.auto === true) را از نزدیک‌ترین ردیف‌های دستی دو طرف دوباره می‌سازد:
   *  • هر دو طرف هم‌مدل (و غیرتخت): عرض‌ها و شیب‌ها با کیلومتراژ درون‌یابی خطی می‌شود.
   *  • مدل دو طرف فرق دارد (مرز مدل): مقدارها از ردیف دستیِ قبلی کپی می‌شود؛ اگر قبلی نیست از بعدی.
   *  • هیچ ردیف دستی نیست: ردیف دست‌نخورده می‌ماند.
   * rows درجا به‌روز می‌شود؛ خروجی = تعداد ردیف‌های تغییرکرده.
   */
  function autoSections(rows) {
    rows = rows || [];
    const num = function (v) { return toNumber(v); };
    const valid = function (r) {
      if (!r || MODES.indexOf(r.mode) < 0 || !Number.isFinite(num(r.station)) || !Number.isFinite(num(r.wL)) || !Number.isFinite(num(r.wR))) return false;
      return r.mode === 'flat' || (Number.isFinite(num(r.sL)) && Number.isFinite(num(r.sR)));
    };
    const fixed = rows.filter(function (r) { return !r.auto && valid(r); }).sort(function (a, b) { return num(a.station) - num(b.station); });
    const r6 = function (v) { return Math.round(v * 1e6) / 1e6; };
    let changed = 0;
    rows.forEach(function (r) {
      if (!r || !r.auto) return;
      const s = num(r.station); if (!Number.isFinite(s)) return;
      let prev = null, next = null;
      fixed.forEach(function (f) { const fs = num(f.station); if (fs < s - 1e-9) prev = f; else if (fs > s + 1e-9 && !next) next = f; });
      let v = null;
      if (prev && next && prev.mode === next.mode) {
        const ps = num(prev.station), ns = num(next.station), t = ns > ps ? (s - ps) / (ns - ps) : 0;
        const L = function (a, b) { return r6(num(a) + (num(b) - num(a)) * t); };
        v = { mode: prev.mode, wL: L(prev.wL, next.wL), wR: L(prev.wR, next.wR), sL: prev.mode === 'flat' ? 0 : L(prev.sL, next.sL), sR: prev.mode === 'flat' ? 0 : L(prev.sR, next.sR) };
      } else if (prev || next) {
        const f = prev || next;
        v = { mode: f.mode, wL: r6(num(f.wL)), wR: r6(num(f.wR)), sL: f.mode === 'flat' ? 0 : r6(num(f.sL)), sR: f.mode === 'flat' ? 0 : r6(num(f.sR)) };
      }
      if (!v) return;
      const same = r.mode === v.mode && num(r.wL) === v.wL && num(r.wR) === v.wR && num(r.sL) === v.sL && num(r.sR) === v.sR && r.unsigned === true;
      if (same) return;
      r.mode = v.mode; r.wL = v.wL; r.wR = v.wR; r.sL = v.sL; r.sR = v.sR; r.unsigned = true; changed++;
    });
    return changed;
  }

  /** ردیف‌های معتبر را به مقادیر مؤثر (عرض و fall بر حسب m/m) تبدیل و مرتب می‌کند. */
  function normalizeSections(rows, settings) {
    const st = normalizeSettings(settings);
    const out = [];
    (rows || []).forEach(function (row) {
      const station = toNumber(row.station), wL = toNumber(row.wL), wR = toNumber(row.wR);
      const f = rowFalls(row, st);
      if ([station, wL, wR, f.fallL, f.fallR].every(Number.isFinite)) {
        out.push({ station: station, wL: wL, wR: wR, fallL: f.fallL, fallR: f.fallR, mode: row.unsigned ? row.mode : modelFromFalls(f.fallL, f.fallR) });
      }
    });
    out.sort(function (a, b) { return a.station - b.station; });
    return out;
  }

  function validateSections(rows, settings) {
    const errors = [], warnings = [];
    const st = normalizeSettings(settings);
    if (!rows || !rows.length) {
      warnings.push({ index: null, msg: 'هیچ ردیف عرض/شیبی تعریف نشده است؛ لبه‌ها روی محور قرار می‌گیرند.' });
    }
    const seen = {};
    (rows || []).forEach(function (r, i) {
      const lab = 'ردیف ' + (i + 1) + ' (شیب‌ها)';
      const s = toNumber(r.station);
      if (!Number.isFinite(s)) errors.push({ index: i, msg: lab + ': کیلومتراژ نامعتبر است.' });
      else {
        const key = Math.round(s * 1000);
        if (seen[key] !== undefined) errors.push({ index: i, msg: lab + ': کیلومتراژ با ردیف ' + (seen[key] + 1) + ' تکراری است.' });
        else seen[key] = i;
      }
      ['wL', 'wR'].forEach(function (k) {
        const w = toNumber(r[k]);
        if (!Number.isFinite(w)) errors.push({ index: i, msg: lab + ': عرض ' + (k === 'wL' ? 'چپ' : 'راست') + ' نامعتبر است.' });
        else if (w < 0) errors.push({ index: i, msg: lab + ': عرض ' + (k === 'wL' ? 'چپ' : 'راست') + ' نمی‌تواند منفی باشد.' });
      });
      if (MODES.indexOf(r.mode) === -1) errors.push({ index: i, msg: lab + ': مدل شیب عرضی نامعتبر است.' });
      if (r.unsigned) {
        if (r.mode !== 'flat') {
          [['sL', 'چپ'], ['sR', 'راست']].forEach(function (q) {
            const v = toNumber(r[q[0]]);
            if (!Number.isFinite(v)) errors.push({ index: i, msg: lab + ': شیب ' + q[1] + ' نامعتبر یا خالی است.' });
            else if (v < 0) errors.push({ index: i, msg: lab + ': شیب ' + q[1] + ' را بدون علامت وارد کنید؛ جهت را مدل شیب تعیین می‌کند.' });
          });
        }
      } else {
        const oneway = r.mode === 'oneway_left_low' || r.mode === 'oneway_right_low';
        if (!Number.isFinite(toNumber(r.sL))) errors.push({ index: i, msg: lab + ': شیب ' + (oneway ? '' : 'چپ ') + 'نامعتبر است.' });
        if (!oneway && !Number.isFinite(toNumber(r.sR))) errors.push({ index: i, msg: lab + ': شیب راست نامعتبر است.' });
      }
      // هشدار شیب غیرمعمول
      const k = st.slopeUnit === 'ratio' ? 1 : 0.01;
      [r.sL, r.sR].forEach(function (v) {
        const x = toNumber(v);
        if (Number.isFinite(x) && Math.abs(x * k) > 0.25) warnings.push({ index: i, msg: lab + ': شیب ' + v + ' غیرعادی است (بیش از ۲۵٪). واحد شیب را بررسی کنید.' });
      });
    });
    return { ok: errors.length === 0, errors: errors, warnings: warnings };
  }

  function pickSection(r) { return { wL: r.wL, wR: r.wR, fallL: r.fallL, fallR: r.fallR, mode: r.mode }; }

  /** مقدار مؤثر عرض و fall در یک کیلومتراژ (norm = خروجی normalizeSections) */
  function resolveSection(norm, station, settings) {
    const st = normalizeSettings(settings);
    const n = norm.length;
    if (!n) return { wL: 0, wR: 0, fallL: 0, fallR: 0 };
    if (station <= norm[0].station) return pickSection(norm[0]);
    if (station >= norm[n - 1].station) return pickSection(norm[n - 1]);
    let lo = 0, hi = n - 1; // norm[lo].station <= station < norm[hi].station
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (norm[mid].station <= station) lo = mid; else hi = mid;
    }
    const a = norm[lo], b = norm[hi];
    if (!st.interpolate) return pickSection(a);
    const span = b.station - a.station;
    if (!(span > 0)) return pickSection(b);
    const t = (station - a.station) / span;
    const L = function (p, q) { return p + (q - p) * t; };
    return { wL: L(a.wL, b.wL), wR: L(a.wR, b.wR), fallL: L(a.fallL, b.fallL), fallR: L(a.fallR, b.fallR) };
  }

  /** تبدیل جدول قدیمیِ درون‌یابی‌شده به یک ردیف برای هر نقطه‌ی محور (برای حالت sectionMode='point'). */
  function expandSections(points, rows, settings) {
    const st = normalizeSettings(settings), norm = normalizeSections(rows, st);
    if (!norm.length) return [];
    const k = st.slopeUnit === 'ratio' ? 1 : 100, sign = st.positiveMeans === 'up' ? -1 : 1, seen = {}, out = [];
    const r6 = function (v) { return Math.round(v * 1e6) / 1e6; };
    (points || []).forEach(function (p) {
      const station = toNumber(p.station);
      if (!Number.isFinite(station) || seen[Math.round(station * 1000)]) return;
      seen[Math.round(station * 1000)] = true;
      const q = resolveSection(norm, station, st);
      out.push({ station: station, wL: r6(q.wL), wR: r6(q.wR), mode: 'crown', sL: r6(sign * q.fallL * k), sR: r6(sign * q.fallR * k) });
    });
    out.sort(function (a, b) { return a.station - b.station; });
    return out;
  }

  /* ------------------------------------------------------------------ *
   *  محاسبه‌ی مقاطع (محور، لبه‌ی چپ، لبه‌ی راست)
   * ------------------------------------------------------------------ */
  function computeSections(points, sectionRows, settings, midList) {
    const st = normalizeSettings(settings);
    const midN = normalizeMids(midList).mids;
    const dirs = computeDirections(points, { breakAngle: st.breakAngle, mitre: st.mitre });
    const norm = normalizeSections(sectionRows, st);
    // sectionMode='point': هر ردیف فقط برای همان کیلومتراژِ نقطه‌ی محور اعمال می‌شود (بدون درون‌یابی)؛ نقاط بدون ردیف لبه‌شان روی محور است.
    const pointMode = st.sectionMode === 'point';
    const byStation = {};
    if (pointMode) norm.forEach(function (r) { byStation[Math.round(r.station * 1000)] = r; });
    const kDisp = st.slopeUnit === 'ratio' ? 1 : 100;
    const sign = st.positiveMeans === 'up' ? -1 : 1;
    return points.map(function (p, i) {
      const d = dirs[i];
      const rec = pointMode ? byStation[Math.round(p.station * 1000)] : null;
      const sec = pointMode ? (rec ? pickSection(rec) : { wL: 0, wR: 0, fallL: 0, fallR: 0, none: true }) : resolveSection(norm, p.station, st);
      const nx = -d.uy, ny = d.ux; // عمود چپ
      const baseName = String(p.id == null || String(p.id).trim() === '' ? i + 1 : p.id).trim();
      const dzL = -sec.fallL * sec.wL;
      const dzR = -sec.fallR * sec.wR;
      const out = {
        index: i,
        station: p.station,
        desc: p.desc == null ? '' : String(p.desc),
        kind: d.kind,
        deflectionDeg: d.deflectionDeg,
        azimuthDeg: ((Math.atan2(d.ux, d.uy) * 180 / Math.PI) + 360) % 360, // سمت از شمال، ساعت‌گرد
        section: sec,
        axis: { side: 'axis', name: baseName, x: p.x, y: p.y, z: p.z, width: 0, crossfall: 0, dz: 0 },
        left: {
          side: 'left', name: baseName + st.suffix.left,
          x: p.x + nx * sec.wL * d.mitre, y: p.y + ny * sec.wL * d.mitre, z: p.z + dzL,
          width: sec.wL, crossfall: sign * sec.fallL * kDisp, dz: dzL
        },
        right: {
          side: 'right', name: baseName + st.suffix.right,
          x: p.x - nx * sec.wR * d.mitre, y: p.y - ny * sec.wR * d.mitre, z: p.z + dzR,
          width: sec.wR, crossfall: sign * sec.fallR * kDisp, dz: dzR
        }
      };
      out.midKeys = { left: [], right: [] }; out.midSkipped = 0;
      midN.forEach(function (m) {
        if (!midCovers(m, p.station)) return;
        const w = m.side === 'left' ? sec.wL : sec.wR;
        if (sec.none || !(m.offset <= w + 1e-9)) { out.midSkipped++; return; }
        let fall = m.side === 'left' ? sec.fallL : sec.fallR;
        if (m.slope !== null) {
          const dd = modeDirs(sec.mode), dir = fall > 1e-12 ? 1 : fall < -1e-12 ? -1 : (dd ? (m.side === 'left' ? dd.l : dd.r) : 1);
          fall = (dir || 1) * m.slope * (st.slopeUnit === 'ratio' ? 1 : 0.01);
        }
        const dz = m.dz !== null ? m.dz : -fall * m.offset;
        const k2 = m.side === 'left' ? 1 : -1, key = 'mid_' + m.id;
        out[key] = {
          side: key, kind: 'mid', edge: m.side, tag: m.tag, midName: m.name,
          name: baseName + (m.side === 'left' ? st.suffix.left : st.suffix.right) + m.tag,
          x: p.x + k2 * nx * m.offset * d.mitre, y: p.y + k2 * ny * m.offset * d.mitre, z: p.z + dz,
          width: m.offset, crossfall: sign * fall * kDisp, dz: dz
        };
        out.midKeys[m.side].push(key);
      });
      const offOf = function (k) { return out[k].width; };
      out.midKeys.left.sort(function (a, b) { return offOf(a) - offOf(b); });
      out.midKeys.right.sort(function (a, b) { return offOf(a) - offOf(b); });
      return out;
    });
  }

  /* ------------------------------------------------------------------ *
   *  درج نقطه‌ی محور بین دو نقطه‌ی موجود (کیلومتراژ جدید)
   * ------------------------------------------------------------------ */
  /**
   * مختصات نقطه‌ی جدید در کیلومتراژ station را می‌سازد.
   * o: { x, y, z, slopePct } مقدارهای دستی (خالی/NaN = خودکار).
   *  • X و Y خالی: روی خط مستقیم بین دو همسایه (فقط وقتی کیلومتراژ بین دو نقطه است).
   *  • Z: اولویت با Z دستی، بعد شیب طولی (٪) نسبت به نقطه‌ی قبلی (یا بعدی، اگر قبلی نیست)، در نبود هر دو درون‌یابی خطی.
   * خروجی: { ok, error, index (جای درج در آرایه), prev, next, x, y, z, xyAuto, zMode: 'manual'|'slope'|'auto', slopePrev, slopeNext }
   */
  /**
   * نقطه‌ی روی قوس بین pts[k] و pts[k+1] به نسبت t (۰..۱، بر پایه‌ی کیلومتراژ).
   * دایره از سه نقطه‌ی متوالی ساخته می‌شود: (قبلی، A، B) و (A، B، بعدی). اگر هر دو ممکن بود با وزن t ترکیب می‌شوند.
   * هم‌خط بودن یا شکست بیش از ۲۵° در رأس میانی → همان دایره کنار گذاشته می‌شود (خط مستقیم).
   */
  function arcCandidates(pts, k, t) {
    const A = pts[k], B = pts[k + 1];
    const brk = 25 * Math.PI / 180;
    const okp = function (q) { return q && Number.isFinite(q.x) && Number.isFinite(q.y); };
    const circ = function (P, Q, R, T) {   // Q رأس میانی؛ T نقطه‌ی سوم (غیر از A و B)
      if (!okp(P) || !okp(Q) || !okp(R)) return null;
      const d1x = Q.x - P.x, d1y = Q.y - P.y, d2x = R.x - Q.x, d2y = R.y - Q.y;
      if (Math.hypot(d1x, d1y) < 1e-9 || Math.hypot(d2x, d2y) < 1e-9) return null;
      const defl = Math.abs(Math.atan2(d1x * d2y - d1y * d2x, d1x * d2x + d1y * d2y));
      if (defl < 1e-9 || defl > brk) return null;

      const to = l && l.to !== '' && l.to != null ? toNumber(l.to) : null;

      if (to !== null && !Number.isFinite(to)) { errors.push({ index: i, msg: lab + ': کیلومتراژ پایان نامعتبر است.' }); return; }

  function layerCovers(layer, station) {

    if (layer.to !== null && station > layer.to + 1e-9) return false;
    return true;

  /** مقاطع یک لایه: محور و دو لبه به اندازه‌ی جابه‌جایی پایین/بالا می‌روند؛ فقط در محدوده‌ی لایه. */

  /* ------------------------------------------------------------------ *

  /**

    const value = hi - targetZ;
    const f = Math.pow(10, decimals === undefined ? 3 : decimals);

  /** قرائت‌های سه نقطه‌ی هر مقطع برای یک استقرار. خروجی موازی با sections. */

    });
  }

  /* ------------------------------------------------------------------ *

  /** هر نقطه: Point,Station,X,Y,Z,Code + side/width/slope/layer/desc (برای قالب دلخواه خروجی) */

      sideKeys(s, 'alr').forEach(function (side) {

    if (Number.isFinite(o.staffLength) && rr > o.staffLength) { out.status = 'badreading'; out.message = 'قرائت بیشتر از طول شاخص (' + fmt(o.staffLength, 3) + ') است.'; return out; }

  /** آمار خطاها (متر): تعداد، منطبق، غیرمنطبق، بیشینه‌ی |خطا|، میانگین و انحراف معیار نمونه */

      { id: 'b_pnezd', name: 'PNEZD: Point, N, E, Z, Description (بدون عنوان)', header: false, stationFormat: 'numeric', cols: ['point', 'y', 'x', 'z', 'code'] },

  /** قالب {cols:[{key,label,text}], header, stationFormat} + ردیف‌ها ← ماتریس خروجی */
  function customTable(kind, rows, tpl, opts) {
    const cat = COLS[kind] || POINT_COLS;
    opts = opts || {};
    const cols = (tpl && Array.isArray(tpl.cols) ? tpl.cols : []).filter(function (c) { return c && cat[c.key]; });
    const o = { stationFormat: (tpl && tpl.stationFormat) || opts.stationFormat || 'numeric' };
    const out = [];
    if (!tpl || tpl.header !== false) out.push(cols.map(function (c) { return c.label !== undefined && c.label !== '' ? c.label : cat[c.key].label; }));
    rows.forEach(function (r) { out.push(cols.map(function (c) { const v = cat[c.key].get(r, o, c); return v === undefined ? null : v; })); });
    return out;
  }

  /** قالب ذخیره‌شده (cols = آرایه‌ی کلید) ← قالب کامل با عنوان‌های پیش‌فرض */
  function expandTemplate(kind, t) {
    const cat = COLS[kind] || POINT_COLS;
    return Object.assign({}, t, { cols: (t.cols || []).map(function (c) {
      const key = typeof c === 'string' ? c : c.key;
      return { key: key, label: typeof c === 'string' ? cat[key] && cat[key].label : (c.label !== undefined ? c.label : cat[key] && cat[key].label), text: typeof c === 'string' ? '' : c.text };
    }) });
  }

  function csvCell(v, delim, decimals) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'number') return Number.isFinite(v) ? C.fmt(v, decimals) : '';
    let s = String(v);
    if (delim === ' ') return s.replace(/\s+/g, '_');
    if (s.indexOf(delim) !== -1 || /["\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  /** ماتریس ← متن. delimiter: ',' | ';' | '\t' | ' ' */
  function toDelimited(table, opts) {
    opts = opts || {};
    const d = opts.delimiter || ',';
    const dec = opts.decimals === undefined ? 3 : opts.decimals;
    const eol = opts.eol || '\r\n';
    return table.map(function (row) {
      return row.map(function (v) { return csvCell(v, d, dec); }).join(d);
    }).join(eol) + eol;

  /* ================================================================== *
   *  ZIP / XLSX
   * ================================================================== */
  const te = new TextEncoder();
  const td = new TextDecoder('utf-8');

  let CRC_TABLE = null;
  function crc32(bytes) {
    if (!CRC_TABLE) {
      CRC_TABLE = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        CRC_TABLE[n] = c >>> 0;
      }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  /** files: [{name, data:Uint8Array|string}] ← ZIP بدون فشرده‌سازی */
  function zipStore(files) {
    const parts = [], central = [];
    let offset = 0;
    const date = new Date();
    const dosTime = (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1);
    const dosDate = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
    files.forEach(function (f) {
      const name = te.encode(f.name);
      const data = typeof f.data === 'string' ? te.encode(f.data) : f.data;
      const crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
      ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + data.length;
    });
    const cdSize = central.reduce(function (a, b) { return a + b.length; }, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    const all = parts.concat(central, [new Uint8Array(end.buffer)]);
    const total = all.reduce(function (a, b) { return a + b.length; }, 0);
    const out = new Uint8Array(total);
    let p = 0;
    all.forEach(function (b) { out.set(b, p); p += b.length; });
    return out;
  }

  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') throw new Error('مرورگر شما از خواندن فایل Excel پشتیبانی نمی‌کند؛ فایل را CSV ذخیره کنید.');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  /** ZIP ← Map(name → Uint8Array) */
  async function unzip(bytes) {
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('ساختار فایل Excel معتبر نیست (ZIP پیدا نشد).');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const files = new Map();
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('فایل Excel آسیب‌دیده است.');
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = td.decode(bytes.subarray(p + 46, p + 46 + nlen));
      p += 46 + nlen + elen + clen;
      if (!/(^xl\/(workbook|sharedStrings|_rels\/workbook\.xml)|^xl\/worksheets\/[^/]+\.xml$)/.test(name) && !/^xl\/_rels\/workbook\.xml\.rels$/.test(name)) continue;
      const lnl = dv.getUint16(lho + 26, true), lel = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnl + lel;
      const raw = bytes.subarray(start, start + csize);
      if (method === 0) files.set(name, raw);
      else if (method === 8) files.set(name, await inflateRaw(raw));
      else throw new Error('روش فشرده‌سازی فایل Excel پشتیبانی نمی‌شود.');
    }
    return files;
  }

  const xmlEsc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; })
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  };

  function colLetters(i) {
    let s = '';
    for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + ((i - 1) % 26)) + s;
    return s;
  }

  /**
   * sheets: [{name, rows:[[...]]}]؛ سطر اول عنوان (پررنگ). اعداد با دقت decimals ذخیره
   * و با قالب 0.000 نمایش داده می‌شوند. رشته‌ها inline هستند.
   */
  function writeXlsx(sheets, opts) {
    opts = opts || {};
    const dec = opts.decimals === undefined ? 3 : opts.decimals;
    const fmtCode = dec > 0 ? '0.' + '0'.repeat(dec) : '0';

    files.push({
      name: '[Content_Types].xml', data:
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +

        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'
    });
    files.push({
      name: 'xl/workbook.xml', data:
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
        sheets.map(function (s, i) { return '<sheet name="' + xmlEsc(String(s.name).replace(/[\\\/?*\[\]:]/g, '_').slice(0, 31)) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>'; }).join('') +
        '</sheets></workbook>'
    });
    files.push({
      name: 'xl/_rels/workbook.xml.rels', data:
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        sheets.map(function (_, i) { return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>'; }).join('') +
        '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'
    });

      name: 'xl/styles.xml', data:
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
        '<numFmts count="1"><numFmt numFmtId="164" formatCode="' + fmtCode + '"/></numFmts>' +
        '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
        '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
        '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
        '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
        '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
        '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>' +
        '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'
    });
    sheets.forEach(function (sh, si) {
      let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
        '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
        '<cols><col min="1" max="' + Math.max(1, (sh.rows[0] || []).length) + '" width="16" customWidth="1"/></cols><sheetData>';
      sh.rows.forEach(function (row, ri) {
        xml += '<row r="' + (ri + 1) + '">';
        row.forEach(function (v, ci) {
          if (v === null || v === undefined || v === '') return;
          const ref = colLetters(ci) + (ri + 1);
          if (typeof v === 'number') {
            if (!Number.isFinite(v)) return;
            const num = Number(v.toFixed(dec));
            xml += '<c r="' + ref + '" s="2"><v>' + num + '</v></c>';
          } else {
            xml += '<c r="' + ref + '"' + (ri === 0 ? ' s="1"' : '') + ' t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(v) + '</t></is></c>';
          }
        });
        xml += '</row>';
      });
      xml += '</sheetData></worksheet>';
      files.push({ name: 'xl/worksheets/sheet' + (si + 1) + '.xml', data: xml });
    });

  }

  function xmlUnesc(s) {
    return s.replace(/&(#x[0-9a-fA-F]+|#\d+|lt|gt|amp|quot|apos);/g, function (m, g) {
      if (g === 'lt') return '<'; if (g === 'gt') return '>'; if (g === 'amp') return '&';
      if (g === 'quot') return '"'; if (g === 'apos') return "'";
      const code = g[1] === 'x' ? parseInt(g.slice(2), 16) : parseInt(g.slice(1), 10);
      return String.fromCodePoint(code);
    });
  }

  function textOf(fragment) {
    const out = [];
    const re = /<t\b[^>]*>([\s\S]*?)<\/t>/g;
    let m;
    while ((m = re.exec(fragment))) out.push(xmlUnesc(m[1]));
    return out.join('');
  }

  function colIndex(ref) {
    const m = /^([A-Z]+)/.exec(ref);
    if (!m) return -1;
    let n = 0;
    for (let i = 0; i < m[1].length; i++) n = n * 26 + (m[1].charCodeAt(i) - 64);
    return n - 1;
  }

  /** xlsx (Uint8Array) ← Promise<rows[][]> از اولین کاربرگ */
  async function readXlsx(bytes) {
    if (bytes.length > 4 && bytes[0] === 0xD0 && bytes[1] === 0xCF && bytes[2] === 0x11 && bytes[3] === 0xE0) {
      throw new Error('فرمت قدیمی Excel (.xls) پشتیبانی نمی‌شود. فایل را در Excel با «Save As» به .xlsx یا CSV ذخیره کنید.');
    }
    if (!(bytes[0] === 0x50 && bytes[1] === 0x4B)) throw new Error('این فایل Excel (.xlsx) معتبر نیست.');
    const files = await unzip(bytes);
    const dec = function (n) { return files.has(n) ? td.decode(files.get(n)) : null; };
    // مسیر اولین کاربرگ
    let sheetPath = null;
    const wb = dec('xl/workbook.xml'), rels = dec('xl/_rels/workbook.xml.rels');
    if (wb && rels) {
      const sm = /<sheet\b[^>]*?r:id="([^"]+)"/.exec(wb);
      if (sm) {
        const re = new RegExp('<Relationship\\b[^>]*?Id="' + sm[1] + '"[^>]*?>');
        const rm = re.exec(rels);
        if (rm) {
          const tm = /Target="([^"]+)"/.exec(rm[0]);
          if (tm) sheetPath = tm[1].replace(/^\//, '').replace(/^(?!xl\/)/, 'xl/');
        }
      }
    }
    if (!sheetPath || !files.has(sheetPath)) sheetPath = files.has('xl/worksheets/sheet1.xml') ? 'xl/worksheets/sheet1.xml' : Array.from(files.keys()).filter(function (k) { return /^xl\/worksheets\//.test(k); })[0];
    if (!sheetPath) throw new Error('کاربرگی در فایل Excel پیدا نشد.');
    const shared = [];
    const sst = dec('xl/sharedStrings.xml');
    if (sst) {
      const re = /<si\b[^>]*>([\s\S]*?)<\/si>|<si\b[^>]*\/>/g;
      let m;
      while ((m = re.exec(sst))) shared.push(m[1] ? textOf(m[1]) : '');
    }
    const sheet = dec(sheetPath);
    const rows = [];
    const cellRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let m, seq = -1, rowSeq = -1;
    const rowRe = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g;
    let rm;
    while ((rm = rowRe.exec(sheet))) {
      const rattr = rm[1];
      const rr = /\br="(\d+)"/.exec(rattr);
      const ridx = rr ? parseInt(rr[1], 10) - 1 : rowSeq + 1;
      rowSeq = ridx;
      if (ridx > 300000) throw new Error('تعداد سطرهای فایل Excel بیش از حد است.');
      const row = [];
      seq = -1;
      cellRe.lastIndex = 0;
      const body = rm[2] || '';
      while ((m = cellRe.exec(body))) {
        const attrs = m[1], inner = m[2] || '';
        const ref = /\br="([A-Z]+\d+)"/.exec(attrs);
        const ci = ref ? colIndex(ref[1]) : seq + 1;
        seq = ci;
        if (ci > 500) continue;
        const t = (/\bt="([^"]+)"/.exec(attrs) || [])[1];
        let val = '';
        if (t === 'inlineStr') val = textOf(inner);
        else {
          const v = /<v>([\s\S]*?)<\/v>/.exec(inner);
          if (v) {
            const raw = xmlUnesc(v[1]);
            if (t === 's') val = shared[parseInt(raw, 10)] || '';
            else if (t === 'str') val = raw;
            else if (t === 'b') val = raw === '1' ? 'TRUE' : 'FALSE';
            else if (t === 'e') val = '';
            else { const n = parseFloat(raw); val = Number.isFinite(n) ? n : raw; }
          }
        }
        while (row.length < ci) row.push('');
        row[ci] = val;
      }
      while (rows.length < ridx) rows.push([]);
      rows[ridx] = row;
    }
    return rows.filter(function (r) { return r.some(function (c) { return c !== '' && c != null; }); });
  }


  /* ------------------------------------------------------------------ *
   *  ورود دسته‌ای بنچ‌مارک‌ها: Name, X, Y, Z, Description
   * ------------------------------------------------------------------ */
  const BM_HEAD = {
    name: ['name', 'id', 'point', 'pt', 'bm', 'no', 'number', 'نام', 'شماره', 'نقطه'],
    x: ['x', 'e', 'east', 'easting', 'شرقی'],
    y: ['y', 'n', 'north', 'northing', 'شمالی'],
    z: ['z', 'h', 'elev', 'elevation', 'height', 'level', 'rl', 'ارتفاع', 'تراز'],
    desc: ['desc', 'description', 'code', 'remark', 'remarks', 'note', 'notes', 'comment', 'توضیح', 'توضیحات', 'کد']
  };

  function guessBenchmarkMapping(rows) {
    const first = (rows[0] || []).map(function (c) { return String(c == null ? '' : c).trim().toLowerCase().split(/[\s(\[]/)[0]; });
    const found = {};
    first.forEach(function (c, i) {
      Object.keys(BM_HEAD).forEach(function (k) { if (found[k] === undefined && BM_HEAD[k].indexOf(c) >= 0) found[k] = i; });
    });
    if (Object.keys(found).length >= 2 && found.z !== undefined) {
      const m = { name: -1, x: -1, y: -1, z: -1, desc: -1 };
      Object.keys(found).forEach(function (k) { m[k] = found[k]; });
      return { map: m, hasHeader: true, byHeader: true };
    }
    const map = { name: 0, x: 1, y: 2, z: 3, desc: 4 };
    const r0 = rows[0] || [], r1 = rows[1];
    const num = function (v) { return Number.isFinite(C.toNumber(v)); };
    const hasHeader = !!r1 && !num(r0[3]) && num(r1[3]);
    return { map: map, hasHeader: hasHeader, byHeader: false };
  }

  /** خروجی: { items:[{name,x,y,z,desc}], errors:[{row,msg}] } — Z الزامی است. */
  function rowsToBenchmarks(rows, map, opts) {

    let layers = []; try { layers = C.normalizeLayers(s.layers || []).layers; } catch (e) { layers = []; }
    o.layers = layers.map(function (l) { return { name: l.name, offset: l.offset, from: l.from, to: l.to }; });
    try {
      if (sts.length >= 2 && C.validateAxis(s.points, st).ok && C.validateSections(s.sections, st).ok) {
        const secs = C.computeSections(s.points, s.sections, Object.assign({}, st, { sectionMode: 'point' }), s.mids);
        o.ok = true;
        for (let i = 1; i < secs.length; i++) {
          const w0 = (secs[i - 1].left.width || 0) + (secs[i - 1].right.width || 0), w1 = (secs[i].left.width || 0) + (secs[i].right.width || 0);
          o.area += (w0 + w1) / 2 * (secs[i].station - secs[i - 1].station);
        }
        o.hasEdges = secs.some(function (q) { return ((q.left.width || 0) + (q.right.width || 0)) > 1e-9; });
        (s.mats || []).forEach(function (m) {
          try { const inf = C.matInfo(m, layers, secs); if (inf.ok) o.mats.push({ name: m.name || '—', vol: C.matVolume(secs, inf.lo, inf.hi, inf.t).total, t: inf.t }); } catch (e) { /* ignore */ }
        });
        const list = (s.staked && s.staked._) || [];
        secs.forEach(function (q) {
          const sides = stakeSides(q, s, secs), k = String(Math.round(q.station * 1000)), whole = list.indexOf(k) >= 0;
          o.stkT += sides.length; sides.forEach(function (sd) { if (whole || list.indexOf(k + ':' + sd) >= 0) o.stkN++; });

      }

  }
  function projCompute(p) {
    const cs = p.settings, chips = [];
    if (cs.coordSystem === 'UTM') {
      chips.push('UTM'); const dt = DATUMS.find(function (x) { return x[0] === cs.datum; }); if (cs.datum) chips.push(dt ? dt[1] : cs.datum);
      if (cs.utmZone) chips.push('زون ' + cs.utmZone); if (cs.hemisphere) chips.push(cs.hemisphere === 'S' ? 'جنوبی' : 'شمالی');
    } else if (cs.coordSystem) chips.push('محلی');
    const streets = p.streets.map(function (s) { return projStreetInfo(p, s); });
    const withLen = streets.filter(function (x) { return x.len > 0; }), withEdges = streets.filter(function (x) { return x.hasEdges; });
    return { p: p, chips: chips, streets: streets, n: streets.length, len: withLen.length ? withLen.reduce(function (a, x) { return a + x.len; }, 0) : NaN, area: withEdges.length ? withEdges.reduce(function (a, x) { return a + x.area; }, 0) : NaN };
  }

  /** شیب طولی ٪ از این نقطه تا نقطه‌ی بعد (فقط نمایشی؛ از Z و کیلومتراژ) */
  function lonSlope(i) {
    const pts = P().points, a = pts[i], b = pts[i + 1];
    if (!a || !b) return NaN;
    const s1 = C.toNumber(a.station), s2 = C.toNumber(b.station), z1 = C.toNumber(a.z), z2 = C.toNumber(b.z);
    if (![s1, s2, z1, z2].every(fin) || !(s2 > s1)) return NaN;
    return (z2 - z1) / (s2 - s1) * 100;
  }
  function lonSlopeHtml(i) {
    const v = lonSlope(i);
    if (!fin(v)) return '<span class="muted">—</span>';
    const t = (Math.round(v * 100) / 100 === 0 ? 0 : v);
    return '<input class="cell ltr lon-in ' + (t > 0 ? 'lon-up' : t < 0 ? 'lon-dn' : '') + '" data-lonset="' + i + '" inputmode="decimal" dir="ltr" value="' + (t > 0 ? '+' : '') + C.fmt(t, 2) + '" title="با تغییر این عدد، Z نقطه‌ی بعدی از این شیب ساخته می‌شود" aria-label="شیب طولی ردیف ' + (i + 1) + ' (٪)">';
  }

  function startImport(rows, name) {
    S.impErr = '';
    if (!rows.length) { S.impErr = 'فایل خالی است یا سطر داده‌ای ندارد.'; toast(S.impErr, 'err'); render(); return; }
    let pk = P().settings.columnPreset;
    if (pk === 'PSXYZ') pk = 'PSXYZD';   // پیش‌فرض قدیمی ← پیش‌فرض جدید (همان پنج ستون + توضیح)
    const g = IO.guessMapping(rows, pk);
    const cols = Math.max.apply(null, rows.slice(0, 60).map(function (r) { return r.length; }).concat([1]));
    const roles = IO.mapToRoles(g.map, cols);
    S.imp = { rows: rows, name: name, cols: cols, hasHeader: g.hasHeader, roles: roles, map: IO.rolesToMap(roles), preset: g.preset || 'custom', byHeader: g.byHeader, mode: P().points.length ? 'append' : 'replace', startStation: 0, tplId: '' };
    render();
    const el = $('#impCard'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function loadImportFile(file) {
    toast('در حال خواندن «' + file.name + '» …');
    try {
      let rows;
      if (/\.xlsx$/i.test(file.name)) rows = await IO.readXlsx(new Uint8Array(await file.arrayBuffer()));
      else if (/\.xls$/i.test(file.name)) throw new Error('فرمت قدیمی Excel (.xls) پشتیبانی نمی‌شود. در Excel با «Save As» به .xlsx یا CSV ذخیره کنید.');
      else {
        const buf = await file.arrayBuffer();
        let text = new TextDecoder('utf-8').decode(buf);
        if (text.indexOf('�') >= 0) { try { text = new TextDecoder('windows-1256').decode(buf); } catch (e) { /* ignore */ } }
        rows = IO.parseDelimited(text).rows;
      }
      startImport(rows, file.name);
    } catch (e) { S.impErr = 'فایل «' + file.name + '» خوانده نشد: ' + (e.message || 'خطای نامشخص'); toast(S.impErr, 'err'); render(); }
  }

  async function doImport() {
    const im = S.imp, p = P();
    const res = IO.rowsToPoints(im.rows, im.map, { hasHeader: im.hasHeader, startStation: im.startStation });
    if (!res.points.length) { toast('نقطه‌ی معتبری برای ورود وجود ندارد.', 'err'); return; }
    let msg = res.points.length + ' نقطه به خیابان «' + esc(activeStreet().name) + '» وارد می‌شود.';
    if (res.errors.length) msg += ' <b>' + res.errors.length + ' سطر دارای خطا نادیده گرفته می‌شود.</b>';
    if (im.mode === 'replace' && p.points.length) msg = p.points.length + ' نقطه‌ی فعلی <b>حذف</b> و جایگزین می‌شود. ' + msg;
    if (im.mode === 'replace' && p.points.length || res.errors.length) {
      const ok = await ask(msg + ' ادامه می‌دهید؟', { danger: im.mode === 'replace' && p.points.length > 0, ok: 'ورود' });
      if (!ok) return;
    }
    p.points = im.mode === 'replace' ? res.points : p.points.concat(res.points);
    if (im.preset && im.preset !== 'custom' && IO.PRESETS[im.preset]) p.settings.columnPreset = im.preset;
    S.imp = null; S.ptPage = 0;
    structural();
    toast(res.points.length + ' نقطه وارد شد.');
  }

  function sampleCSV() {
    const lines = ['Point,Station,X,Y,Z,Description'];
    const R = 300, cx = 500000, cy = 3900000;
    for (let i = 0; i < 8; i++) {
      const a = (-20 + i * 6) * Math.PI / 180;
      const x = cx + R * Math.sin(a), y = cy - R * Math.cos(a) + R;
      lines.push([i + 1, C.formatStation(i * 31.4159), C.fmt(x, 3), C.fmt(y, 3), C.fmt(1200 + i * 0.35, 3), i === 0 ? 'ابتدای مسیر' : (i === 7 ? 'انتهای مسیر' : '')].join(','));
    }
    return lines.join('\r\n') + '\r\n';
  }

  /* ============================== ۳) عرض و شیب عرضی ============================== */
  const MODEL_OPTS = [

  /** جهت هر سمت در یک ردیف شیب (برای نمایش در جدول) */
  function dirsCell(mode) {
    const d = C.modeDirs(mode) || { l: 0, r: 0 };
    const one = function (lbl, v) { return '<span class="dr ' + (v > 0 ? 'dn' : v < 0 ? 'up' : 'z') + '">' + lbl + (v > 0 ? ' ↓' : v < 0 ? ' ↑' : ' —') + '</span>'; };
    return one('چپ', d.l) + ' ' + one('راست', d.r);
  }

  /** شیب‌های بی‌کیلومتر و کیلومترهای بدون شیب (برای هشدار و دکمه‌های اصلاح) */
  function slopeSync() {
    const p = P(), ax = axisStations(), key = function (v) { return Math.round(v * 1000); };
    const axKeys = {}, haveKeys = {};
    ax.forEach(function (v) { axKeys[key(v)] = 1; });
    p.sections.forEach(function (r) { if (fin(r.station)) haveKeys[key(r.station)] = 1; });
    return {
      orphans: p.sections.filter(function (r) { return !fin(r.station) || !axKeys[key(r.station)]; }),
      missing: ax.filter(function (v) { return !haveKeys[key(v)]; }),
      axisCount: ax.length
    };
  }

  function secAllTable() {
