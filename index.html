      '<div class="row" style="margin-top:6px"><button class="btn sm primary" data-act="qaApplyMissing">اعمال مقادیر فرم بالا روی کیلومترهای بدون شیب</button></div></div>';
    if (notes) notes.innerHTML = nt;

      pager('slPage', n, size) + '<div class="tbl-wrap"><table><thead><tr><th>کیلومتراژ</th><th>نقطه</th><th>مدل شیب عرضی</th><th>جهت</th><th>عرض چپ</th><th>عرض راست</th><th>شیب چپ (' + kU + ')</th><th>شیب راست (' + kU + ')</th><th>ΔZ چپ</th><th>ΔZ راست</th><th></th></tr></thead><tbody>';
    for (let i = from; i < to; i++) {

        '<td class="nw">' + (rec.auto ? '' : '<button class="btn icon sm" data-act="secAuto" data-i="' + di + '" title="برگشت به حالت خودکار (از ردیف‌های همسایه)" aria-label="برگشت به خودکار">↺</button>') + '<button class="btn icon danger sm" data-act="delSection" data-i="' + di + '" aria-label="حذف شیب این کیلومتراژ">×</button></td></tr>';

  /* ---------- شیب: افزودن سریع، شیب طولی و نمودارها ---------- */
  function axisStations() {
    const seen = {}, out = [];
    P().points.forEach(function (q) { if (fin(q.station) && !seen[Math.round(q.station * 1000)]) { seen[Math.round(q.station * 1000)] = 1; out.push(q.station); } });
    return out.sort(function (a, b) { return a - b; });
  }

  /** کشویی کیلومتر با ابتدا/انتهای واقعی: گزینه‌ی ابتدا (برای «از») یا انتها (برای «تا») مقدار خالی = دنبال‌کردن محور دارد */
  function rangeSelect(attrs, cur, which) {
    const base = axisStations(), c = fin(cur) ? cur : null;
    const first = base[0], last = base[base.length - 1];
    const sts = base.slice();
    if (c !== null && !sts.some(function (v) { return Math.abs(v - c) < 1e-6; })) { sts.push(c); sts.sort(function (a, b) { return a - b; }); }
    return '<select ' + attrs + '>' + sts.map(function (v) {
      const edge = which === 'from' ? Math.abs(v - first) < 1e-6 : Math.abs(v - last) < 1e-6;
      const selected = c === null ? edge : (Math.abs(v - c) < 1e-6 || (edge && c !== null && false));
      return '<option value="' + (edge ? '' : v) + '"' + (selected ? ' selected' : '') + '>' + esc(stn(v)) + '</option>';
    }).join('') + '</select>';
  }
  function rangeCell(path, cur, which) {
    if (!axisStations().length) return inp(path, cur, { t: 'stn', re: true, ph: which === 'from' ? 'ابتدا' : 'انتها' });
    return rangeSelect('class="cell sel" data-p="' + path + '" data-t="ssel" data-re="1" aria-label="' + (which === 'from' ? 'از کیلومتراژ' : 'تا کیلومتراژ') + '"', cur, which);
  }
  /** متن بازه‌ی عددی (null = ابتدا/انتهای واقعی محور) */
  function rangeText(from, to) {
    const base = axisStations(); if (!base.length) return '—';
    const a = from === null || from === undefined ? base[0] : from, b = to === null || to === undefined ? base[base.length - 1] : to;
    return '<bdi dir="ltr">' + esc(stLabel(a)) + '</bdi> تا <bdi dir="ltr">' + esc(stLabel(b)) + '</bdi>';
  }

      field('عرض راست (' + unitL() + ')', '<input class="inp ltr" id="qaWR" dir="ltr" inputmode="decimal" placeholder="مثلاً 3.5">') +

      '<div id="qaInfo" class="muted small" style="margin-top:8px"></div></section>';
  }

  /* ---------- نقاط میانی بین محور و لبه‌ها ---------- */
  /** برای هر نقطه‌ی میانی: چند مقطع در بازه‌اش است و در چندتای آن‌ها اعمال شد */
  function midStats() {
    const r = calc(), p = P(), norm = C.normalizeMids(p.mids).mids, out = {};
    norm.forEach(function (m) {
      let cover = 0, applied = 0;
      (r.sections || []).forEach(function (sec) { if (C.midCovers(m, sec.station)) { cover++; if (sec['mid_' + m.id]) applied++; } });
      out[m.id] = { cover: cover, applied: applied };
    });
    return out;
  }

  function midsCard() {
    const p = P(), sts = axisStations(), mids = p.mids;
    let h = '<section class="card" id="midCard"><h2>نقاط میانی بین محور و لبه‌ها — خیابان «' + esc(activeStreet().name) + '»</h2>';
    if (!sts.length) return h + '<div class="msg warn">نقطه‌ی محوری با کیلومتراژ برای این خیابان بارگذاری نشده است.</div></section>';
    h += '<div id="midMsgs"></div><div class="grid2">' +
      field('سمت', '<select class="inp" id="mdSide"><option value="left">چپ</option><option value="right">راست</option><option value="both">هر دو طرف</option></select>') +
      field('نوع', '<select class="inp" id="mdKind"><option value="one">میخ تکی</option><option value="many">چند میخ</option></select>') +
      '</div><div id="mdCountBox" hidden>' + field('تعداد میخ', '<input class="inp ltr" id="mdCount" dir="ltr" inputmode="numeric" autocomplete="off" value="2">') + '</div>' +
      '<div class="muted small" style="margin:10px 2px 4px">فاصله از محور (' + unitL() + ') — در حالت «هر دو طرف» برای چپ و راست یکسان است</div>' +
      '<div id="mdOffs" class="grid3">' + mdOffHtml(1, []) + '</div>' +
      '<details class="qa-more"><summary>گزینه‌های بیشتر</summary><div class="grid2" style="margin-top:8px">' +
      field('نام (خالی = خودکار)', '<input class="inp" id="mdName" autocomplete="off">') +
      field('کد لاتین (خالی = خودکار)', '<input class="inp ltr" id="mdTag" dir="ltr" autocomplete="off">') +
      field('از کیلومتر', rangeSelect('class="inp" id="mdFrom"', null, 'from')) +
      field('تا کیلومتر', rangeSelect('class="inp" id="mdTo"', null, 'to')) +
      field('شیب ٪ (بدون علامت)', '<input class="inp ltr" id="mdSlope" dir="ltr" inputmode="decimal" autocomplete="off" placeholder="خالی = شیب همان سمت">') +
      field('dz دستی (' + unitL() + ')', '<input class="inp ltr" id="mdDz" dir="ltr" inputmode="text" autocomplete="off" placeholder="خالی = خودکار">') +
      '</div></details>' +
      '<div class="row" style="margin-top:10px"><button class="btn primary grow" data-act="midAdd">اعمال</button></div>';
    if (mids.length) {
      const st = midStats();
      h += '<h3 style="margin-top:14px">نقاط میانی تعریف‌شده (' + mids.length + ')</h3><div class="tbl-wrap"><table id="midTbl"><thead><tr><th>نام</th><th>کد</th><th>سمت</th><th>فاصله</th><th>از</th><th>تا</th><th>شیب ٪</th><th>dz دستی</th><th>اعمال‌شده</th><th></th></tr></thead><tbody>';
      const norm = C.normalizeMids(mids).mids, byIdx = {};
      norm.forEach(function (m) { byIdx[m.index] = m; });
      mids.forEach(function (m, i) {

  /** مقدارهای فرم افزودن؛ در صورت خطا پیام می‌دهد و null برمی‌گرداند */

  /** اعمال مقدارهای فرم روی نقاط محور داخل بازه (فیلتر اختیاری: فقط کیلومترهای بدون شیب) */
  function qaApply(v, onlyMissing) {

    if (onlyMissing) sts = sts.filter(function (x) { return !p.sections.some(function (r) { return fin(r.station) && Math.abs(r.station - x) < 1e-6; }); });

  const stLabel = function (v) { return S.project.settings.stationDisplay === 'numeric' ? C.fmt(v, 0) : C.formatStation(v, 0); };

  /**

  /**
   * طرح یک مقطع عرضی (دید رو به جهت افزایش کیلومتراژ: چپ در سمت چپ تصویر).
   * مقیاس قائم اغراق‌آمیز است تا شیب‌های کم دیده شوند.

  function crossSectionSVG(o) {
    const compact = !!o.compact, W = compact ? 260 : 340, H = compact ? 92 : 150, padX = compact ? 22 : 30;
    const top = compact ? 18 : 30, bot = compact ? 10 : 34, vmax = compact ? 15 : 34;
    const kd = o.unit === 'ratio' ? 1 : 100, dirs = C.modeDirs(o.mode) || { l: 0, r: 0 };
    const wL = Math.max(+o.wL || 0, 0), wR = Math.max(+o.wR || 0, 0), total = Math.max(wL + wR, 1e-6);

    const fmtS = function (v) { return C.fmt(v, 2).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, ''); };
    let g = '<polygon points="' + x0 + ',' + yb + ' ' + x0 + ',' + yL.toFixed(1) + ' ' + xA.toFixed(1) + ',' + yA.toFixed(1) + ' ' + x1 + ',' + yR.toFixed(1) + ' ' + x1 + ',' + yb + '" fill="var(--axis-soft)"/>';
    g += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + yA.toFixed(1) + '" y2="' + yA.toFixed(1) + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>';
    g += '<polyline points="' + x0 + ',' + yL.toFixed(1) + ' ' + xA.toFixed(1) + ',' + yA.toFixed(1) + ' ' + x1 + ',' + yR.toFixed(1) + '" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    g += '<line x1="' + xA.toFixed(1) + '" x2="' + xA.toFixed(1) + '" y1="' + (yA - 10).toFixed(1) + '" y2="' + yb + '" stroke="var(--axis)" stroke-width="1" stroke-dasharray="2 3"/>';
    g += '<circle cx="' + x0 + '" cy="' + yL.toFixed(1) + '" r="4" fill="var(--left)"/><circle cx="' + x1 + '" cy="' + yR.toFixed(1) + '" r="4" fill="var(--right)"/><circle cx="' + xA.toFixed(1) + '" cy="' + yA.toFixed(1) + '" r="3.5" fill="var(--axis)"/>';

      g += '<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="3.6" fill="var(--mid)" stroke="var(--card)" stroke-width="1"/>';
      if (!compact) g += '<text x="' + mx.toFixed(1) + '" y="' + (my + 13).toFixed(1) + '" text-anchor="middle" font-size="9" font-weight="700" fill="var(--mid)">' + esc(m.name) + ' ' + C.fmt(m.offset, 2) + '</text>';
    });

    if (!compact) {
      const yd = H - 20;
      const dim = function (xa, xb, w, color) {
        if (xb - xa < 4) return '';
        return '<line x1="' + xa.toFixed(1) + '" x2="' + xb.toFixed(1) + '" y1="' + yd + '" y2="' + yd + '" stroke="' + color + '" stroke-width="1.5"/><line x1="' + xa.toFixed(1) + '" x2="' + xa.toFixed(1) + '" y1="' + (yd - 4) + '" y2="' + (yd + 4) + '" stroke="' + color + '"/><line x1="' + xb.toFixed(1) + '" x2="' + xb.toFixed(1) + '" y1="' + (yd - 4) + '" y2="' + (yd + 4) + '" stroke="' + color + '"/>' +
          tl(((xa + xb) / 2).toFixed(1), yd + 15, fmtS(w) + ' ' + unitL(), color, 'middle');
      };
      g += dim(x0, xA, wL, 'var(--left)') + dim(xA, x1, wR, 'var(--right)');
      g += tl(xA.toFixed(1), 11, o.title || '', 'var(--ink)', 'middle');
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(o.title || C.MODE_FA[o.mode] || '') + '" style="display:block;max-width:' + (compact ? 300 : 380) + 'px;margin:0 auto;height:auto;direction:ltr">' + g + '</svg>';
  }

  /** نمودار مدل شیب عرضی: یک شکل برای هر مدل (مقاطع متوالیِ هم‌مدل ادغام می‌شوند) با بازه‌ی کیلومتراژ */
  function crossChartsHTML() {
    const p = P(), r = calc(), s = p.settings;
    if (!r.sections) return '<div class="muted small">ابتدا خطاهای محور و شیب را رفع کنید.</div>';
    let groups = C.groupCrossModels(r.sections, s.slopeUnit), merged = false;
    if (!groups.length) return '<div class="muted small">هنوز شیب عرضی اعمال نشده است؛ پس از «افزودن» شکل مدل مقطع اینجا رسم می‌شود.</div>';
    if (groups.length > 8) { groups = C.mergeGroupsByMode(groups); merged = true; }
    const LIM = 12, list = S.crossAll ? groups : groups.slice(0, LIM);
    const kU = s.slopeUnit === 'ratio' ? 'm/m' : '٪';
    const rg = function (a, b, d) { return a === b ? C.fmt(a, d) : C.fmt(a, d) + ' تا ' + C.fmt(b, d); };
    let h = '<p class="muted small">هر شکل یک مدل مقطع در بازه‌ی نوشته‌شده است (مقطع‌های متوالیِ هم‌مدل در یک شکل آمده‌اند). مقیاس قائم برای دیده شدن شیب‌ها اغراق‌آمیز است؛ عرض‌ها و شیب‌ها روی شکل نوشته شده‌اند.' + (merged ? ' چون مقدارها در طول مسیر تغییر می‌کنند، شکل با بیشینه‌ی مقدارها رسم شده و دامنه‌ی تغییر زیر شکل نوشته شده است.' : '') + '</p><div class="xs-grid">';
    list.forEach(function (g) {
      const title = C.MODE_FA[g.mode] || g.mode;
      h += '<div class="xs-card"><div class="xs-head"><b>' + esc(title) + '</b><span class="muted small"><bdi>' + esc(stLabel(g.from)) + '</bdi> تا <bdi>' + esc(stLabel(g.to)) + '</bdi> • ' + g.count + ' مقطع</span></div>' +
        crossSectionSVG({ mode: g.mode, wL: g.wL, wR: g.wR, sL: g.sL, sR: g.sR, unit: s.slopeUnit, title: title, mids: g.rep ? C.sideKeys(g.rep).filter(function (k) { return g.rep[k].kind === 'mid'; }).map(function (k) { const q = g.rep[k]; return { side: q.edge, offset: q.width, dz: q.dz, name: q.midName || q.tag }; }) : [] }) +
        (g.merged ? '<div class="muted small xs-rng">عرض چپ ' + rg(g.rng.wL[0], g.rng.wL[1], 2) + ' • عرض راست ' + rg(g.rng.wR[0], g.rng.wR[1], 2) + (g.mode !== 'flat' ? ' • شیب چپ ' + rg(g.rng.sL[0], g.rng.sL[1], 2) + ' • شیب راست ' + rg(g.rng.sR[0], g.rng.sR[1], 2) + ' ' + kU : '') + '</div>' : '') + '</div>';
    });
    h += '</div>';
    if (groups.length > LIM) h += '<div class="row" style="margin-top:8px"><button class="btn sm" data-act="crossAll">' + (S.crossAll ? 'نمایش ۱۲ مورد اول' : 'نمایش همه‌ی ' + groups.length + ' شکل') + '</button></div>';
    return h;
  }

  function slopesCharts() {
    const p = P();
    const prof = C.longitudinalProfile(p.points);
    const info = $('#lonInfo'), lon = $('#lonChart'), cr = $('#crossChart');
    const sg = prof.segments, valid = sg.filter(function (q) { return fin(q.slopePct); });
    const up = valid.reduce(function (a, q) { return q.slopePct > a.slopePct ? q : a; }, valid[0] || { slopePct: -Infinity });
    const dn = valid.reduce(function (a, q) { return q.slopePct < a.slopePct ? q : a; }, valid[0] || { slopePct: Infinity });
    const len = prof.points.length ? prof.points[prof.points.length - 1].station - prof.points[0].station : 0;
    const avg = len > 0 ? (prof.points[prof.points.length - 1].z - prof.points[0].z) / len * 100 : NaN;
    const pc = function (v) { return (v > 0 ? '+' : '') + C.fmt(v, 2) + '٪'; };
    if (info) {
      if (prof.points.length < 2) info.innerHTML = '<div class="msg warn">برای شیب طولی دست‌کم دو نقطه‌ی محور با کیلومتراژ و Z لازم است. نقاط را در تب «محور» بارگذاری کنید.</div>';
      else {
        const lsize = 50, lpages = Math.max(1, Math.ceil(sg.length / lsize));
        if (S.lnPage >= lpages) S.lnPage = 0;
        const shown = sg.slice(S.lnPage * lsize, S.lnPage * lsize + lsize), lastPt = prof.points[prof.points.length - 1];
        info.innerHTML = '<div class="kv"><b>طول مسیر</b><span class="num">' + C.fmt(len, 3) + ' ' + unitL() + '</span>' +
          '<b>تعداد بازه‌ها</b><span class="num">' + sg.length + '</span><b>آخرین کیلومتر</b><span class="num">' + esc(stLabel(lastPt.station)) + ' (Z = ' + fx(lastPt.z) + ')</span>' +
          (valid.length ? '<b>بیشترین شیب بالارو</b><span class="num">' + C.fmt(up.slopePct, 3) + ' ٪ (' + esc(stLabel(up.from)) + ' تا ' + esc(stLabel(up.to)) + ')</span>' +
            '<b>بیشترین شیب سرازیر</b><span class="num">' + C.fmt(dn.slopePct, 3) + ' ٪ (' + esc(stLabel(dn.from)) + ' تا ' + esc(stLabel(dn.to)) + ')</span>' +
            '<b>شیب میانگین کل مسیر</b><span class="num">' + C.fmt(avg, 3) + ' ٪</span>' : '') + '</div>' +
          '<p class="muted small">شیب طولی = ΔZ ÷ فاصله × ۱۰۰. مثبت = بالارو (در جهت افزایش کیلومتراژ)، منفی = سرازیر.</p>' +
          pager('lnPage', sg.length, lsize) + '<div class="tbl-wrap"><table><thead><tr><th>از کیلومتراژ</th><th>تا کیلومتراژ</th><th>فاصله</th><th>ΔZ</th><th>شیب طولی (٪)</th></tr></thead><tbody>' +
          shown.map(function (q) {
            return '<tr><td class="n">' + esc(stLabel(q.from)) + '</td><td class="n">' + esc(stLabel(q.to)) + '</td><td class="n">' + C.fmt(q.dS, 3) + '</td><td class="n" style="color:var(--' + (q.dZ > 0 ? 'ok' : q.dZ < 0 ? 'err' : 'muted') + ')">' + sgn(q.dZ) + '</td><td class="n" style="color:var(--' + (q.slopePct > 0 ? 'ok' : q.slopePct < 0 ? 'err' : 'muted') + ')">' + (fin(q.slopePct) ? (q.slopePct > 0 ? '+' : '') + C.fmt(q.slopePct, 3) : '—') + '</td></tr>';
          }).join('') + '</tbody></table></div>' + pager('lnPage', sg.length, lsize);
      }
    }
    if (lon) {
      if (prof.points.length < 2) lon.innerHTML = '<div class="muted small">داده‌ی کافی نیست.</div>';
      else {
        const segs = thin(prof.segments, 400);
        const prio = segs.filter(function (q) { return fin(q.slopePct); }).sort(function (a, b) { return Math.abs(b.slopePct) - Math.abs(a.slopePct); });
        const labels = prio.map(function (q) { return { x: (q.from + q.to) / 2, y: (q.zFrom + q.zTo) / 2, text: pc(q.slopePct), color: q.slopePct > 0 ? 'var(--ok)' : q.slopePct < 0 ? 'var(--err)' : 'var(--muted)' }; });
        lon.innerHTML = chartSVG({
          label: 'نیمرخ طولی', yd: 2, labels: labels,
          series: [{ pts: thin(prof.points, 400).map(function (q) { return [q.station, q.z]; }), color: 'var(--axis)', hide: true }],
          segs: segs.map(function (q) { return { x1: q.from, y1: q.zFrom, x2: q.to, y2: q.zTo, color: q.dZ > 0 ? 'var(--ok)' : q.dZ < 0 ? 'var(--err)' : 'var(--muted)' }; }),
          legend: lg('var(--ok)', 'بالارو') + lg('var(--err)', 'سرازیر') + '<span class="muted">محور Z (' + unitL() + ') — عدد روی هر بازه = شیب طولی ٪</span>'
        }) + (valid.length ? '<div class="lon-sum small"><span>بیشترین بالارو <b class="num" style="color:var(--ok)">' + pc(up.slopePct) + '</b></span><span>بیشترین سرازیر <b class="num" style="color:var(--err)">' + pc(dn.slopePct) + '</b></span><span>میانگین کل مسیر <b class="num">' + pc(avg) + '</b></span></div>' : '');
      }
    }
    if (cr) cr.innerHTML = crossChartsHTML();
    const qa = $('#qaInfo');
    if (qa) {
      const n = p.points.filter(function (q) { return fin(q.station); }).length;
      qa.textContent = 'اعمال‌شده روی ' + p.sections.length + ' از ' + n + ' نقطه‌ی محور خیابان «' + activeStreet().name + '».';
    }
    qaModelUi();
  }

      '<div id="lyMsgs"></div>';

    else {

      p.layers.forEach(function (l, i) {

  /* ============================== ۴) جدول سه‌نقطه‌ای ============================== */

    if (r.secV.errors.length) h += msgList(r.secV.errors, 'err', 4) + '<div class="row"><a class="btn sm" href="#/slopes">رفتن به شیب‌ها</a></div>';

  function bmInfo(su, info) {
    if (!su) return '';

    if (!bm) return '<div class="msg warn small">بنچ‌مارک این استقرار انتخاب نشده یا حذف شده است.</div>';
    const it = function (label, val) { return '<span class="bm-it">' + label + ' <span class="num">' + val + '</span></span>'; };
    return '<div class="bm-info small"><span class="bm-it"><b>بنچ‌مارک:</b> <bdi>' + esc(bm.name || 'بدون نام') + '</bdi></span>' + it('Z', fin(bm.z) ? fx(bm.z) : '—') +
      (fin(bm.x) && fin(bm.y) ? it('X', fx(bm.x)) + it('Y', fx(bm.y)) : '') + (fin(C.toNumber(su.bs)) ? it('BS', fx(C.toNumber(su.bs))) : '') + (info.ok ? it('HI', fx(info.hi)) : '') +
      (bm.desc ? '<div class="bm-desc"><bdi>' + esc(bm.desc) + '</bdi></div>' : '') + '</div>';

  function tableCard() {
    const p = P(), r = calc();
    let h = '<h2 style="margin:14px 2px 8px">جدول مختصات</h2>';
    if (!r.sections) return '';
    const ll = layerList().layers;
    if (S.tbLayer && !ll.some(function (l) { return l.id === S.tbLayer; })) S.tbLayer = '';
    const layer = S.tbLayer ? ll.find(function (l) { return l.id === S.tbLayer; }) : null;
    const secs = layer ? C.applyLayer(r.sections, layer) : r.sections;
    h += '<div class="card"><div class="row"><label class="field grow"><span>لایه</span><select class="inp" id="tbLayer"><option value="">خط پروژه</option>' +
      ll.map(function (l) { return '<option value="' + esc(l.id) + '"' + (l.id === S.tbLayer ? ' selected' : '') + '>' + esc(l.name) + '</option>'; }).join('') + '</select></label>' +
      '<div class="field"><span>مقاطع</span><b class="num">' + secs.length + '</b></div>' +
      '<button class="btn" data-act="txOpen">خروجی</button></div></div>';
    const n = secs.length;
    if (!n) return h + '<div class="msg warn">هیچ مقطعی در محدوده‌ی این لایه نیست.</div>';
    const pages = Math.max(1, Math.ceil(n / TABLE_STATIONS)); if (S.tPage >= pages) S.tPage = 0;
    h += pager('tPage', n, TABLE_STATIONS);
    h += '<div class="tbl-wrap"><table id="calcTbl"><thead><tr><th>کیلومتراژ</th><th>Z</th><th>نام</th><th>X</th><th>Y</th><th>فاصله از محور</th><th>توضیحات</th></tr></thead><tbody>';
    const from = S.tPage * TABLE_STATIONS, to = Math.min(n, from + TABLE_STATIONS);
    tblRows(secs, from, to).forEach(function (g) {
      g.rows.forEach(function (q, k) {
        h += '<tr class="s-' + (SIDE_CLS[q.side] ? q.side : 'mid') + (k === g.rows.length - 1 ? ' grp-end' : '') + '">' +
          (k === 0 ? '<td class="stn n" rowspan="' + g.rows.length + '">' + esc(stn(g.station)) + '</td>' : '') +
          '<td class="n zc">' + fx(q.z) + '</td><td><span class="chip ' + sideCls(q.side) + '">' + esc(q.name) + '</span></td>' +
          '<td class="n">' + fx(q.x) + '</td><td class="n">' + fx(q.y) + '</td>' +
          '<td class="n">' + C.fmt(q.dist, 3) + '</td><td class="desc-c">' + esc(q.desc) + '</td></tr>';
      });
    });
    return h + '</tbody></table></div>' + pager('tPage', n, TABLE_STATIONS);
  }

  /** ردیف‌های جدول مختصات: برای هر مقطع از چپ به راست (لبه‌ی چپ، میانی‌های چپ، محور، میانی‌های راست، لبه‌ی راست) */
  function tblRows(secs, from, to) {
    const pts = P().points, out = [];
    for (let i = from; i < to; i++) {
      const sec = secs[i], rows = [];
      C.sideKeys(sec).forEach(function (side) {
        const q = sec[side];
        let desc = '', dist = 0;
        if (side === 'axis') { const pt = pts.find(function (x) { return fin(C.toNumber(x.station)) && Math.abs(C.toNumber(x.station) - sec.station) < 1e-6; }); desc = pt && pt.desc ? pt.desc : ''; }
        else { dist = q.width; desc = side === 'left' ? 'لبه‌ی چپ' : side === 'right' ? 'لبه‌ی راست' : (q.midName || ''); }
        rows.push({ side: side, name: q.name, x: q.x, y: q.y, z: q.z, dist: dist, desc: desc });
      });
      out.push({ station: sec.station, rows: rows });
    }
    return out;
  }

  /** گزارش PDF جدول مختصات لایه‌ی انتخاب‌شده (از «ذخیره به‌صورت PDF» دستگاه) */
  /** مشخصات عرضی و شیب عرضی مقاطع (دامنه‌ی اعداد؛ اگر یکسان باشد یک عدد) */
  function crossProps(secs) {
    const st = P().settings, ratio = st.slopeUnit === 'ratio', d = ratio ? 4 : 2, kU = ratio ? 'm/m' : '٪';
    const rng = function (vals, dd) {
      let a = Infinity, b = -Infinity; vals.forEach(function (v) { if (fin(v)) { a = Math.min(a, v); b = Math.max(b, v); } });
      if (!isFinite(a)) return '—';
      return Math.abs(b - a) < 1e-9 ? C.fmt(a, dd) : C.fmt(a, dd) + ' تا ' + C.fmt(b, dd);
    };
    const bdi = function (t) { return '<bdi dir="ltr">' + esc(t) + '</bdi>'; };
    const wl = secs.map(function (x) { return x.left.width; }), wr = secs.map(function (x) { return x.right.width; });
    const tot = secs.map(function (x) { return x.left.width + x.right.width; });
    const sl = secs.map(function (x) { return Math.abs(x.left.crossfall || 0); }), sr = secs.map(function (x) { return Math.abs(x.right.crossfall || 0); });
    const models = [];
    C.groupCrossModels(secs, st.slopeUnit).forEach(function (g) { const n = C.MODE_FA[g.mode] || g.mode; if (models.indexOf(n) < 0) models.push(n); });
    return {

      slopes: 'شیب چپ ' + bdi(rng(sl, d)) + ' • شیب راست ' + bdi(rng(sr, d)) + ' ' + kU + (models.length ? ' — ' + esc(models.length > 2 ? models.slice(0, 2).join('، ') + '،…' : models.join('، ')) : '')
    };
  }

  /* ---------- خروجی جدول (پنجره‌ی کوچک: PDF یا متن) ---------- */
  function slugFa(s) { return slug(s).replace(/_+/g, '-'); }

  /** ردیف‌های جدول مختصات با ترتیب چپ، محور، راست و ستون توضیحات (مثل تب جدول) */
  function tableExportRows(secs, layerName) {
    const st = P().settings;
    const base = C.buildPointRows(secs, st, layerName || '');
    const by = {};
    base.forEach(function (r) { by[Math.round(r.station * 1000) + '|' + r.point] = r; });
    const out = [];
    tblRows(secs, 0, secs.length).forEach(function (g) {
      g.rows.forEach(function (q) {
        const r = by[Math.round(g.station * 1000) + '|' + q.name];
        if (r) { r.note = q.desc; out.push(r); }
      });
    });
    return out;
  }

  /* ============================== گزارش مسیر (PDF، یک صفحه) ============================== */
  function rpNice(range, n) {
    const raw = Math.max(range, 1e-9) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * mag;
  }
  const RP = { navy: '#0b2a40', gold: '#c9962b', left: '#1565c0', right: '#2e7d32', up: '#1b7a3d', dn: '#c62828', grid: '#d5dde3', mut: '#5a6875' };
  const RP_FONT = 'font-family:Vazirmatn,Tahoma,sans-serif;direction:ltr;display:block';

  /** بازه‌های هم‌جهت نیمرخ طولی: بالارو، سرازیر یا تخت (شیب کوچک‌تر از حد = تخت) */
  function rpRanges(segs, tol) {
    const dirOf = function (q) { return !fin(q.slopePct) || Math.abs(q.slopePct) < tol ? 'flat' : q.slopePct > 0 ? 'up' : 'dn'; };
    const out = [];
    segs.forEach(function (q) {
      const d = dirOf(q), last = out[out.length - 1];
      if (last && last.dir === d) { last.to = q.to; last.zTo = q.zTo; last.len += q.dS; last.dz += q.dZ; if (Math.abs(q.slopePct) > Math.abs(last.max)) last.max = q.slopePct; last.n++; }
      else out.push({ dir: d, from: q.from, to: q.to, zFrom: q.zFrom, zTo: q.zTo, len: q.dS, dz: q.dZ, max: fin(q.slopePct) ? q.slopePct : 0, n: 1 });
    });
    out.forEach(function (r) { r.avg = r.len > 0 ? r.dz / r.len * 100 : 0; });
    return out;
  }

  /** نیمرخ طولی چاپی با شیب نوشته‌شده روی بازه‌ها (مثل تب شیب) */
  function rpProfile(prof, W, H, ranges) {
    const pts = prof.points, segs = prof.segments;
    if (pts.length < 2) return '<div class="rp-none">برای نیمرخ طولی دست‌کم دو نقطه‌ی محور با Z لازم است.</div>';
    const L = 52, R = 12, T = 16, B = 28;
    let x0 = pts[0].station, x1 = pts[pts.length - 1].station, y0 = Infinity, y1 = -Infinity;
    pts.forEach(function (q) { y0 = Math.min(y0, q.z); y1 = Math.max(y1, q.z); });
    if (y1 - y0 < 1e-9) { y0 -= 1; y1 += 1; }
    const pad = (y1 - y0) * 0.22; y0 -= pad * 0.5; y1 += pad;
    const sx = function (v) { return L + (v - x0) / Math.max(x1 - x0, 1e-9) * (W - L - R); }, sy = function (v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); };
    let g = '';
    const ys = rpNice(y1 - y0, 4), xs = rpNice(x1 - x0, 7);
    for (let v = Math.ceil(y0 / ys) * ys; v <= y1 + 1e-9; v += ys)
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + sy(v).toFixed(1) + '" y2="' + sy(v).toFixed(1) + '" stroke="' + RP.grid + '" stroke-width=".6"/><text x="' + (L - 5) + '" y="' + (sy(v) + 3).toFixed(1) + '" text-anchor="end" font-size="8.5" fill="' + RP.mut + '">' + C.fmt(v, 2) + '</text>';
    for (let v = Math.ceil(x0 / xs) * xs; v <= x1 + 1e-9; v += xs)
      g += '<line x1="' + sx(v).toFixed(1) + '" x2="' + sx(v).toFixed(1) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="' + RP.grid + '" stroke-width=".5" stroke-dasharray="2 3"/><text x="' + sx(v).toFixed(1) + '" y="' + (H - B + 12) + '" text-anchor="middle" font-size="8.5" fill="' + RP.mut + '">' + esc(stLabel(v)) + '</text>';
    (ranges || []).forEach(function (rg) {
      if (rg.dir === 'flat') return;
      g += '<rect x="' + sx(rg.from).toFixed(1) + '" y="' + T + '" width="' + Math.max(0, sx(rg.to) - sx(rg.from)).toFixed(1) + '" height="' + (H - T - B) + '" fill="' + (rg.dir === 'up' ? RP.up : RP.dn) + '" opacity=".07"/>';
    });
    const poly = pts.map(function (q, i) { return (i ? 'L' : 'M') + sx(q.station).toFixed(1) + ' ' + sy(q.z).toFixed(1); }).join('');
    g += '<path d="' + poly + 'L' + sx(x1).toFixed(1) + ' ' + (H - B) + 'L' + sx(x0).toFixed(1) + ' ' + (H - B) + 'Z" fill="' + RP.navy + '" opacity=".07"/>';
    thin(segs, 300).forEach(function (q) {
      g += '<line x1="' + sx(q.from).toFixed(1) + '" y1="' + sy(q.zFrom).toFixed(1) + '" x2="' + sx(q.to).toFixed(1) + '" y2="' + sy(q.zTo).toFixed(1) + '" stroke="' + (q.dZ > 0 ? RP.up : q.dZ < 0 ? RP.dn : RP.mut) + '" stroke-width="2.2" stroke-linecap="round"/>';
    });
    if (pts.length <= 60) pts.forEach(function (q) { g += '<circle cx="' + sx(q.station).toFixed(1) + '" cy="' + sy(q.z).toFixed(1) + '" r="1.8" fill="' + RP.navy + '"/>'; });
    const tp = [];
    // نقطه‌های تغییر جهت (بلندترین و پست‌ترین)
    (ranges || []).forEach(function (rg, i) {
      const nx = ranges[i + 1]; if (!nx || rg.dir === 'flat' || nx.dir === 'flat' || rg.dir === nx.dir) return;
      const peak = rg.dir === 'up', x = sx(rg.to), y = sy(rg.zTo); tp.push({ x: x, y: peak ? y - 12 : y + 12 });
      g += '<path d="' + (peak ? 'M' + (x - 4).toFixed(1) + ' ' + (y - 4).toFixed(1) + 'L' + (x + 4).toFixed(1) + ' ' + (y - 4).toFixed(1) + 'L' + x.toFixed(1) + ' ' + (y - 0.5).toFixed(1) + 'Z' : 'M' + (x - 4).toFixed(1) + ' ' + (y + 4).toFixed(1) + 'L' + (x + 4).toFixed(1) + ' ' + (y + 4).toFixed(1) + 'L' + x.toFixed(1) + ' ' + (y + 0.5).toFixed(1) + 'Z') + '" fill="' + RP.gold + '"/>' +
        '<text x="' + x.toFixed(1) + '" y="' + (peak ? y - 9 : y + 17).toFixed(1) + '" text-anchor="middle" font-size="7.5" font-weight="700" fill="' + RP.navy + '" stroke="#fff" stroke-width="2.4" paint-order="stroke">' + esc(stLabel(rg.to)) + ' • ' + C.fmt(rg.zTo, 2) + '</text>';
    });
    // برچسب شیب: بازه‌های پرشیب‌تر اولویت دارند، بدون هم‌پوشانی
    const placed = tp.slice(), cand = segs.filter(function (q) { return fin(q.slopePct); }).sort(function (a, b) { return Math.abs(b.slopePct) - Math.abs(a.slopePct); });
    cand.forEach(function (q) {
      if (placed.length >= 16) return;
      const cx = sx((q.from + q.to) / 2), cy = sy((q.zFrom + q.zTo) / 2), w = 34;
      if (sx(q.to) - sx(q.from) < 18) return;
      if (placed.some(function (p) { return Math.abs(p.x - cx) < w + 12 && Math.abs(p.y - cy) < 14; })) return;
      placed.push({ x: cx, y: cy });
      g += '<text x="' + cx.toFixed(1) + '" y="' + (cy - 5).toFixed(1) + '" text-anchor="middle" font-size="8.5" font-weight="700" fill="' + (q.slopePct > 0 ? RP.up : RP.dn) + '" stroke="#fff" stroke-width="2.6" paint-order="stroke">' + (q.slopePct > 0 ? '+' : '') + C.fmt(q.slopePct, 2) + '٪</text>';
    });
    g += '<rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - B) + '" fill="none" stroke="#9aa8b3" stroke-width=".7"/><text x="' + L + '" y="10" font-size="8.5" fill="' + RP.mut + '">Z (' + unitL() + ')</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="' + RP_FONT + '">' + g + '</svg>';
  }

  /** انتخاب بزرگ‌نمایی و کاشی‌های نقشه برای محدوده‌ی مسیر (Web Mercator) */
  function rpMapSetup(secs, W, H) {
    const st = P().settings;
    if (st.coordSystem !== 'UTM') return null;
    const zone = parseInt(st.utmZone, 10), south = st.hemisphere === 'S';
    const sel = thin(secs, 200).map(function (s) { return C.utmToLatLon(s.axis.x, s.axis.y, zone, south); });
    sel.push.apply(sel, [secs[0].left, secs[0].right, secs[secs.length - 1].left, secs[secs.length - 1].right].map(function (q) { return C.utmToLatLon(q.x, q.y, zone, south); }));
    if (sel.some(function (q) { return !fin(q.lat) || !fin(q.lon) || Math.abs(q.lat) > 84; })) return null;
    const mx = function (lon, z) { return (lon + 180) / 360 * 256 * Math.pow(2, z); };
    const my = function (lat, z) { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 256 * Math.pow(2, z); };
    let z = 17;
    for (; z > 2; z--) {
      const xs = sel.map(function (q) { return mx(q.lon, z); }), ys = sel.map(function (q) { return my(q.lat, z); });
      if (Math.max.apply(null, xs) - Math.min.apply(null, xs) <= W * 0.8 && Math.max.apply(null, ys) - Math.min.apply(null, ys) <= H * 0.8) break;
    }
    const xs = sel.map(function (q) { return mx(q.lon, z); }), ys = sel.map(function (q) { return my(q.lat, z); });
    const cx = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2, cy = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
    const left = cx - W / 2, top = cy - H / 2, tiles = [];
    for (let tx = Math.floor(left / 256); tx <= Math.floor((left + W) / 256); tx++)
      for (let ty = Math.floor(top / 256); ty <= Math.floor((top + H) / 256); ty++)
        tiles.push({ x: tx * 256 - left, y: ty * 256 - top, url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + ty + '/' + tx });
    const midLat = sel[0].lat;
    return { z: z, zone: zone, south: south, tiles: tiles, left: left, top: top, mx: mx, my: my, mpp: 40075016.686 * Math.cos(midLat * Math.PI / 180) / (256 * Math.pow(2, z)) };

  function rpLoadTiles(tiles) {
    return Promise.all(tiles.map(function (t) {
      return new Promise(function (res) {
        const im = new Image(); let done = false;
        const fin_ = function (ok) { if (!done) { done = true; t.ok = ok; res(ok); } };
        im.onload = function () { fin_(true); }; im.onerror = function () { fin_(false); };
        setTimeout(function () { fin_(false); }, 6000); im.src = t.url;
      });
    })).then(function (r) { return r.some(Boolean); });
  }

  /** پلان مسیر؛ با نقشه‌ی ماهواره‌ای (mp) یا بدون آن */
  function rpPlan(secs, W, H, mp) {
    const sel = thin(secs, 400);
    let mpp, pt;
    if (mp) { pt = function (q) { const ll = C.utmToLatLon(q.x, q.y, mp.zone, mp.south); return [mp.mx(ll.lon, mp.z) - mp.left, mp.my(ll.lat, mp.z) - mp.top]; }; mpp = mp.mpp; }
    else {
      let X0 = Infinity, X1 = -Infinity, Y0 = Infinity, Y1 = -Infinity;
      sel.forEach(function (s) { ['left', 'right', 'axis'].forEach(function (k) { const q = s[k]; if (!fin(q.x) || !fin(q.y)) return; X0 = Math.min(X0, q.x); X1 = Math.max(X1, q.x); Y0 = Math.min(Y0, q.y); Y1 = Math.max(Y1, q.y); }); });
      if (!isFinite(X0)) return '<div class="rp-none">مختصاتی برای رسم نیست.</div>';
      const M = 36, dx = Math.max(X1 - X0, 1), dy = Math.max(Y1 - Y0, 1), k = Math.min((W - 2 * M) / dx, (H - 2 * M) / dy), ox = (W - dx * k) / 2, oy = (H - dy * k) / 2;
      pt = function (q) { return [ox + (q.x - X0) * k, H - (oy + (q.y - Y0) * k)]; }; mpp = 1 / k;
    }
    const col = mp ? { l: '#6cb8ff', r: '#74e884', a: '#ffd400', t: '#fff', halo: '#000' } : { l: RP.left, r: RP.right, a: RP.navy, t: RP.navy, halo: '#fff' };
    const path = function (key) { return sel.map(function (s, i) { const p = pt(s[key]); return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(''); };
    let g = '<defs><clipPath id="rpc"><rect width="' + W + '" height="' + H + '" rx="4"/></clipPath></defs><g clip-path="url(#rpc)">';
    if (mp) {
      mp.tiles.forEach(function (t) { if (t.ok) g += '<image href="' + t.url + '" x="' + t.x.toFixed(1) + '" y="' + t.y.toFixed(1) + '" width="256.6" height="256.6"/>'; });
      g += '<rect width="' + W + '" height="' + H + '" fill="#000" opacity=".12"/>';
    } else g += '<rect width="' + W + '" height="' + H + '" fill="#f3f7fa"/>';
    ['left', 'right', 'axis'].forEach(function (k) { g += '<path d="' + path(k) + '" fill="none" stroke="' + col.halo + '" stroke-width="' + (k === 'axis' ? 5 : 3.6) + '" opacity="' + (mp ? .55 : 0) + '" stroke-linejoin="round"/>'; });
    g += '<path d="' + path('left') + '" fill="none" stroke="' + col.l + '" stroke-width="1.6"/><path d="' + path('right') + '" fill="none" stroke="' + col.r + '" stroke-width="1.6"/><path d="' + path('axis') + '" fill="none" stroke="' + col.a + '" stroke-width="2.4" stroke-linejoin="round"/>';
    const len = secs[secs.length - 1].station - secs[0].station, step = rpNice(len, 7);
    let prev = Math.floor(secs[0].station / step + 1e-9), n = 0;
    secs.forEach(function (s, i) {
      const f = Math.floor(s.station / step + 1e-9);
      const pp = pt(s.axis), nearEnd = Math.hypot(pp[0] - pt(secs[0].axis)[0], pp[1] - pt(secs[0].axis)[1]) < 30 || Math.hypot(pp[0] - pt(secs[secs.length - 1].axis)[0], pp[1] - pt(secs[secs.length - 1].axis)[1]) < 30;
      if (i > 0 && f > prev && n < 12 && !nearEnd) {
        n++; const p = pp;
        g += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + RP.gold + '" stroke="#fff" stroke-width="1"/><text x="' + (p[0] + 5).toFixed(1) + '" y="' + (p[1] - 5).toFixed(1) + '" font-size="8.5" font-weight="700" fill="' + col.t + '" stroke="' + col.halo + '" stroke-width="2.6" paint-order="stroke">' + esc(stLabel(s.station)) + '</text>';
      }
      prev = Math.max(prev, f);
    });
    const a = pt(secs[0].axis), b = pt(secs[secs.length - 1].axis);
    g += '<circle cx="' + a[0].toFixed(1) + '" cy="' + a[1].toFixed(1) + '" r="4.5" fill="' + RP.up + '" stroke="#fff" stroke-width="1.4"/><text x="' + (a[0] + 7).toFixed(1) + '" y="' + (a[1] + 12).toFixed(1) + '" font-size="9" font-weight="700" fill="' + (mp ? '#9dffae' : RP.up) + '" stroke="' + col.halo + '" stroke-width="2.4" paint-order="stroke">ابتدا</text>' +
      '<circle cx="' + b[0].toFixed(1) + '" cy="' + b[1].toFixed(1) + '" r="4.5" fill="' + RP.dn + '" stroke="#fff" stroke-width="1.4"/><text x="' + (b[0] + 7).toFixed(1) + '" y="' + (b[1] + 12).toFixed(1) + '" font-size="9" font-weight="700" fill="' + (mp ? '#ffb3ad' : RP.dn) + '" stroke="' + col.halo + '" stroke-width="2.4" paint-order="stroke">انتها</text>';
    g += '<g transform="translate(' + (W - 28) + ',34)"><circle r="16" fill="#fff" stroke="#9aa8b3" opacity=".92"/><path d="M0 -12 L5 7 L0 3 L-5 7 Z" fill="' + RP.navy + '"/><text y="-19" text-anchor="middle" font-size="10" font-weight="700" fill="' + col.t + '" stroke="' + col.halo + '" stroke-width="2.4" paint-order="stroke">N</text></g>';
    const sc = rpNice(W * 0.2 * mpp, 1), sw = sc / mpp;
    g += '<g transform="translate(12,' + (H - 16) + ')"><rect x="-3" y="-13" width="' + (sw + 40).toFixed(1) + '" height="21" fill="#fff" opacity="' + (mp ? .8 : 0) + '" rx="3"/><rect width="' + sw.toFixed(1) + '" height="4" fill="' + RP.navy + '"/><text x="' + (sw + 4).toFixed(1) + '" y="4" font-size="8.5" fill="' + RP.navy + '">' + C.fmt(sc, 0) + ' m</text></g>';
    g += '</g><rect width="' + W + '" height="' + H + '" fill="none" stroke="#9aa8b3" stroke-width=".8" rx="4"/>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="' + RP_FONT + '">' + g + '</svg>';
  }

      let o = '<option value="-1"' + (cur === -1 ? ' selected' : '') + '>— ندارد —</option>';
      for (let i = 0; i < cols; i++) {

        o += '<option value="' + i + '"' + (cur === i ? ' selected' : '') + '>ستون ' + (i + 1) + hd + ' ← ' + esc(String(sample[i] === undefined ? '' : sample[i]).slice(0, 16)) + '</option>';
      }

    };
    const f = function (k, label) { return field(label, '<select class="inp" data-bmi="' + k + '">' + opts(im.map[k]) + '</select>'); };
    const res = IO.rowsToBenchmarks(im.rows, im.map, { hasHeader: im.hasHeader });
    const exist = {}; P().benchmarks.forEach(function (b) { exist[String(b.name).trim().toLowerCase()] = 1; });

    let h = '<hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><h3>تنظیم ستون‌ها — ' + esc(im.name) + '</h3>' +
      (im.byHeader ? '<div class="msg info small">ستون‌ها از روی عنوان‌های فایل شناسایی شد.</div>' : '') +
      '<div class="grid2">' + f('name', 'ستون نام / شماره') + f('z', 'ستون Z (الزامی)') + f('x', 'ستون X') + f('y', 'ستون Y') + f('desc', 'ستون توضیح') +
      '<div class="field"><span>سطر اول عنوان است؟</span><label class="row"><input type="checkbox" data-bmi="hasHeader"' + (im.hasHeader ? ' checked' : '') + '> بله، رد شود</label></div></div>' +
      '<div class="msg ' + (res.items.length ? 'ok' : 'err') + '" style="margin-top:8px"><b>' + res.items.length + '</b> بنچ‌مارک معتبر' + (upd ? ' (' + upd + ' مورد نام تکراری و به‌روزرسانی)' : '') + (res.errors.length ? ' و <b>' + res.errors.length + '</b> خطا' : '') + '</div>' +

        res.items.slice(0, 5).map(function (q) { return '<tr><td>' + esc(q.name) + '</td><td class="n">' + C.fmt(q.z, dec()) + '</td><td class="n">' + (q.x === null ? '' : C.fmt(q.x, dec())) + '</td><td class="n">' + (q.y === null ? '' : C.fmt(q.y, dec())) + '</td><td>' + esc(q.desc) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    return h + '<div class="row" style="margin-top:10px"><button class="btn primary grow" data-act="bmDo"' + (res.items.length ? '' : ' disabled') + '>ورود ' + res.items.length + ' بنچ‌مارک</button><button class="btn" data-act="bmCancel">لغو</button></div>';

  function startBmImport(rows, name) {
    S.bmImpErr = '';
    if (!rows.length) { S.bmImpErr = 'فایل خالی است یا سطر داده‌ای ندارد.'; toast(S.bmImpErr, 'err'); render(); return; }
    const g = IO.guessBenchmarkMapping(rows);
    S.bmImp = { rows: rows, name: name, hasHeader: g.hasHeader, map: g.map, byHeader: g.byHeader };
    render();
  }

  async function loadBmFile(file) {
    toast('در حال خواندن «' + file.name + '» …');
    try {
      let rows;
      if (/\.xlsx$/i.test(file.name)) rows = await IO.readXlsx(new Uint8Array(await file.arrayBuffer()));
      else if (/\.xls$/i.test(file.name)) throw new Error('فرمت قدیمی Excel (.xls) پشتیبانی نمی‌شود. با «Save As» به .xlsx یا CSV ذخیره کنید.');
      else {
        const buf = await file.arrayBuffer();
        let text = new TextDecoder('utf-8').decode(buf);
        if (text.indexOf('\ufffd') >= 0) { try { text = new TextDecoder('windows-1256').decode(buf); } catch (e) { /* ignore */ } }
        rows = IO.parseDelimited(text).rows;
      }
      startBmImport(rows, file.name);
    } catch (e) { S.bmImpErr = 'فایل «' + file.name + '» خوانده نشد: ' + (e.message || 'خطای نامشخص'); toast(S.bmImpErr, 'err'); render(); }
  }

  async function doBmImport() {
    const im = S.bmImp, p = P();
    const res = IO.rowsToBenchmarks(im.rows, im.map, { hasHeader: im.hasHeader });
    if (!res.items.length) { toast('بنچ‌مارک معتبری برای ورود وجود ندارد.', 'err'); return; }
    if (res.errors.length && !(await ask(res.errors.length + ' سطر دارای خطا نادیده گرفته می‌شود. ادامه می‌دهید؟', { ok: 'ورود' }))) return;
    let added = 0, updated = 0;
    res.items.forEach(function (it) {
      const ex = p.benchmarks.find(function (b) { return String(b.name).trim().toLowerCase() === it.name.toLowerCase(); });
      if (ex) { ex.name = it.name; ex.x = it.x; ex.y = it.y; ex.z = it.z; ex.desc = it.desc; updated++; }
      else { p.benchmarks.push({ id: C.uid('bm'), name: it.name, x: it.x, y: it.y, z: it.z, desc: it.desc }); added++; }
    });
    S.bmImp = null; S.bmImpErr = '';
    structural(); toast(added + ' بنچ‌مارک جدید' + (updated ? ' و ' + updated + ' به‌روزرسانی' : '') + ' وارد شد.');
  }

  /* ============================== ۶) پیاده‌سازی ============================== */
  function stakeCtx() {
    const p = P(), r = calc();
    const ll = C.normalizeLayers(p.layers).layers;
    const layer = ll.find(function (l) { return l.id === S.stakeLayer; }) || null;
    if (!layer) S.stakeLayer = '';
    let secs = r.sections, rds = r.readings;
    if (layer && r.sections) { secs = C.applyLayer(r.sections, layer); rds = C.buildReadings(secs, r.setupInfo, p.settings); }
    const total = secs ? secs.length : 0, stp = stakeStepVal();
    if (stp > 0 && secs && secs.length > 2) {
      const keep = secs.map(function (q, i) { return i === 0 || i === secs.length - 1 || stakeIsMult(q.station, stp); });
      if (Array.isArray(rds)) rds = rds.filter(function (_, i) { return keep[i]; });
      secs = secs.filter(function (_, i) { return keep[i]; });
    }
    return { r: r, ll: ll, layer: layer, secs: secs, rds: rds, step: stp, total: total };
  }
  function stakeMidStepVal(p) { p = p || P(); const v = p && p.stakeMidStep ? C.toNumber(p.stakeMidStep) : NaN; return fin(v) && v > 0 ? v : 0; }
  /** نقاط قابل‌پیاده‌سازی یک مقطع: میانی‌ها فقط وقتی که روشن باشند و در گام میانی بیفتند (ابتدا و انتها همیشه) */
  function midSides(sec, off, ms, secs) {
    const all = C.sideKeys(sec);
    if (!all.some(function (k) { return sec[k].kind === 'mid'; })) return all;
    const noMid = function () { return all.filter(function (k) { return sec[k].kind !== 'mid'; }); };
    if (off) return noMid();
    if (!ms) return all;
    secs = secs || (calc().sections) || [];
    const ends = secs.length && (sec.station === secs[0].station || sec.station === secs[secs.length - 1].station);
    return ends || stakeIsMult(sec.station, ms) ? all : noMid();
  }
  function stakeSides(sec, p, secs) { p = p || P(); return midSides(sec, p.stakeMidOff, stakeMidStepVal(p), secs); }
  function stakeStepVal() { const p = P(), v = p && p.stakeStep ? C.toNumber(p.stakeStep) : NaN; return fin(v) && v > 0 ? v : 0; }
  function stakeIsMult(st, step) { const q = st / step; return Math.abs(q - Math.round(q)) * step < 0.0005; }
  const layerTag = function (l) { return l ? l.name + ' (\u2066' + (l.offset > 0 ? '+' : '') + C.fmt(l.offset * 100, 1) + ' cm\u2069)' : 'خط پروژه'; };

  function stakeLayerChange(id) {
    const before = stakeCtx(), cur = before.secs && before.secs[S.stakeIdx] ? before.secs[S.stakeIdx].station : null;
    S.stakeLayer = id;
    const after = stakeCtx();
    let idx = 0;
    if (cur !== null && after.secs && after.secs.length) { idx = after.secs.findIndex(function (q) { return q.station >= cur - 1e-9; }); if (idx < 0) idx = after.secs.length - 1; }
    S.stakeIdx = idx; render();
  }

  /* ---------- علامت «پیاده‌شده» (جدا برای هر لایه، داخل پروژه ذخیره می‌شود) ---------- */
  function stkKey(st) { return String(Math.round(st * 1000)); }
  function stkList() {
    const s = activeStreet(P()); if (!s.staked) s.staked = {};
    const k = S.stakeLayer || '_'; if (!Array.isArray(s.staked[k])) s.staked[k] = [];
    return s.staked[k];
  }
  /* هر میخ: کلید «کیلومتر:سمت»؛ کلید ساده‌ی کیلومتر (داده‌ی قدیمی) یعنی همه‌ی میخ‌های آن مقطع */
  function sideStaked(st, side) { const l = stkList(); return l.indexOf(stkKey(st)) >= 0 || l.indexOf(stkKey(st) + ':' + side) >= 0; }
  function secStakeState(sec) {
    const sides = stakeSides(sec), n = sides.filter(function (sd) { return sideStaked(sec.station, sd); }).length;
    return { n: n, total: sides.length, done: n === sides.length, part: n > 0 && n < sides.length };
  }
  function isStaked(st) { return stkList().indexOf(stkKey(st)) >= 0; }
  function stkClear(st) { const l = stkList(), k = stkKey(st); for (let i = l.length - 1; i >= 0; i--) if (l[i] === k || l[i].indexOf(k + ':') === 0) l.splice(i, 1); }
  function stkSide(sec, side) {
    const l = stkList(), k = stkKey(sec.station), sides = stakeSides(sec);
    if (l.indexOf(k) >= 0) { stkClear(sec.station); sides.forEach(function (sd) { if (sd !== side) l.push(k + ':' + sd); }); }
    else { const j = l.indexOf(k + ':' + side); if (j >= 0) l.splice(j, 1); else l.push(k + ':' + side); }
    markDirty(); render();
  }
  function stkToggle(sec) {
    const st = secStakeState(sec), l = stkList(), k = stkKey(sec.station);
    stkClear(sec.station);
    if (!st.done) l.push(k);
    markDirty(); render();
  }

  function stakePage() {
    const p = P(), cx = stakeCtx(), r = cx.r;
    if (!r.sections) return streetBar(false) + '<div class="msg err"><b>محاسبه انجام نشد.</b> ابتدا خطاهای زیر را رفع کنید.</div>' + blockedBanner(r);
    let h = streetBar(false);
    if (cx.ll.length) {
      h += '<div class="card"><label class="field"><span>لایه‌ی در حال پیاده‌سازی</span><select class="inp" id="stLayer"><option value="">خط پروژه</option>' +
        cx.ll.map(function (l) { return '<option value="' + esc(l.id) + '"' + (cx.layer && cx.layer.id === l.id ? ' selected' : '') + '>' + esc(layerTag(l)) + '</option>'; }).join('') + '</select></label></div>';
    }
    h += '<div class="stake-layer' + (cx.layer ? ' on' : '') + '">پیاده‌سازی: <b>' + esc(layerTag(cx.layer)) + '</b></div>';
    if (!cx.secs.length) return h + '<div class="msg warn">هیچ مقطعی در محدوده‌ی لایه‌ی «' + esc(cx.layer ? cx.layer.name : '') + '» نیست. بازه‌ی لایه را در تب «لایه‌ها» بررسی کنید.</div>';
    const n = cx.secs.length;
    S.stakeIdx = Math.max(0, Math.min(n - 1, S.stakeIdx));
    const i = S.stakeIdx, sec = cx.secs[i], rd = cx.rds[i];
    // گام پیاده‌سازی و شمارش
    let tot = 0, doneStakes = 0, complete = 0, partial = 0;
    cx.secs.forEach(function (q) { const t = secStakeState(q); tot += t.total; doneStakes += t.n; if (t.done) complete++; else if (t.part) partial++; });
    h += '<div class="card"><div class="grid2"><label class="field"><span>گام کیلومتراژ (m)</span><input class="inp ltr" id="stStep" dir="ltr" inputmode="decimal" autocomplete="off" placeholder="همه" value="' + esc(p.stakeStep || '') + '"></label>' +
      '<label class="field"' + (p.stakeMidOff ? ' style="opacity:.45"' : '') + '><span>گام میخ‌های میانی (m)</span><input class="inp ltr" id="stMidStep" dir="ltr" inputmode="decimal" autocomplete="off" placeholder="همه"' + (p.stakeMidOff ? ' disabled' : '') + ' value="' + esc(p.stakeMidStep || '') + '"></label></div>' +
      '<div class="row stk-mid"><button class="btn sm stk-midbtn grow' + (p.stakeMidOff ? '' : ' on') + '" data-act="stkMids" aria-pressed="' + (p.stakeMidOff ? 'false' : 'true') + '">میخ‌های میانی: ' + (p.stakeMidOff ? 'غیرفعال' : 'فعال ✓') + '</button></div>' +
      (cx.step ? '<p class="muted small" style="margin:6px 0 0">با گام <b class="num">' + cx.step + '</b> متر، <b class="num">' + n + '</b> مقطع از <b class="num">' + cx.total + '</b> نمایش داده می‌شود (ابتدا و انتها همیشه هست).</p>' : '') + '</div>';
    h += '<div class="seg"><button class="btn' + (S.stakeView !== 'list' ? ' primary' : '') + '" data-act="stkView" data-v="card">مقطع‌به‌مقطع</button><button class="btn' + (S.stakeView === 'list' ? ' primary' : '') + '" data-act="stkView" data-v="list">فهرست</button></div>';
    const cnt = '<div class="row stk-cnt"><span class="muted small"><b class="num">' + doneStakes + '</b> از <b class="num">' + tot + '</b> میخ پیاده شده • <b class="num">' + complete + '</b> از <b class="num">' + n + '</b> مقطع کامل' + (partial ? ' • <b class="num">' + partial + '</b> ناقص' : '') + '</span>' +
      (doneStakes ? '<button class="btn sm danger" data-act="stkReset">بازنشانی همه</button>' : '') + '</div>';
    if (S.stakeView === 'list') {
      const flt = S.stakeFilter || 'all';
      h += '<div class="seg"><button class="btn sm' + (flt === 'all' ? ' primary' : '') + '" data-act="stkFlt" data-v="all">همه</button><button class="btn sm' + (flt === 'none' ? ' primary' : '') + '" data-act="stkFlt" data-v="none">نشده‌ها (' + (n - complete - partial) + ')</button><button class="btn sm' + (flt === 'part' ? ' primary' : '') + '" data-act="stkFlt" data-v="part">ناقص‌ها (' + partial + ')</button></div>' + cnt;
      let rows = '';
      cx.secs.forEach(function (q, k) {
        const t = secStakeState(q);
        if ((flt === 'none' && (t.n > 0)) || (flt === 'part' && !t.part)) return;
        rows += '<button class="stk-row' + (t.done ? ' done' : t.part ? ' part' : '') + '" data-act="stkRow" data-i="' + k + '"><span class="num" dir="ltr">' + esc(stn(q.station)) + '</span><span class="stk-bx">' +
          stakeSides(q).map(function (sd) { return '<i class="' + (sideStaked(q.station, sd) ? 'on' : '') + '" title="' + esc(sideFa(q, sd)) + '">' + (sideStaked(q.station, sd) ? '✓' : '') + '</i>'; }).join('') + '</span></button>';
      });
      h += rows ? '<div class="stk-list">' + rows + '</div>' : '<p class="muted">موردی با این فیلتر نیست.</p>';
      return h;
    }
    if (!p.setups.length) h += '<div class="msg warn">هنوز استقرار نیوو تعریف نشده است؛ قرائت شاخص نمایش داده نمی‌شود. <a href="#/newo"><b>تعریف بنچ‌مارک و استقرار</b></a></div>';
    else {
      h += '<div class="row"><label class="field grow"><span>استقرار فعال</span><select class="inp" id="actSetup">' +
        p.setups.map(function (s) { return '<option value="' + esc(s.id) + '"' + (r.setup && r.setup.id === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select></label>' +
        '<div class="field"><span>HI</span><b class="num" style="font-size:1.4rem">' + (r.setupInfo.ok ? fx(r.setupInfo.hi) : '—') + '</b></div></div>' + bmInfo(r.setup, r.setupInfo);
      if (!r.setupInfo.ok) h += msgList(r.setupInfo.errors, 'err');
      else if (r.setup && !C.setupCovers(r.setup, sec.station)) h += '<div class="msg warn">این کیلومتراژ خارج از محدوده‌ی استقرار «' + esc(r.setup.name) + '» است. استقرار مناسب را انتخاب کنید.</div>';
    }
    const ss = secStakeState(sec), done = ss.done;
    h += '<div class="stake-bar">' +
      '<div class="stn-box' + (done ? ' staked' : '') + '"><input id="stJump" value="' + esc(stn(sec.station)) + '" inputmode="text" aria-label="کیلومتراژ؛ برای پرش تایپ کنید"><span class="muted small num">' + (i + 1) + ' / ' + n + '</span></div></div>';
    stakeSides(sec).forEach(function (side) { h += stakeCard(side, sec, rd, layerTag(cx.layer), !!cx.layer, sideStaked(sec.station, side)); });
    if (navigator.wakeLock) h += '<div class="row"><button class="btn sm" data-act="wake">' + (S.wake ? 'روشن ماندن صفحه: فعال ✓' : 'روشن نگه داشتن صفحه') + '</button></div>';
    h += '<div class="stk-box' + (done ? ' on' : '') + '">' +
      (done ? '<div class="stk-ok">✓ همه‌ی میخ‌های این مقطع پیاده شد</div><button class="btn sm" data-act="stkToggle">برداشتن همه‌ی علامت‌ها</button>'
        : '<button class="btn primary stk-btn" data-act="stkToggle">✓ همه‌ی میخ‌های این مقطع پیاده شد (' + ss.n + ' از ' + ss.total + ')</button>') +
      '</div>' + cnt;
    h += '<div class="stake-pad"></div>';
    h += '<div class="nav-big"><button class="btn" data-act="stGo" data-d="-1"' + (i <= 0 ? ' disabled' : '') + '>‹ مقطع قبلی</button><button class="btn primary" data-act="stGo" data-d="1"' + (i >= n - 1 ? ' disabled' : '') + '>مقطع بعدی ›</button></div>';
    return h;
  }

  function stakeCard(side, sec, rd, tag, isLayer, on) {
    const q = sec[side], r = rd[side], ok = r && r.valid, mid = q.kind === 'mid';
    const nm = mid ? (q.midName || q.tag || 'نقطه میانی') : sideFa(sec, side);
    const edge = mid ? '<span class="stk-edge">' + (q.edge === 'left' ? 'چپ' : 'راست') + '</span> • ' : '';
    const sub = '<span class="layer-tag' + (isLayer ? ' on' : '') + '">' + esc(tag) + '</span><br>Z هدف <span class="num">' + fx(q.z) + '</span>' + (side === 'axis' ? '' : '<br>' + edge + 'ΔZ <span class="num">' + sgn(q.dz) + '</span> • عرض <span class="num">' + fx(q.width) + '</span>');
    const none = !r || r.status === 'invalid';
    let val, warn = '';
    if (ok) val = '<div class="rd-v">' + fx(r.value) + '</div>';
    else if (none) val = '<div class="rd-v" style="background:transparent;color:var(--muted)">—</div>';
    else {
      val = '<div class="rd-v">⚠ ' + SHORT[r.status] + '</div>';
      warn = '<div class="warn-t">' + esc(r.message) + ' (مقدار محاسبه‌شده <span class="num strike">' + fx(r.value) + '</span> اجرایی نیست)</div>';
    }
    const st = '<div class="stk-st' + (on ? ' on' : '') + '">' + (on ? '✓ پیاده شد' : 'پیاده نشده') + '</div>';
    return '<div class="rd-card ' + sideCls(side) + (ok || none ? '' : ' bad') + (on ? ' staked' : '') + '" data-act="stkSide" data-side="' + esc(side) + '" role="button" tabindex="0" aria-pressed="' + (on ? 'true' : 'false') + '"><div><div class="lbl">' + esc(nm) + ' <span class="chip ' + sideCls(side) + '">' + esc(q.name) + '</span></div><div class="sub">' + sub + '</div>' + warn + '</div><div class="rd-col">' + st + val + '</div></div>';
  }

  /* ============================== ۷) خروجی و گزارش ============================== */
  function slug(s) { return String(s).trim().replace(/[\\\/:*?"<>|\s]+/g, '_').slice(0, 60) || 'project'; }

  /* ---------- قالب خروجی: طراح ستون‌ها (نقاط و برداشت‌ها) ---------- */
  function fmtTemplates(kind) { return IO.BUILTIN_TEMPLATES[kind].concat(P().exportTemplates[kind] || []); }
  function fmtLoad(kind, t) {
    const x = IO.expandTemplate(kind, t);
    S.exp.fmt[kind] = { header: x.header !== false, stationFormat: x.stationFormat === 'chainage' ? 'chainage' : 'numeric', cols: x.cols.map(function (c) { return { key: c.key, label: c.label === undefined ? '' : c.label, text: c.text || '' }; }) };
    S.exp.fmtSel[kind] = t.id;
  }
  function fmtGet(kind) {
    if (!S.exp.fmt[kind]) {
      const t = IO.BUILTIN_TEMPLATES[kind][0];
      fmtLoad(kind, Object.assign({}, t, { stationFormat: P().settings.stationExport === 'chainage' ? 'chainage' : t.stationFormat }));
    }
    return S.exp.fmt[kind];
  }

  function fmtCard(kind, title, intro, tail) {
    const f = fmtGet(kind), cat = IO.COLS[kind], tpls = fmtTemplates(kind), cur = S.exp.fmtSel[kind];
    const saved = (P().exportTemplates[kind] || []).find(function (t) { return t.id === cur; });
    const dk = ' data-k="' + kind + '"';
    let h = '<section class="card" id="fmt_' + kind + '"><h2>' + title + '</h2>' + (intro || '') +
      '<div class="grid2">' +
      field('قالب خروجی', '<select class="inp" data-fmt="tpl"' + dk + '>' + tpls.map(function (t) { return '<option value="' + esc(t.id) + '"' + (t.id === cur ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('') + '</select>') +
      field('کیلومتراژ در فایل', '<select class="inp" data-fmt="stfmt"' + dk + '><option value="numeric"' + (f.stationFormat === 'numeric' ? ' selected' : '') + '>عدد (متر) — پیشنهادی</option><option value="chainage"' + (f.stationFormat === 'chainage' ? ' selected' : '') + '>12+345.678</option></select>') + '</div>' +
      '<label class="row" style="margin:8px 0"><input type="checkbox" data-fmt="header"' + dk + (f.header ? ' checked' : '') + '> سطر عنوان در فایل نوشته شود</label>' +
      '<p class="muted small">ستون‌ها در فایل به همین ترتیب (ردیف اول = اولین ستون فایل) نوشته می‌شوند. هر ستون را عوض، جابه‌جا، حذف یا عنوانش را تغییر دهید؛ «متن ثابت» برای نوشتن یک مقدار یکسان در همه‌ی ردیف‌هاست.</p>';
    f.cols.forEach(function (c, i) {
      h += '<div class="fm-row"><select class="inp" data-fmt="key" data-i="' + i + '"' + dk + ' aria-label="ستون ' + (i + 1) + '">' +
        Object.keys(cat).map(function (k) { return '<option value="' + k + '"' + (c.key === k ? ' selected' : '') + '>' + esc(cat[k].fa) + '</option>'; }).join('') + '</select>' +
        '<input class="inp ltr" data-fmt="label" data-i="' + i + '"' + dk + ' value="' + esc(c.label) + '" dir="ltr" autocomplete="off" placeholder="عنوان ستون" aria-label="عنوان ستون ' + (i + 1) + '">' +
        '<button class="btn icon sm" data-act="fmtMv"' + dk + ' data-i="' + i + '" data-d="-1"' + (i === 0 ? ' disabled' : '') + ' aria-label="بالاتر">↑</button>' +
        '<button class="btn icon sm" data-act="fmtMv"' + dk + ' data-i="' + i + '" data-d="1"' + (i === f.cols.length - 1 ? ' disabled' : '') + ' aria-label="پایین‌تر">↓</button>' +
        '<button class="btn icon danger sm" data-act="fmtDel"' + dk + ' data-i="' + i + '" aria-label="حذف ستون">×</button>' +
        (c.key === 'text' ? '<input class="inp txt" data-fmt="text" data-i="' + i + '"' + dk + ' value="' + esc(c.text) + '" autocomplete="off" placeholder="متن ثابت (مثلاً کد پروژه)">' : '') + '</div>';
    });
    if (!f.cols.length) h += '<div class="msg warn small">ستونی انتخاب نشده است؛ دست‌کم یک ستون اضافه کنید.</div>';
    h += '<div class="row" style="margin-top:6px"><select class="inp grow" id="fmtAdd_' + kind + '" aria-label="ستون جدید">' + Object.keys(cat).map(function (k) { return '<option value="' + k + '">' + esc(cat[k].fa) + '</option>'; }).join('') + '</select>' +
      '<button class="btn" data-act="fmtAdd"' + dk + '>افزودن ستون</button></div>' +
      '<div class="card" style="margin:10px 0 0;background:var(--axis-soft)"><b class="small">ذخیره‌ی این چیدمان به‌عنوان قالب (در فایل پشتیبان پروژه هم می‌آید)</b><div class="row" style="margin-top:6px">' +
      '<input class="inp grow" id="fmtName_' + kind + '" placeholder="نام قالب، مثلاً فایل دستگاه" autocomplete="off" value="' + esc(saved ? saved.name : '') + '">' +
      '<button class="btn sm" data-act="fmtSave"' + dk + '>ذخیره قالب</button>' + (saved ? '<button class="btn sm danger" data-act="fmtDelTpl"' + dk + '>حذف قالب</button>' : '') + '</div></div>' +
      '<div class="muted small" style="margin-top:8px">پیش‌نمایش (چند سطر اول):</div><pre class="code" id="fmtPv_' + kind + '"></pre>' + (tail || '') + '</section>';
    return h;
  }

  function onFmtChange(el) {
    const kind = el.dataset.k, f = fmtGet(kind), k = el.dataset.fmt, i = parseInt(el.dataset.i, 10);
    if (k === 'tpl') {
      if (el.value === '__new') { S.exp.fmtSel[kind] = '__new'; render(); return; }
      const t = fmtTemplates(kind).find(function (x) { return x.id === el.value; }); if (t) fmtLoad(kind, t); render(); return;
    }
    if (k === 'stfmt') f.stationFormat = el.value === 'chainage' ? 'chainage' : 'numeric';
    else if (k === 'header') f.header = el.checked;
    else if (f.cols[i]) {
      if (k === 'key') { f.cols[i].key = el.value; f.cols[i].label = IO.COLS[kind][el.value].label; f.cols[i].text = ''; render(); return; }
      if (k === 'label') f.cols[i].label = el.value;
      if (k === 'text') f.cols[i].text = el.value;
    }
    if (S.tx && S.tx.open) txPreview();
    exportLive();
  }

  /* ---------- جدول‌های خروجی ---------- */
  function selectedLayers() {
    const ll = C.normalizeLayers(P().layers).layers;
    return S.exp.layer && S.exp.layer !== 'all' ? ll.filter(function (l) { return l.id === S.exp.layer; }) : ll;
  }

  function pointsExportTable(layerMode) {
    const r = calc(), st = P().settings;
    let rows = [];
    if (layerMode) selectedLayers().forEach(function (l) { rows = rows.concat(C.buildPointRows(C.applyLayer(r.sections, l), st, l.name)); });
    else rows = C.buildPointRows(r.sections, st);
    return { table: IO.customTable('points', rows, fmtGet('points'), { stationFormat: st.stationExport }), skipped: [] };
  }

  /** استقرارهای انتخاب‌شده برای خروجی نیوو، به ترتیب کیلومتر (null = همه) */
  function expSetupList() {
    const all = C.sortSetups(P().setups), sel = S.exp.newoSel;
    return sel ? all.filter(function (s) { return sel.indexOf(s.id) >= 0; }) : all;
  }

  /** ردیف‌های نیوو به ترتیب استقرار، سپس لایه، سپس کیلومتر؛ کیلومتر مرزی برای هر دو استقرار نوشته می‌شود */
  function newoData(layerMode) {
    const r = calc(), p = P(), st = p.settings, setups = expSetupList(), ls = layerMode ? selectedLayers() : [null];
    let rows = [];
    const skipped = [];
    setups.forEach(function (su) {
      ls.forEach(function (l) {
        const o = C.buildNewoRows(l ? C.applyLayer(r.sections, l) : r.sections, [su], p.benchmarks, st);
        rows = rows.concat(o.rows);
        if (o.skipped.length && !skipped.some(function (x) { return x.setup.id === su.id; })) skipped.push(o.skipped[0]);
      });
    });
    const opt = { stationFormat: st.stationExport, withSetup: true, withLayer: !!layerMode };
    return { rows: rows, skipped: skipped, setups: setups, opt: opt, table: IO.newoTable(rows, opt) };
  }

  function exportTable(kind) {
    if (kind === 'points') return pointsExportTable(false);
    const d = newoData(false);
    return { table: d.table, skipped: d.skipped, count: d.rows.length };
  }

  function exportLayerTable(kind) {
    if (kind === 'points') return pointsExportTable(true);
    const d = newoData(true);
    return { table: d.table, skipped: d.skipped, count: d.rows.length };
  }

  function setupPickCard() {
    const p = P(), r = calc(), all = C.sortSetups(p.setups), sel = S.exp.newoSel;
    if (!all.length) return '<div class="msg warn">استقراری تعریف نشده است؛ فایل خروجی ردیفی نخواهد داشت. <a href="#/newo"><b>تعریف استقرار</b></a></div>';
    let h = '<b class="small">استقرارهای داخل خروجی (هر استقرار جدا و به ترتیب کیلومتر نوشته می‌شود):</b><div class="sl-list">';
    all.forEach(function (su) {
      const info = C.computeSetup(su, p.benchmarks), n = r.sections ? r.sections.filter(function (q) { return C.setupCovers(su, q.station); }).length : 0;
      const on = !sel || sel.indexOf(su.id) >= 0;
      h += '<label class="' + (info.ok ? '' : 'dis') + '"><input type="checkbox" data-exps="' + esc(su.id) + '"' + (on && info.ok ? ' checked' : '') + (info.ok ? '' : ' disabled') + '> <span><b>' + esc(su.name) + '</b> — ' +
        rangeText(fin(C.toNumber(su.from)) ? C.toNumber(su.from) : null, fin(C.toNumber(su.to)) ? C.toNumber(su.to) : null) +

    });

  async function deliver(name, data, mime) {
    const blob = new Blob([data], { type: mime });
    if (S.exp.share && window.File && navigator.canShare) {
      const f = new File([blob], name, { type: mime });
      if (navigator.canShare({ files: [f] })) {
        try { await navigator.share({ files: [f], title: name }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  }

  function fileName(kind, layerMode) {
    return slug(P().name) + '_' + slug(activeStreet().name) + (layerMode ? '_layers' : '') + '_' + (kind === 'points' ? 'points' : kind === 'survey' ? 'survey' : 'newo');
  }
  const MIME = { csv: 'text/csv;charset=utf-8', txt: 'text/plain;charset=utf-8', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', zip: 'application/zip' };

  /** یک جدول ← فایل (CSV/TXT/Excel) */
  function deliverTable(base, fmt, table, sheetName) {
    const st = P().settings;
    if (fmt === 'xlsx') deliver(base + '.xlsx', IO.writeXlsx([{ name: sheetName, rows: table }], { decimals: st.decimals }), MIME.xlsx);
    else if (fmt === 'csv') deliver(base + '.csv', '\ufeff' + IO.toDelimited(table, { delimiter: ',', decimals: st.decimals }), MIME.csv);
    else deliver(base + '.txt', IO.toDelimited(table, { delimiter: S.exp.delim, decimals: st.decimals }), MIME.txt);
    toast('فایل ' + base + '.' + fmt + ' آماده شد.');
  }

  function doNewoExport(fmt, layerMode) {
    const p = P(), st = p.settings, d = newoData(layerMode);
    if (!d.setups.length) { toast('هیچ استقراری برای خروجی انتخاب نشده است.', 'err'); return; }
    if (d.table.length <= 1) { toast('ردیفی برای خروجی نیوو وجود ندارد؛ استقرار معتبر انتخاب کنید.', 'err'); return; }
    const base = fileName('newo', layerMode);
    const groups = d.setups.map(function (su) { return { su: su, rows: d.rows.filter(function (r) { return r.setupId === su.id; }) }; }).filter(function (g) { return g.rows.length; });
    const stCellOut = function (v) { const n = C.toNumber(v); return fin(n) ? (st.stationExport === 'chainage' ? C.formatStation(n, 3) : n) : ''; };
    if (fmt === 'xlsx') {
      const used = {};
      const sn = function (n) {
        const b0 = String(n).replace(/[\[\]:*?\/\\]/g, '_').slice(0, 26) || 'Setup'; let k = b0, i = 2;
        while (used[k.toLowerCase()]) k = b0 + '_' + (i++);
        used[k.toLowerCase()] = 1; return k;
      };
      const info = [['Setup', 'Benchmark', 'BM_Z', 'BS', 'HI', 'From', 'To', 'Rows']].concat(groups.map(function (g) {
        const inf = C.computeSetup(g.su, p.benchmarks);
        return [g.su.name, inf.bm ? inf.bm.name : '', inf.bm ? C.toNumber(inf.bm.z) : null, C.toNumber(g.su.bs), inf.ok ? inf.hi : null, stCellOut(g.su.from), stCellOut(g.su.to), g.rows.length];
      }));
      const sheets = [{ name: sn('All'), rows: info.concat([[]], d.table) }].concat(groups.map(function (g) { return { name: sn(g.su.name), rows: IO.newoTable(g.rows, d.opt) }; }));
      deliver(base + '.xlsx', IO.writeXlsx(sheets, { decimals: st.decimals }), MIME.xlsx);
      toast('فایل Excel با ' + groups.length + ' برگه‌ی استقرار و یک برگه‌ی All آماده شد.');
      return;
    }
    const text = function (table) { return IO.toDelimited(table, { delimiter: fmt === 'csv' ? ',' : S.exp.delim, decimals: st.decimals }); };
    if (S.exp.split && groups.length > 1) {
      const files = groups.map(function (g, i) { return { name: base + '_' + (i + 1) + '_' + slug(g.su.name) + '.' + fmt, data: (fmt === 'csv' ? '\ufeff' : '') + text(IO.newoTable(g.rows, d.opt)) }; });
      deliver(base + '.zip', IO.zipStore(files), MIME.zip);
      toast('فایل ZIP با ' + files.length + ' فایل (هر استقرار یکی) آماده شد.');
      return;
    }
    deliver(base + '.' + fmt, (fmt === 'csv' ? '\ufeff' : '') + text(d.table), MIME[fmt]);
    toast('فایل ' + base + '.' + fmt + ' آماده شد.');
  }

  /* ---------- فایل GPS: نام نقطه با پیشوند کوتاه خیابان ---------- */
  function streetShort(s, idx) {
    const t = String(s.short || '').trim().replace(/[^A-Za-z0-9_\-]+/g, '').replace(/^[-_]+|[-_]+$/g, '');
    if (t) return t;
    const d = String(s.name || '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    return d || ('ST' + (idx + 1));
  }
  const GPS_TPL = { header: false, stationFormat: 'numeric', cols: [{ key: 'gpsName', label: 'Name' }, { key: 'x', label: 'E' }, { key: 'y', label: 'N' }, { key: 'z', label: 'Z' }, { key: 'gpsDesc', label: 'Description' }] };
  /** ردیف‌های GPS یک خیابان: محور = پیشوند-کیلومتر، چپ/راست = پیشوند-L/R-کیلومتر، میانی = پیشوند-L/R+برچسب-کیلومتر */
  function gpsRows(s, idx, secs) {
    const st = P().settings, sh = streetShort(s, idx);
    return C.buildPointRows(secs, st).map(function (r) {
      const km = String(+Number(r.station).toFixed(3)), L = r.side === 'Left' ? 'L' : 'R';
      let nm, ds;
      if (r.kind === 'Axis') { nm = sh + '-' + km; ds = sh + ' Axis'; }
      else if (r.kind === 'Edge') { nm = sh + '-' + L + '-' + km; ds = sh + ' ' + r.side; }
      else { nm = sh + '-' + L + r.code + '-' + km; ds = sh + ' ' + r.side + ' Mid ' + r.code; }
      return Object.assign({}, r, { gpsName: nm, gpsDesc: ds, street: sh });
    });
  }
  function gpsData(all) {
    const p = P(), st = p.settings, list = all ? p.streets : [activeStreet()], skipped = [];
    let rows = [];
    list.forEach(function (s) {
      let secs = null;
      if (s === activeStreet()) secs = calc().sections;
      else { try { secs = C.computeSections(s.points, s.sections, Object.assign({}, st, { sectionMode: 'point' }), s.mids); } catch (e) { secs = null; } }
      if (!secs) { skipped.push(s.name); return; }
      rows = rows.concat(gpsRows(s, p.streets.indexOf(s), secs));
    });
    const seen = {}; let dup = 0, maxLen = 0;
    rows.forEach(function (r) { if (seen[r.gpsName]) dup++; seen[r.gpsName] = 1; if (r.gpsName.length > maxLen) maxLen = r.gpsName.length; });
    return { rows: rows, skipped: skipped, dup: dup, maxLen: maxLen, table: IO.customTable('points', rows, GPS_TPL, { stationFormat: 'numeric' }) };
  }
  function gpsCard() {
    const all = !!S.exp.gpsAll, d = gpsData(all), ex = d.rows.slice(0, 5).map(function (r) { return r.gpsName + ', ' + C.fmt(r.x, 3) + ', ' + C.fmt(r.y, 3) + ', ' + C.fmt(r.z, 3) + ', ' + r.gpsDesc; }).join('\n');
    return '<section class="card"><h2>فایل GPS (نام نقطه با پیشوند خیابان)</h2>' +
      '<p class="muted small">ستون‌ها: نام، E، N، Z، توضیح (بدون عنوان). محور: <b dir="ltr">WE7-120</b> • چپ/راست: <b dir="ltr">WE7-L-120</b> / <b dir="ltr">WE7-R-120</b> • میانی: <b dir="ltr">WE7-LM1-120</b>. پیشوند از «نام کوتاه لاتین خیابان» (تب «محور و لبه‌ها» ← بالای صفحه) می‌آید.</p>' +
      '<label class="row" style="margin:6px 0"><input type="checkbox" id="expGpsAll"' + (all ? ' checked' : '') + '> نقاط همه‌ی خیابان‌ها در یک فایل (وگرنه فقط خیابان فعال)</label>' +
      '<div class="small muted">' + d.rows.length + ' نقطه • بلندترین نام ' + d.maxLen + ' نویسه' + (d.dup ? ' • <b style="color:var(--err)">' + d.dup + ' نام تکراری</b> (نام کوتاه خیابان‌ها را متفاوت کنید)' : '') + (d.skipped.length ? ' • خیابان‌های ردشده (خطای داده): ' + esc(d.skipped.join('، ')) : '') + '</div>' +

  function doGpsExport(fmt) {

  function doExport(kind, fmt, layerMode) {

  function problems() {
    const r = calc(), out = [], counts = { zero: 0, negative: 0, over: 0, invalid: 0 };
    if (!r.sections) return { out: out, counts: counts, total: 0 };
    r.sections.forEach(function (sec, i) {
      C.sideKeys(sec, 'alr').forEach(function (side) {
        const x = r.readings[i][side];
        if (x.valid) return;
        counts[x.status]++;
        if (x.status !== 'invalid' && out.length < 400) out.push({ station: sec.station, name: sec[side].name, status: x.status, value: x.value });
      });
    });
    return { out: out, counts: counts, total: counts.zero + counts.negative + counts.over };
  }

        pr.out.slice(0, 12).map(function (x) { return '<li><span class="num">' + esc(stn(x.station)) + '</span> — ' + esc(x.name) + ': ' + SHORT[x.status] + ' (' + fx(x.value) + ')</li>'; }).join('') + '</ul>' + (pr.total > 12 ? '<div class="small">… و ' + (pr.total - 12) + ' مورد دیگر (در گزارش چاپی کامل است)</div>' : '') + '</div>'
        : '<div class="msg ok" style="margin-top:10px">همه‌ی قرائت‌ها برای استقرار فعال قابل اجراست.</div>';
    } else h += '<div class="msg warn" style="margin-top:10px">برای بررسی قرائت‌ها یک استقرار معتبر انتخاب کنید.</div>';
    h += msgList(r.axisV.warnings, 'warn', 5) + '<button class="btn" data-act="print" style="margin-top:8px">چاپ / ذخیره PDF گزارش جدول</button></section>';
    return h;
  }

          (k === 0 ? '<td rowspan="' + ks.length + '" dir="ltr">' + (fin(r.readings[i].hi) ? fx(r.readings[i].hi) : '') + '</td>' : '') +

  const SV_STATUS = { ok: 'منطبق', cut: 'خاک‌برداری لازم', fill: 'خاک‌ریزی لازم', nodesign: 'بدون طرح لایه', badreading: 'قرائت نامعتبر', nohi: 'HI نامعتبر', empty: '—' };

  /** طرح فعلیِ هر ردیف برداشت (با لایه‌ی همان ردیف)؛ اگر لایه یا مقطع دیگر نباشد، Z طرح ثبت‌شده در لحظه‌ی برداشت می‌ماند */

  function surveyTable(cx) {

  /** به‌روزرسانی زنده‌ی نتیجه‌ی هر سمت و دکمه‌ی «برداشت» هنگام تایپ (بدون ساخت دوباره‌ی صفحه) */

  /** نقطه‌ای که لمس‌شدنش برداشت را ثبت می‌کند؛ غیرفعال یا بدون شیب ثبت نمی‌شود */
  function svUsable(sec, side) { return !(side !== 'axis' && sec.section && sec.section.none); }
  /** لمس کارت: ثبت قرائت همان نقطه، یا (روی کارتِ برداشت‌شده) برداشتن ثبت */
  async function svTap(side) {
    const p = P(), st = p.settings, cx = svCtx(), sec = cx.secs[S.sv.idx]; if (!sec || !svUsable(sec, side)) return;
    const stt = svCardState(sec, side);
    if (stt === 2) {
      if (!(await ask('برداشت ثبت‌شده‌ی «' + esc(sideFa(sec, side)) + '» در کیلومتر ' + esc(stn(sec.station)) + ' حذف شود؟ (قرائت در کادر می‌ماند.)', { danger: true, ok: 'حذف برداشت' }))) return;
      const rows = svRows(), i = rows.findIndex(function (r) { return svSame(r, sec.station, side, S.sv.layer); });
      if (i >= 0) rows.splice(i, 1);
      S.sv.dir = 0; structural(); return;
    }
    const raw = String(S.sv.reads[side] || '').trim();
    if (raw === '') { toast('ابتدا قرائت را وارد کنید.', 'err'); const el = $('#svRd_' + side); if (el) el.focus(); return; }
    const info = C.computeSetup({ bmId: S.sv.bmId, bs: S.sv.bs }, p.benchmarks);
    if (!info.ok) { toast(info.errors[0], 'err'); return; }
    const e = C.surveyPoint({ hi: info.hi, reading: raw, designZ: sec[side].z, staffLength: st.staffLength, tolMm: st.surveyTolMm, decimals: st.decimals });
    if (!e.ok) { toast('قرائت ' + sideFa(sec, side) + ': ' + e.message, 'err'); return; }
    const rows = svRows(), q = sec[side], si = svInfo(q, side);
    const rec = { id: C.uid('sv'), station: sec.station, side: side, kind: si.kind, offset: si.offset, sideLabel: si.sideLabel, point: q.name, reading: e.reading, bs: C.toNumber(S.sv.bs), hi: info.hi, bmId: info.bm.id, bmName: info.bm.name, bmZ: C.toNumber(info.bm.z),
      zMeas: e.zMeas, x: q.x, y: q.y, layerId: S.sv.layer, layerName: cx.layer ? cx.layer.name : '', zDesign: fin(q.z) ? q.z : null, time: svNow() };
    const i = rows.findIndex(function (r) { return svSame(r, sec.station, side, S.sv.layer); });
    if (i >= 0) { rec.id = rows[i].id; rows[i] = rec; } else rows.push(rec);
    rows.sort(function (a, b) { return (a.station - b.station) || (svOrder(a) - svOrder(b)) || String(a.layerName).localeCompare(String(b.layerName)); });
    // چرخه‌ی خودکار: جهت از اولین ثبت مقطع تعیین می‌شود (از راست شروع شد ← به چپ)
    const order = svKeys(sec), at = order.indexOf(side);
    if (!S.sv.dir) S.sv.dir = at === order.length - 1 && order.length > 1 ? -1 : 1;
    let target = null, dir = S.sv.dir, k = at + dir;
    for (; k >= 0 && k < order.length; k += dir) { const sd = order[k]; if (svUsable(sec, sd) && svCardState(sec, sd) !== 2) { target = sd; break; } }
    let msg = '';
    if (!target) {
      // پایان مقطع ← مقطع بعدی با جهت برعکس (رفت‌وبرگشتی) که از همان سمتِ پایان شروع می‌شود
      let ni = S.sv.idx + 1; dir = -dir;
      while (ni < cx.secs.length) {
        const nsec = cx.secs[ni], nord = svKeys(nsec), seq = dir > 0 ? nord : nord.slice().reverse();
        const sd = seq.find(function (x) { return svUsable(nsec, x) && !svSideSavedNow(nsec, x); });
        if (sd) { target = sd; break; }
        ni++;
      }
      if (target) { S.sv.idx = ni; S.sv.key = null; S.sv.dir = dir; } else { S.sv.dir = 0; msg = 'پایان مسیر؛ همه‌ی نقاط برداشت شد.'; }
    }
    structural();
    if (msg) toast(msg);
    if (target) { const el = $('#svRd_' + target); if (el && !el.disabled) el.focus(); }
  }
  const svSideSavedNow = function (sec, side) { return svRows().some(function (r) { return svSame(r, sec.station, side, S.sv.layer) && fin(r.reading); }); };

  function jumpSurvey(text) {
    const cx = svCtx(); if (!cx.secs.length) return;
    const v = C.parseStation(text);
    if (!fin(v)) { toast('کیلومتراژ نامعتبر است.', 'err'); render(); return; }
    if (cx.layer && ((cx.layer.from !== null && v < cx.layer.from - 1e-9) || (cx.layer.to !== null && v > cx.layer.to + 1e-9))) toast('این کیلومتراژ در بازه‌ی لایه‌ی «' + cx.layer.name + '» نیست؛ نزدیک‌ترین مقطع نمایش داده شد.', 'err');
    let idx = cx.secs.findIndex(function (s) { return s.station >= v - 1e-9; });
    if (idx < 0) idx = cx.secs.length - 1;
    svNavigate(function () { S.sv.idx = idx; });
  }
