  /* ---------- گزارش مصالح (همه‌ی ماشین‌های فهرست) ---------- */
  function mtStripSVG(info, ze, W) {
    const lo = ze.ops && Number.isFinite(ze.lo) ? ze.lo : info.lo, hi = ze.ops && Number.isFinite(ze.hi) ? ze.hi : info.hi, L = Math.max(hi - lo, 1e-9);
    const maxRows = Math.max.apply(null, ze.zones.map(function (z) { return z.rows; }));
    const H = 36 + Math.min(maxRows, 8) * 13, padL = 36, padR = 8, padT = 8, padB = 16, pw = W - padL - padR, ph = H - padT - padB;
    const X = function (s) { return padL + (s - lo) / L * pw; };
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="' + RP_FONT + '" xmlns="http://www.w3.org/2000/svg">';
    svg += '<rect x="' + padL + '" y="' + padT + '" width="' + pw + '" height="' + ph + '" fill="#eef2f5" stroke="#9fb0bd" stroke-width=".6"/>';
    const step = rpNice(L, 8);
    for (let s = Math.ceil(lo / step) * step; s <= hi + 1e-9; s += step) {
      const x = X(s); svg += '<line x1="' + x + '" x2="' + x + '" y1="' + padT + '" y2="' + (padT + ph + 3) + '" stroke="#c4ced6" stroke-width=".4"/><text x="' + x + '" y="' + (H - 4) + '" font-size="6" text-anchor="middle" fill="' + RP.mut + '">' + esc(stn(s)) + '</text>';
    }
    ze.zones.forEach(function (z, zi) {
      const x0 = X(z.lo), x1 = X(z.hi), bh = ph / z.rows;
      if (zi > 0) svg += '<line x1="' + x0 + '" x2="' + x0 + '" y1="' + padT + '" y2="' + (padT + ph) + '" stroke="' + RP.navy + '" stroke-width=".8" stroke-dasharray="2,2"/>';
      for (let j = 1; j < z.rows; j++) svg += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + (padT + j * bh) + '" y2="' + (padT + j * bh) + '" stroke="#9fb0bd" stroke-width=".5" stroke-dasharray="3,2"/>';
      svg += '<text x="' + ((x0 + x1) / 2) + '" y="' + (padT + 6) + '" font-size="6" text-anchor="middle" fill="' + RP.navy + '" opacity=".8">' + z.rows + ' ردیف</text>';
      z.dp.rows.forEach(function (rw) {
        const cy = padT + (rw.index + 0.5) * bh;
        rw.loads.forEach(function (l) {
          svg += '<circle cx="' + X(l.station) + '" cy="' + cy + '" r="' + Math.max(1.3, Math.min(bh * 0.28, 3)) + '" fill="' + RP.gold + '" stroke="' + RP.navy + '" stroke-width=".4"/>';
        });
      });
    });
    return svg + '</svg>';
  }
  function mtLayerSection(cx, rs) {
    const secs = cx.secs, mid = (rs.info.lo + rs.info.hi) / 2, w = C.widthsAt(secs, mid);
    const wl = w.wL, wr = w.wR, W = 360, H = 74, pad = 10, tot = wl + wr, sx = (W - 2 * pad) / Math.max(tot, 1e-9);
    const zs = [C.designZAt(secs, mid, -wl).z, C.designZAt(secs, mid, 0).z, C.designZAt(secs, mid, wr).z];
    const zc = zs[1], hi = C.surfOffset(rs.info.hiId, cx.layers), lo = C.surfOffset(rs.info.loId, cx.layers);
    const sy = 24 / Math.max(rs.info.t, 0.01);
    const Y = function (z, off) { return 28 + (-(z - zc) - (off - hi)) * sy; };
    const polyTop = [], polyBot = [];
    [[-wl, zs[0]], [0, zs[1]], [wr, zs[2]]].forEach(function (q) { polyTop.push([pad + (q[0] + wl) * sx, Y(q[1], hi)]); polyBot.push([pad + (q[0] + wl) * sx, Y(q[1], lo)]); });
    const pts = polyTop.concat(polyBot.slice().reverse()).map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="' + RP_FONT + '"><polygon points="' + pts + '" fill="' + RP.gold + '" fill-opacity=".55" stroke="' + RP.navy + '" stroke-width=".8"/>' +
      '<polyline points="' + polyBot.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '" fill="none" stroke="#6a7783" stroke-width=".6" stroke-dasharray="3,2"/>' +
      '<text x="' + (W / 2) + '" y="' + (polyTop[1][1] - 6) + '" font-size="8" text-anchor="middle" fill="' + RP.navy + '">' + esc(rs.mat.name || '') + '</text>' +
      '<text x="' + (W / 2) + '" y="' + (H - 5) + '" font-size="7" text-anchor="middle" fill="' + RP.mut + '">' + 'ضخامت ' + C.fmt(rs.info.t * 100, 1) + ' cm • مجموع عرض ' + C.fmt(tot, 2) + ' m' + '</text></svg>';
  }

  async function sfLoadFile(file) {
    const d = sfData();
    toast('در حال خواندن «' + file.name + '» …');
    try {
      const buf = await file.arrayBuffer(), hex = C.sha256Hex(new Uint8Array(buf));
      const dup = d.st.asbuilt.find(function (x) { return x.tab === 'sv' && x.sha256 === hex; });
      if (dup) {
        S.sf.file = dup.id;
        if (!(await RAW.has(dup.id))) { const ok = await RAW.put(dup.id, buf); S.sf.raw[dup.id] = ok; render(); toast(ok ? 'فایل خام همین فایل بازیابی شد (SHA-256 یکی است).' : 'ذخیره‌ی فایل خام در این مرورگر ممکن نشد.', ok ? undefined : 'err'); }
        else { render(); toast('این فایل (با همان SHA-256) قبلاً بارگذاری شده است.'); }
        return;
      }
      const rd = await readPointFile(file, buf), pr = penzdParse(rd.rows, rd.delim);
      if (!pr.pts.length) throw new Error('نقطه‌ی معتبری (شماره، E، N، Z) در فایل پیدا نشد.');
      const id = C.uid('ab');
      const rec = { id: id, name: file.name, date: new Date().toISOString(), layerId: '', layerMan: '', tab: 'sv', src: 'penzd', size: buf.byteLength, sha256: hex, pts: pr.pts, skipped: pr.skipped.slice(0, 500) };
      rec.csha256 = C.sha256Text(sfFileStr(rec));
      d.st.asbuilt.push(rec);
      const saved = await RAW.put(id, buf); S.sf.raw[id] = saved;
      S.sf.file = id; S.sf.page = 0; markDirty(); render();
      const out = sfOutside(d, rec);
      const msgs = [pr.pts.length + ' نقطه خوانده شد'];
      if (pr.skipped.length) msgs.push(pr.skipped.length + ' ردیف خوانده نشد');
      if (out && out.outside) msgs.push('هشدار: ' + out.outside + ' نقطه بیرون از محدوده‌ی این خیابان است');
      if (!saved) msgs.push('فایل خام در این مرورگر ذخیره نشد (خروجی فایل اصلی ممکن نیست)');
      toast(msgs.join(' • ') + '.', (pr.skipped.length || (out && out.outside) || !saved) ? 'err' : undefined);
    } catch (e) { toast('فایل خوانده نشد: ' + (e.message || 'خطای نامشخص'), 'err'); }
  }

    }
    for (let i = 0; i < files.length; i++) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(files[i]); a.download = files[i].name; document.body.appendChild(a); a.click();

      await new Promise(function (r) { setTimeout(r, 400); });
    }
  }

  /* ============================== امضای دیجیتال گزارش (کلید ECDSA همین دستگاه) ============================== */
  const SIGK = (function () {
    let cache;
    const ALG = { name: 'ECDSA', namedCurve: 'P-256' }, SG = { name: 'ECDSA', hash: 'SHA-256' };
    const ok = function () { return !!(window.crypto && crypto.subtle); };
    const b64 = function (u) { let t = ''; for (let i = 0; i < u.length; i++) t += String.fromCharCode(u[i]); return btoa(t); };
    const unb64 = function (t) { const x = atob(String(t).replace(/\s+/g, '')), u = new Uint8Array(x.length); for (let i = 0; i < x.length; i++) u[i] = x.charCodeAt(i); return u; };
    const keyIdOf = function (spki) { return C.controlCode(C.sha256Hex(unb64(spki))); };
    async function build(rec) {
      const priv = await crypto.subtle.importKey('jwk', rec.jwk, ALG, true, ['sign']);
      return { name: rec.name, created: rec.created, spki: rec.spki, keyId: keyIdOf(rec.spki), priv: priv };
    }
    async function load() {
      if (cache !== undefined) return cache;
      if (!ok()) return (cache = null);
      const r = await RAW.kget('main');
      cache = r && r.jwk ? await build(r).catch(function () { return null; }) : null;
      return cache;
    }
    async function create(name) {
      const kp = await crypto.subtle.generateKey(ALG, true, ['sign', 'verify']);
      const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey), spki = b64(new Uint8Array(await crypto.subtle.exportKey('spki', kp.publicKey)));
      const rec = { name: name, created: new Date().toISOString(), spki: spki, jwk: jwk };
      const saved = await RAW.kput('main', rec);
      cache = await build(rec);
      return { key: cache, saved: saved };
    }
    async function sign(msg) {
      const k = await load(); if (!k) throw new Error('کلید امضا ساخته نشده است.');
      return b64(new Uint8Array(await crypto.subtle.sign(SG, k.priv, new TextEncoder().encode(msg))));
    }
    async function verify(spki, sig, msg) {
      const pub = await crypto.subtle.importKey('spki', unb64(spki), ALG, false, ['verify']);
      return crypto.subtle.verify(SG, pub, unb64(sig), new TextEncoder().encode(msg));
    }
    async function pbk(pw, salt) {
      const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    async function exportBackup(pw) {
      const r = await RAW.kget('main'); if (!r) throw new Error('کلیدی برای خروجی نیست.');
      const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), k = await pbk(pw, salt);
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode(JSON.stringify(r))));
      return JSON.stringify({ app: 'roadstake-key', v: 1, keyId: keyIdOf(r.spki), name: r.name, created: r.created, spki: r.spki, kdf: 'PBKDF2-SHA256-200000', salt: b64(salt), iv: b64(iv), ct: b64(ct) }, null, 2);
    }
    async function importBackup(text, pw) {
      let o; try { o = JSON.parse(text); } catch (e) { throw new Error('فایل کلید معتبر نیست.'); }
      if (!o || o.app !== 'roadstake-key' || !o.ct) throw new Error('این فایل، پشتیبان کلید این برنامه نیست.');
      let rec;
      try { const k = await pbk(pw, unb64(o.salt)); rec = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.iv) }, k, unb64(o.ct)))); }
      catch (e) { throw new Error('رمز اشتباه است یا فایل خراب است.'); }
      if (!rec || rec.spki !== o.spki || !rec.jwk) throw new Error('محتوای فایل کلید با مشخصات آن نمی‌خواند.');
      const built = await build(rec);
      await RAW.kput('main', rec); cache = built; return built;
    }
    return { ok: ok, load: load, create: create, sign: sign, verify: verify, exportBackup: exportBackup, importBackup: importBackup, keyIdOf: keyIdOf };
  })();
  S.rpo = { client: false, boxes: false }; S.rpoCur = { client: false, boxes: false }; S.ky = { info: undefined };
  async function keyRefresh() { try { S.ky.info = SIGK.ok() ? await SIGK.load() : null; } catch (e) { S.ky.info = null; } if (S.page === 'projects' || S.page === 'security') render(); }

  /** متن گزارش (برای اثرانگشت): فقط متن صفحه‌ها، بدون کادرهای افزوده */
  const rptTextOf = function (pages) { return Array.prototype.map.call(pages, function (pg) { return pg.textContent.replace(/\s+/g, ' ').trim(); }).join('\n'); };
  async function rptSign(text, N, title) {
    const key = await SIGK.load(); if (!key) throw new Error('کلید امضا ساخته نشده است.');
    const docHash = C.sha256Text('RS-DOC-1\n' + title + '\n' + N + '\n' + text), iso = new Date().toISOString(), payload = 'RS-SIG-2|' + docHash + '|' + N + '|' + iso + '|' + String(key.name || '').replace(/\|/g, '/');
    const sig = await SIGK.sign(payload);
    try {
      const st = activeStreet(); if (st) {
        const pd = st.pdfs || (st.pdfs = []);
        pd.push({ id: C.uid('pd'), date: iso, title: String(title || '').slice(0, 200), n: N, hash: docHash, payload: payload, sig: sig, keyId: key.keyId, name: key.name, spki: key.spki, lock: (st.locks || []).length });
        if (pd.length > 60) pd.splice(0, pd.length - 60);
        markDirty();
      }
    } catch (e) { /* ثبت PDF اختیاری است */ }
    return { docHash: docHash, payload: payload, iso: iso, sig: sig, key: key };
  }
  /* ---------- QR بررسی امضا: لینک برنامه + (متن امضاشده، امضا، کلید) فشرده در بخش # ---------- */
  const SPKI_PRE = '3059301306072a8648ce3d020106082a8648ce3d030107034200';
  const qrU8 = function (b64s) { const x = atob(String(b64s).replace(/\s+/g, '')), u = new Uint8Array(x.length); for (let i = 0; i < x.length; i++) u[i] = x.charCodeAt(i); return u; };
  const qrB64 = function (u) { let t = ''; for (let i = 0; i < u.length; i++) t += String.fromCharCode(u[i]); return btoa(t); };
  const qrHex = function (h) { const u = new Uint8Array(h.length / 2); for (let i = 0; i < u.length; i++) u[i] = parseInt(h.substr(i * 2, 2), 16); return u; };
  function qrPack(s) {
    const key = qrU8(s.key.spki), sig = qrU8(s.sig), pay = new TextEncoder().encode(s.payload), pre = qrHex(SPKI_PRE);
    let kb = key, fl = 2;
    if (key.length === pre.length + 65 && pre.every(function (v, i) { return key[i] === v; })) { kb = key.slice(pre.length); fl = 1; }
    const out = new Uint8Array(4 + kb.length + sig.length + pay.length);
    out[0] = 1; out[1] = fl; out[2] = sig.length; out[3] = kb.length; out.set(kb, 4); out.set(sig, 4 + kb.length); out.set(pay, 4 + kb.length + sig.length);
    return qrB64(out).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function qrUnpack(q) {
    const t = String(q).replace(/-/g, '+').replace(/_/g, '/'), u = qrU8(t + '='.repeat((4 - t.length % 4) % 4));
    if (u[0] !== 1) throw new Error('نسخه‌ی QR ناشناخته است.');
    const fl = u[1], sl = u[2], kl = u[3], kb = u.slice(4, 4 + kl), sig = u.slice(4 + kl, 4 + kl + sl), pay = u.slice(4 + kl + sl);
    let key = kb; if (fl === 1) { key = new Uint8Array(kb.length + 26); key.set(qrHex(SPKI_PRE), 0); key.set(kb, 26); }
    return { payload: new TextDecoder().decode(pay), sig: qrB64(sig), key: qrB64(key) };
  }
  function qrLink(s) {
    if (!/^https?:$/.test(location.protocol)) return '';
    return location.origin + location.pathname + '#/security?q=' + qrPack(s);
  }
  function qrBlock(s) {
    try {
      const link = qrLink(s); if (!link || !window.RoadQR) return '<div class="rpl-dsq rpl-dsq-na"><span>QR ساخته نشد: برای داشتن QR، اپ باید از آدرس http یا https باز باشد (نه از فایل ذخیره‌شده روی گوشی).</span></div>';
      const q = RoadQR.encodeText(link, 'L');
      return '<div class="rpl-dsq">' + RoadQR.toSvg(q, '38mm') + '<span>برای بررسی امضا اسکن کنید</span></div>';
    } catch (e) { return '<div class="rpl-dsq rpl-dsq-na"><span>QR ساخته نشد (حجم داده‌ی امضا برای QR زیاد است).</span></div>'; }
  }
  const rptShort = function (s, N, k) {

  };
  const rptFull = function (s, N) {
    return '<div class="rpl-dsf"><div class="rpl-dsf-t"><b>امضای دیجیتال گزارش — ' + esc(lkDate(s.iso)) + ' • ' + N + ' صفحه • ECDSA P-256 / SHA-256</b>' +
      '<span>اثرانگشت دیجیتال (SHA-256) — کل گزارش</span><code dir="ltr">' + esc(s.docHash) + '</code>' +
      '<span>متن امضاشده</span><code dir="ltr">' + esc(s.payload) + '</code>' +
      '<span>امضا (Base64)</span><code dir="ltr">' + esc(s.sig) + '</code>' +
      '<span>کلید عمومی (SPKI، Base64) — صاحب کلید: ' + esc(s.key.name) + ' • شناسه‌ی کلید <bdi dir="ltr">' + esc(s.key.keyId) + '</bdi></span><code dir="ltr">' + esc(s.key.spki) + '</code></div>' + qrBlock(s) + '</div>';
  };
  /** کادر امضای فشرده برای پایین هر صفحه */
  function sigCompact() {
    const sg = (P().signers || []).filter(function (x) { return x.title || x.name; });
    if (!sg.length) return '';
    return '<div class="rpl-sgs" style="grid-template-columns:repeat(' + sg.length + ',1fr)">' + sg.map(function (x) { return '<div><b>' + esc(x.title) + '</b>' + esc(x.name) + '<i>امضا</i></div>'; }).join('') + '</div>';
  }
  /** گزارش‌های قالب قدیمی (غیر rpl): امضای دیجیتال یک‌بار در انتهای گزارش */

  /* ---------- صفحه‌بندی با اندازه‌ی واقعی ----------
     ردیف‌ها یکی‌یکی در یک صفحه‌ی آزمایشی (با همان استایل چاپ) چیده می‌شوند تا صفحه پر شود؛ فضای کادر امضا و امضای دیجیتال از پیش حساب می‌شود. */

      Array.prototype.forEach.call(rules || [], function (r) {

  /** sp: {top, head, units:[html هر ردیف یا گروه ردیف‌های جدانشدنی], tail, foot(k,N)} ← HTML صفحه‌ها */
  async function rplFlow(sp) {

    const o = S.rpoCur || {}, pa = $('#printArea'), key = S.ky && S.ky.info;
    const dummy = { iso: new Date().toISOString(), docHash: new Array(65).join('0'), sig: new Array(89).join('A'), key: { name: key ? key.name : 'نام صاحب کلید', keyId: 'XXXXX-XXXXX', spki: key ? key.spki : new Array(125).join('A') } };
    dummy.payload = 'RS-SIG-2|' + dummy.docHash + '|99|' + dummy.iso + '|' + dummy.key.name;
    const boxes = o.boxes ? sigCompact() : '';
    const decN = (o.client ? rptShort(dummy, 99, 99) : '') + boxes, decL = (o.client ? rptFull(dummy, 99) : '') + decN;
    const css = document.createElement('style'); css.textContent = rplMeasureCss(); document.head.appendChild(css);
    const oldCls = pa.className, oldStyle = pa.getAttribute('style'), oldHtml = pa.innerHTML;
    pa.className = 'pt rp rpl'; pa.setAttribute('style', 'display:block;position:absolute;left:-10000px;top:0;width:186mm;visibility:hidden');
    const LIM = 256 / 25.4 * 96 - 8, U = sp.units || [];
    const body = function (k, units, last) { return (k === 0 ? sp.top : '') + (units.length ? sp.head + units.join('') + '</tbody></table>' : '') + (last ? sp.tail : ''); };
    const fits = function (k, units, last) {
      pa.innerHTML = '<div class="rpl-pg' + (last ? ' last' : '') + '" style="min-height:0">' + body(k, units, last) + '<div class="rpl-dec">' + (last ? decL : decN) + '</div>' + sp.foot(k, 99) + '</div>';
      return pa.firstChild.getBoundingClientRect().height <= LIM;
    };
    const pages = []; let html = '';
    try {
      let i = 0;
      for (;;) {
        const k = pages.length, take = [];
        while (i < U.length) {
          take.push(U[i]);
          if (take.length > 1 && !fits(k, take, false)) { take.pop(); break; }
          i++;
        }
        pages.push(take);
        if (i >= U.length) break;

      });
    } finally {
      css.remove(); pa.className = oldCls; if (oldStyle === null) pa.removeAttribute('style'); else pa.setAttribute('style', oldStyle); pa.innerHTML = oldHtml;
    }
    return html;
  }

  async function lkZip(i) {
    const d = sfData(), st = d.st, r = st.locks[i]; if (!r) return;
    const files = [], miss = [], used = {};
    for (const f of r.files) {
      const buf = await RAW.get(f.id); let ok = false;
      if (buf) ok = C.sha256Hex(new Uint8Array(buf)) === f.sha256;
      if (!ok) { miss.push(f.name); continue; }
      let nm = f.name; if (used[nm]) nm = f.sha256.slice(0, 8) + '_' + nm; used[nm] = 1;
      files.push({ name: 'files/' + nm, data: new Uint8Array(buf), sha: f.sha256 });
    }
    if (miss.length && !(await ask('فایل خام این فایل‌ها در این دستگاه نیست و در ZIP نمی‌آید:<br>' + miss.map(esc).join('<br>') + '<br>ادامه می‌دهید؟', { ok: 'ادامه' }))) return;
    const chain = st.locks.slice(0, i + 1), vr = C.verifyLocks(chain);
    const readme = 'RoadStake v' + APP_VERSION + ' - lock package\nProject: ' + r.project + '\nStreet: ' + r.street + '\nVersion: ' + r.no + '\nLocked: ' + r.date + '\nVersion SHA-256: ' + r.hash + '\nControl code: ' + C.controlCode(r.hash) + '\nChain valid: ' + vr.every(function (x) { return x.ok; }) + '\n\n' +
      'files/            the original files, byte-for-byte\nSHA256SUMS.txt    check with: sha256sum -c SHA256SUMS.txt\nlock.json         the chain of versions (version hash = SHA-256 of the canonical text below)\n\nCanonical text of this version:\n' + C.lockCanon(r) + (miss.length ? '\nMissing raw files (not included): ' + miss.join(', ') + '\n' : '');
    const zip = IO.zipStore(files.map(function (x) { return { name: x.name, data: x.data }; }).concat([
      { name: 'SHA256SUMS.txt', data: files.map(function (x) { return x.sha + '  ' + x.name; }).join('\n') + '\n' },
      { name: 'lock.json', data: JSON.stringify({ app: 'RoadStake', version: APP_VERSION, chain: chain }, null, 2) },
      { name: 'README.txt', data: readme }]));
    deliver(slugFa(r.project) + '_' + slugFa(r.street) + '_نسخه' + r.no + '.zip', zip, MIME.zip);
    toast('پرونده‌ی ZIP نسخه‌ی ' + r.no + ' آماده شد (' + files.length + ' فایل).');
  }

  /* ============================== مقایسه با فایل کارفرما ============================== */
  const CMP_KIND_FA = {
    bom: 'نویسه‌ی نامرئی ابتدای فایل (BOM) در یکی هست و در دیگری نیست (اغلب بعد از ذخیره در ویندوز یا اکسل).',
    eol: 'پایان خط‌ها فرق دارد (ویندوز CRLF یا لینوکس/مک LF).',
    trail: 'فاصله‌ی اضافه در انتهای بعضی خط‌ها فرق دارد.',
    endnl: 'تعداد خط‌های خالیِ انتهای فایل فرق دارد.'
  };
  async function sfCompare(file) {
    const d = sfData(); if (!d.file) { toast('ابتدا فایل نقاط را بارگذاری کنید.', 'err'); return; }
    toast('در حال مقایسه…');
    try {
      const buf = await file.arrayBuffer(), bytes = new Uint8Array(buf), hex = C.sha256Hex(bytes);
      const res = { name: file.name, size: bytes.length, hex: hex, date: new Date().toISOString(), causes: [], listing: [], match: false };
      const same = d.files.find(function (x) { return x.sha256 === hex; });
      const lockHit = []; (d.st.locks || []).forEach(function (r) { r.files.forEach(function (f) { if (f.sha256 === hex) lockHit.push(r.no); }); });
      if (same) {
        res.match = true; res.target = { id: same.id, name: same.name, sha256: same.sha256, size: same.size || 0, n: same.pts.length };
        if (same.name !== file.name) res.causes.push('نام دو فایل فرق دارد ولی بایت‌ها یکی است؛ نام فایل در اثرانگشت اثری ندارد.');
        if (lockHit.length) res.causes.push('این فایل در نسخه‌ی ' + lockHit.join('، ') + ' قفل نهایی ثبت شده است.');
      } else {
        const target = d.files.find(function (x) { return x.name === file.name; }) || d.file;
        res.target = { id: target.id, name: target.name, sha256: target.sha256 || '', size: target.size || 0, n: target.pts.length };
        const isX = function (n) { return /\.xlsx$/i.test(n); };
        const rd = await readPointFile(file, buf), pr = penzdParse(rd.rows, rd.delim);
        res.theirsN = pr.pts.length; res.theirsSkipped = pr.skipped.length;
        const cmp = C.comparePointSets(target.pts, pr.pts); res.cmp = cmp;
        let td = null;
        const raw = await RAW.get(target.id);
        if (raw && !isX(file.name) && !isX(target.name)) { const dec = new TextDecoder('utf-8', { ignoreBOM: true }); td = C.textDiffKinds(dec.decode(new Uint8Array(raw)), dec.decode(bytes)); }
        else if (!raw) res.causes.push('فایل خامِ ما در این دستگاه نیست؛ مقایسه فقط روی نقاط خوانده‌شده انجام شد، نه روی متن فایل.');
        if (td && td.kinds.length) td.kinds.forEach(function (k) { res.causes.push(CMP_KIND_FA[k]); });
        if (cmp.nA !== cmp.nB) res.causes.push('تعداد نقاط فرق دارد: فایل ما ' + cmp.nA + '، فایل کارفرما ' + cmp.nB + '.');
        if (cmp.missing.length) { res.causes.push(cmp.missing.length + ' نقطه در فایل ما هست و در فایل کارفرما نیست.'); cmp.missing.slice(0, 25).forEach(function (q) { res.listing.push(['فقط در فایل ما', q.n, '', q.xs + ' , ' + q.ys + ' , ' + q.zs, '']); }); }
        if (cmp.extra.length) { res.causes.push(cmp.extra.length + ' نقطه در فایل کارفرما هست و در فایل ما نیست.'); cmp.extra.slice(0, 25).forEach(function (q) { res.listing.push(['فقط در فایل کارفرما', q.n, '', '', q.xs + ' , ' + q.ys + ' , ' + q.zs]); }); }
        if (cmp.changed.length) { res.causes.push('مختصات ' + cmp.changed.length + ' نقطه فرق دارد.'); cmp.changed.slice(0, 40).forEach(function (c) { res.listing.push(['مختصات متفاوت', c.n, c.fields.join('، '), c.a.xs + ' , ' + c.a.ys + ' , ' + c.a.zs, c.b.xs + ' , ' + c.b.ys + ' , ' + c.b.zs]); }); }
        if (cmp.orderDiff) res.causes.push('نقاط یکی است ولی ترتیب نقاط در دو فایل فرق دارد.');
        if (cmp.formatOnly) res.causes.push('شکل نوشتن عدد در ' + cmp.formatOnly + ' نقطه فرق دارد (مثلاً 100.50 و 100.5)؛ مقدارها یکی است ولی متن فرق دارد.');
        if (cmp.descDiff) res.causes.push('توضیحات ' + cmp.descDiff + ' نقطه فرق دارد.');
        if (pr.skipped.length) res.causes.push(pr.skipped.length + ' ردیف فایل کارفرما خوانده نشد (قالب یا ستون نامعتبر).');
        if (cmp.identical && !(td && td.kinds.length)) res.causes.push('نقاط و ترتیبشان یکی است ولی متن فایل‌ها فرق دارد (مثلاً سرستون، توضیح بالای فایل، جداکننده یا قالب فایل).');
        if (td && td.kinds.length && cmp.identical) res.causes.unshift('نقاط دقیقاً یکی است و فقط شکل ظاهری فایل فرق دارد؛ اثرانگشت با کوچک‌ترین تغییر ظاهری عوض می‌شود.');
        if (target.name !== file.name) res.causes.push('نام دو فایل هم فرق دارد (نام در اثرانگشت اثری ندارد).');
        if (target.sha256 === '') res.causes.push('فایل ما اثرانگشت بایت ندارد (نسخه‌ی قدیمی بارگذاری).');
      }
      S.sf.cmp = res; render();
    } catch (e) { toast('مقایسه انجام نشد: ' + (e.message || 'خطای نامشخص'), 'err'); }
  }

      h += '<div class="row" style="margin-top:8px"><button class="btn primary grow" data-act="cmpPdf">گزارش مقایسه (PDF)</button></div>';
    }
    return h + '</section>';

  function setPath(path, v) {
    const k = path.split('.'); let o = P();
    for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
    o[k[k.length - 1]] = v;
  }

  function parseByType(t, text) {
    text = text.trim();
    if (t === 'text') return text;
    if (t === 'int') { const n = C.toNumber(text); return fin(n) ? Math.round(n) : NaN; }
    if (text === '') return null;
    if (t === 'stn') return C.parseStation(text);
    return C.toNumber(text);
  }

    if (el.id === 'pvSt') { S.pvSt = el.value; slopesLive(); return; }
    if (el.id === 'stJump') { jumpStake(el.value); return; }
    if (el.id === 'stStep') {
      const before = stakeCtx(), cur = before.secs && before.secs[S.stakeIdx] ? before.secs[S.stakeIdx].station : null, v = C.toNumber(el.value);
      P().stakeStep = el.value.trim() && fin(v) && v > 0 ? String(el.value.trim()) : '';
      if (el.value.trim() && !P().stakeStep) toast('گام باید عدد مثبت باشد.', 'err');
      const after = stakeCtx(); let idx = 0;
      if (cur !== null && after.secs && after.secs.length) { idx = after.secs.findIndex(function (q) { return q.station >= cur - 1e-9; }); if (idx < 0) idx = after.secs.length - 1; }
      S.stakeIdx = idx; markDirty(); render(); return;
    }
    if (el.id === 'stShort') { activeStreet().short = el.value.trim().replace(/[^A-Za-z0-9_\-]+/g, '').slice(0, 16); el.value = activeStreet().short; markDirty(); return; }
    if (el.id === 'expGpsAll') { S.exp.gpsAll = el.checked; render(); return; }
    if (el.id === 'svStep') {
      const before = svCtx(), cur = before.secs[S.sv.idx] ? before.secs[S.sv.idx].station : null, v = C.toNumber(el.value);
      P().svStep = el.value.trim() && fin(v) && v > 0 ? String(el.value.trim()) : '';
      if (el.value.trim() && !P().svStep) toast('گام باید عدد مثبت باشد.', 'err');
      const after = svCtx(); let idx = 0;
      if (cur !== null && after.secs.length) { idx = after.secs.findIndex(function (q) { return q.station >= cur - 1e-9; }); if (idx < 0) idx = after.secs.length - 1; }
      S.sv.idx = idx; S.sv.key = null; markDirty(); render(); return;
    }
    if (el.id === 'svMidStep') {
      const v = C.toNumber(el.value);
      P().svMidStep = el.value.trim() && fin(v) && v > 0 ? String(el.value.trim()) : '';
      if (el.value.trim() && !P().svMidStep) toast('گام باید عدد مثبت باشد.', 'err');
      markDirty(); render(); return;
    }
    if (el.id === 'stMidStep') {
      const v = C.toNumber(el.value);
      P().stakeMidStep = el.value.trim() && fin(v) && v > 0 ? String(el.value.trim()) : '';
      if (el.value.trim() && !P().stakeMidStep) toast('گام باید عدد مثبت باشد.', 'err');
      markDirty(); render(); return;
    }
    if (el.id === 'expDelim') { S.exp.delim = el.value; return; }
    if (el.id === 'expLayer') { S.exp.layer = el.value; return; }
    if (el.id === 'expShare') { S.exp.share = el.checked; return; }
    if (el.id === 'actStreet' || el.dataset.imp === 'street') { switchStreet(el.value); return; }
    if (el.dataset.imp) { onImpChange(el); return; }
    const path = el.dataset.p;
    if (!path || !S.project) return;
    const t = el.dataset.t || 'text';
    let v, negSlope = false;
    const oldStation = /^points\.\d+\.station$/.test(path) ? (P().points[parseInt(path.split('.')[1], 10)] || {}).station : undefined;
    if (el.type === 'checkbox') v = el.checked;
    else if (t === 'sel') v = el.value === 'true' ? true : el.value === 'false' ? false : (el.value === '' ? null : el.value);
    else if (t === 'ssel') v = el.value === '' ? null : C.toNumber(el.value);
    else v = parseByType(t, el.value);
    if (/^sections\.\d+\.(sL|sR)$/.test(path) && typeof v === 'number' && v < 0) { v = NaN; negSlope = true; }
    if (typeof v === 'number' && Number.isNaN(v)) {
      S.rawBad[path] = el.value; el.classList.add('bad');
      toast(negSlope ? 'شیب را بدون علامت وارد کنید؛ جهت را «مدل شیب» تعیین می‌کند.' : 'مقدار نامعتبر: «' + el.value + '»', 'err');
    } else {
      delete S.rawBad[path]; el.classList.remove('bad');
      if (t !== 'text' && t !== 'sel' && t !== 'ssel' && t !== 'int' && el.type !== 'checkbox') el.value = fmtVal(t, v);
    }
    if (path === 'settings.decimals' && typeof v === 'number' && !Number.isNaN(v)) v = Math.min(6, Math.max(3, v));
    if (path === 'settings.utmZone' && typeof v === 'number' && !Number.isNaN(v)) v = Math.min(60, Math.max(1, v));
    setPath(path, v);
    const pgm = /^points\.(\d+)\.(id|station|x|y|z)$/.exec(path); if (pgm && P().points[+pgm[1]]) delete P().points[+pgm[1]].peg;
    if (/^sections\.\d+\.(mode|wL|wR|sL|sR)$/.test(path)) { const row = P().sections[parseInt(path.split('.')[1], 10)]; if (row && row.auto) row.auto = false; }
    if (/^setups\.\d+\.(from|to)$/.test(path)) P().setups = C.sortSetups(P().setups);
    const sm = /^streets\.(\d+)\.survey\.(\d+)\.(reading|bs)$/.exec(path);
    if (sm && typeof v === 'number' && !Number.isNaN(v)) {
      const rec = P().streets[+sm[1]].survey[+sm[2]];
      if (sm[3] === 'bs') {
        const bm = P().benchmarks.find(function (b) { return b.id === rec.bmId; });
        const z = fin(rec.bmZ) ? rec.bmZ : (bm ? C.toNumber(bm.z) : NaN);
        rec.hi = z + v;
      }
      rec.zMeas = fin(rec.hi) && fin(rec.reading) ? rec.hi - rec.reading : null;
    }
    if (oldStation !== undefined && fin(oldStation) && typeof v === 'number' && fin(v) && Math.abs(oldStation - v) > 1e-9) carrySlope(oldStation, v);
    markDirty();
    if (/^layers\.\d+\.(from|to)$/.test(path) && Number.isNaN(v)) { render(); return; }
    if (/^sections\.\d+\.station$/.test(path)) {
      P().sections.sort(function (a, b) { return (fin(a.station) ? a.station : Infinity) - (fin(b.station) ? b.station : Infinity); });
      S.rawBad = {}; render(); return;
    }
    if (el.dataset.re || t === 'int') render(); else refreshLive();
  }

  /** با ویرایش کیلومتر یک نقطه‌ی محور، شیب ثبت‌شده برای همان نقطه هم به کیلومتر جدید منتقل می‌شود */
  function carrySlope(oldSt, newSt) {
    const p = P();
    if (p.points.some(function (q) { return fin(q.station) && Math.abs(q.station - oldSt) < 1e-6; })) return;   // نقطه‌ی دیگری هنوز همان کیلومتر را دارد
    const rec = p.sections.find(function (r) { return fin(r.station) && Math.abs(r.station - oldSt) < 1e-6; });
    if (!rec) return;
    if (p.sections.some(function (r) { return r !== rec && fin(r.station) && Math.abs(r.station - newSt) < 1e-6; })) return;   // کیلومتر جدید شیب خودش را دارد
    rec.station = newSt;
    p.sections.sort(function (a, b) { return (fin(a.station) ? a.station : Infinity) - (fin(b.station) ? b.station : Infinity); });
  }

  function impSyncMap(im) { im.map = IO.rolesToMap(im.roles); }

  function onImpChange(el) {
    const im = S.imp; if (!im) return;
    const k = el.dataset.imp;
    if (k === 'hasHeader') im.hasHeader = el.checked;
    else if (k === 'mode') im.mode = el.value;
    else if (k === 'startStation') { const v = C.parseStation(el.value); im.startStation = fin(v) ? v : 0; }
    else if (k === 'preset') {
      if (IO.PRESETS[el.value]) { im.roles = IO.mapToRoles(IO.PRESETS[el.value].map, im.cols); impSyncMap(im); im.preset = el.value; im.tplId = ''; }
    } else if (k === 'tpl') {
      const t = P().importTemplates.find(function (x) { return x.id === el.value; });
      if (t) {
        im.roles = []; for (let i = 0; i < im.cols; i++) im.roles.push(t.roles[i] || '');
        im.hasHeader = !!t.hasHeader; im.tplId = t.id; im.preset = 'custom'; impSyncMap(im); S.tplName = t.name;
      } else im.tplId = '';
    } else if (k === 'role') {
      const i = parseInt(el.dataset.i, 10), r = el.value;
      if (r) im.roles.forEach(function (x, j) { if (j !== i && x === r) im.roles[j] = ''; });
      im.roles[i] = r; impSyncMap(im); im.preset = 'custom'; im.tplId = '';
    }
    render();
  }

  function jumpStake(text) {
    const cx = stakeCtx(); if (!cx.secs) return;
    const v = C.parseStation(text);
    if (!fin(v)) { toast('کیلومتراژ نامعتبر است.', 'err'); render(); return; }
    if (!cx.secs.length) return;
    if (cx.layer && ((cx.layer.from !== null && v < cx.layer.from - 1e-9) || (cx.layer.to !== null && v > cx.layer.to + 1e-9))) toast('این کیلومتراژ در بازه‌ی لایه‌ی «' + cx.layer.name + '» نیست؛ نزدیک‌ترین مقطع نمایش داده شد.', 'err');
    let idx = cx.secs.findIndex(function (s) { return s.station >= v - 1e-9; });
    if (idx < 0) idx = cx.secs.length - 1;
    S.stakeIdx = idx; render();
  }

  async function restoreBackup(file) {
    let list;
    try { list = IO.parseAnyBackup(await file.text()); } catch (e) { toast(e.message || 'بازیابی ممکن نشد.', 'err'); return; }
    let n = 0, skipped = 0, openId = null;
    for (const p of list) {
      if (ST.exists(p.id)) {
        const ok = await ask('پروژه‌ای با همین شناسه («' + esc(ST.load(p.id).name) + '») وجود دارد. «جایگزینی» آن را با پشتیبان بازنویسی می‌کند؛ «نسخه‌ی جدید» پروژه‌ی تازه‌ای می‌سازد و پروژه‌ی فعلی را دست‌نخورده می‌گذارد.', { title: 'پروژه‌ی تکراری', ok: 'جایگزینی', cancel: 'ساخت نسخه‌ی جدید', danger: true });
        if (!ok) { p.id = C.uid('p'); p.name += ' (بازیابی)'; }
        else {
          const sure = await ask('مطمئنید؟ پروژه‌ی موجود برای همیشه جایگزین می‌شود.', { danger: true, ok: 'بله، جایگزین کن' });
          if (!sure) { skipped++; continue; }
        }
      }
      const r = ST.save(p);
      if (!r.ok) { toast(r.error, 'err'); skipped++; continue; }
      n++;
      if (S.project && S.project.id === p.id) openId = p.id;
    }
    toast(n + ' پروژه بازیابی شد.' + (skipped ? ' (' + skipped + ' مورد رد شد)' : ''));
    if (openId) { S.dirty = false; await openProject(openId, true); } else render();
  }

  /** فایل پشتیبان یک پروژه (id) یا همه‌ی پروژه‌ها ('all') */
  function backupBuild(id) {
    if (id === 'all') {
      const all = ST.list().map(function (e) { return S.project && S.project.id === e.id ? S.project : ST.load(e.id); }).filter(Boolean);
      if (!all.length) return null;
      const d = new Date(), pad = function (v) { return String(v).padStart(2, '0'); };
      return { name: 'RoadStake-all-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json', data: IO.allToJSON(all), title: 'پشتیبان همه‌ی پروژه‌ها (' + all.length + ' پروژه)' };
    }
    const p = S.project && S.project.id === id ? S.project : ST.load(id);
    if (!p) return null;
    return { name: slug(p.name) + '_backup.json', data: IO.projectToJSON(p), title: 'پشتیبان پروژه‌ی «' + p.name + '»' };
  }
  const canShareFiles = function () { try { return !!(window.File && navigator.canShare && navigator.canShare({ files: [new File(['x'], 'a.json', { type: 'application/json' })] })); } catch (_) { return false; } };
  function backupModal(id) {
    const f = backupBuild(id); if (!f) return;
    S.bk = id;
    const m = $('#modal');
    m.innerHTML = '<div class="box"><div class="sec-title"><h3>' + esc(f.title) + '</h3><button class="btn icon sm" data-act="bkClose" aria-label="بستن">×</button></div>' +
      '<p class="muted small" dir="ltr" style="text-align:start">' + esc(f.name) + '</p>' +
      '<div class="col" style="display:flex;flex-direction:column;gap:8px;margin-top:6px"><button class="btn primary" data-act="bkSave">ذخیره‌ی فایل</button>' +
      (canShareFiles() ? '<button class="btn" data-act="bkShare">ارسال (تلگرام، ایتا، بله، واتساپ…)</button>' : '') + '</div></div>';
    m.classList.add('on'); m.onclick = function (e) { if (e.target === m) bkClose(); };
  }
  function bkClose() { const m = $('#modal'); S.bk = null; m.classList.remove('on'); m.innerHTML = ''; m.onclick = null; }
  async function bkShare() {
    const f = backupBuild(S.bk); if (!f) return;
    const file = new File([new Blob([f.data], { type: 'application/json' })], f.name, { type: 'application/json' });
    try { await navigator.share({ files: [file], title: f.name }); bkClose(); }
    catch (e) { if (e && e.name === 'AbortError') return; toast('ارسال ممکن نشد؛ «ذخیره‌ی فایل» را بزنید و فایل را دستی بفرستید.', 'err'); }
  }
  function bkSave() { const f = backupBuild(S.bk); if (!f) return; deliver(f.name, f.data, 'application/json'); toast('فایل ' + f.name + ' آماده شد.'); bkClose(); }

      case 'lkRTab': (S.lk.rtab || (S.lk.rtab = {}))[b.dataset.i] = b.dataset.v; render(); break;

      case 'menu': openMenu(); break;
      case 'menuClose': closeMenu(); break;
      case 'save': saveProject(); break;
      case 'newProject': newProject(); break;
      case 'open': openProject(b.dataset.id); break;
      case 'restoreSnap': {
        const id = b.dataset.id, sn = ST.loadSnap(id); if (!sn) break;
        if (await ask('پروژه به آخرین ذخیره‌ی دستی (' + esc(new Date(sn.updatedAt).toLocaleString('fa-IR')) + ') برمی‌گردد و تغییرات خودکار بعد از آن از بین می‌رود. ادامه؟', { danger: true, ok: 'برگشت به نسخه‌ی قبلی' })) {
          const r = ST.restoreSnap(id);
          if (!r.ok) { toast(r.error, 'err'); break; }
          if (S.project && S.project.id === id) { S.dirty = false; await openProject(id, true); } else render();
          toast('پروژه به نسخه‌ی قبلی برگشت.');
        }
        break;
      }
      case 'backup': backupOf(b.dataset.id); break;
      case 'backupAll': backupAll(); break;
      case 'sfSrc': S.sf.src = b.dataset.v === 'file' ? 'file' : 'newo'; render(); break;
      case 'sfPdf': printSurveyFile(); break;
      case 'sfDel': {
        const i = parseInt(b.dataset.i, 10), ab = activeStreet().asbuilt, f = ab[i]; if (!f) break;
        { const lv = lkLocked(activeStreet())[f.id]; if (lv) { toast('این فایل در نسخه‌ی ' + lv + ' قفل نهایی شده و حذف نمی‌شود.', 'err'); break; } }
        if (await ask('فایل «' + esc(f.name) + '» (' + f.pts.length + ' نقطه) حذف شود؟ نسخه‌ی خام ذخیره‌شده‌ی آن هم از این دستگاه پاک می‌شود و برگشت‌پذیر نیست؛ اثرانگشت دیجیتال را (در صورت نیاز) از گزارش یا فایل اکسپورت‌شده نگه دارید.', { danger: true, ok: 'حذف' })) { ab.splice(i, 1); RAW.del(f.id); delete S.sf.raw[f.id]; if (S.sf.file === f.id) S.sf.file = ''; S.sf.page = 0; markDirty(); render(); }
        break;
      }
      case 'sfSel': S.sf.file = b.dataset.id; S.sf.page = 0; render(); break;
      case 'sfExport': sfExport(); break;
      case 'lkAdd': lkAdd(); break;
      case 'kyNew': kyNew(); break;
      case 'kyExport': kyExport(); break;
      case 'sgVerify': sgVerifyAct(); break;
      case 'lkPdf': printLock(parseInt(b.dataset.i, 10)); break;
      case 'lkZip': lkZip(parseInt(b.dataset.i, 10)); break;
      case 'lkRcpt': lkRcpt(parseInt(b.dataset.i, 10)); break;
      case 'lkRShare': lkRcptSend(parseInt(b.dataset.i, 10), 'share'); break;
      case 'lkRCopy': lkRcptSend(parseInt(b.dataset.i, 10), 'copy'); break;
      case 'lkAck': { const r = activeStreet().locks[parseInt(b.dataset.i, 10)], x = r && r.receipts[parseInt(b.dataset.j, 10)]; if (x) { x.ack = new Date().toISOString(); markDirty(); render(); toast('تأیید گیرنده ثبت شد.'); } break; }
      case 'cmpPdf': printCompare(); break;
      case 'mcAdd': {
        const F = S.mt.mcForm, cap = C.toNumber(F.cap);
        if (!fin(cap) || cap <= 0) { toast('ظرفیت ماشین را به متر مکعب وارد کنید.', 'err'); break; }
        let icon = 'generic', label = '';
        if (F.type === '__new') {
          const nm = F.newName.trim();
          if (!nm) { toast('نام خودرو‌ی جدید را بنویسید.', 'err'); break; }
          label = nm;
          if (!(p.vehicleTypes || (p.vehicleTypes = [])).includes(nm)) p.vehicleTypes.push(nm);

        } else if (F.type.indexOf('c:') === 0) label = F.type.slice(2);

  /** مقدارهای فرم افزودن نقطه (برای پیش‌نمایش و افزودن) */
  function ptFormRead() {
    const g = function (id) { const el = $('#' + id); return el ? el.value : ''; };
    const num = function (id) { const t = g(id).trim(); return t === '' ? NaN : C.toNumber(t); };
    return { id: g('qa_id').trim(), stText: g('qa_st').trim(), station: g('qa_st').trim() === '' ? NaN : C.parseStation(g('qa_st')), x: num('qa_x'), y: num('qa_y'), zText: g('qa_z').trim(), z: num('qa_z'), slText: g('qa_slope').trim(), slope: num('qa_slope'), desc: g('qa_desc').trim(),
      xText: g('qa_x').trim(), yText: g('qa_y').trim() };
  }

  /** نتیجه‌ی درج برای مقدارهای فعلی فرم؛ پیام خطا یا نقطه‌ی ساخته‌شده */
  function ptFormPlan(f) {
    const bad = [];
    if (f.stText === '' || !fin(f.station)) bad.push('کیلومتراژ خالی یا نامعتبر است.');
    if (f.xText !== '' && !fin(f.x)) bad.push('X نامعتبر است.');
    if (f.yText !== '' && !fin(f.y)) bad.push('Y نامعتبر است.');
    if (f.zText !== '' && !fin(f.z)) bad.push('Z نامعتبر است.');
    if (f.slText !== '' && !fin(f.slope)) bad.push('شیب طولی نامعتبر است.');
    if ((f.xText === '') !== (f.yText === '')) bad.push('X و Y را هر دو بنویسید یا هر دو را خالی بگذارید.');
    if (bad.length) return { ok: false, errors: bad };
    const r = C.interpolateAxisPoint(P().points, f.station, { x: f.x, y: f.y, z: f.z, slopePct: f.slope });
    if (!r.ok) return { ok: false, errors: [r.error], r: r };
    if (r.x === null) bad.push('این کیلومتراژ بین دو نقطه‌ی محور نیست؛ X و Y را وارد کنید.');
    if (r.z === null) bad.push('Z قابل محاسبه نیست؛ Z را وارد کنید' + (r.prev || r.next ? ' (یا شیب طولی را بدهید)' : '') + '.');
    if (bad.length) return { ok: false, errors: bad, r: r };
    return { ok: true, r: r };
  }

  function ptPreview() {
    const box = $('#qaPre'); if (!box) return;
    const f = ptFormRead();
    if (f.stText === '' && f.xText === '' && f.zText === '') { box.innerHTML = ''; return; }
    const pl = ptFormPlan(f), r = pl.r;
    const nm = function (q) { return q ? '«' + esc(q.id || q.i + 1) + '» (<bdi>' + esc(stn(q.s)) + '</bdi>)' : ''; };
    let h = '';
    if (r && r.ok) h += (r.prev && r.next ? 'درج بین ' + nm(r.prev) + ' و ' + nm(r.next) : r.prev ? 'درج بعد از آخرین نقطه ' + nm(r.prev) : r.next ? 'درج قبل از اولین نقطه ' + nm(r.next) : 'اولین نقطه‌ی محور') + '. ';
    if (r && r.ok && r.x !== null) h += 'X <b class="num">' + fx(r.x) + '</b> • Y <b class="num">' + fx(r.y) + '</b>' + (r.xyAuto ? ' (خودکار، خط مستقیم)' : '') + ' • ';
    if (r && r.ok && r.z !== null) h += 'Z <b class="num">' + fx(r.z) + '</b> (' + (r.zMode === 'auto' ? 'خودکار' : r.zMode === 'slope' ? 'از شیب' : 'دستی') + ')' +
      (fin(r.slopePrev) ? ' • شیب قبل→جدید <b class="num">' + C.fmt(r.slopePrev, 2) + '٪</b>' : '') + (fin(r.slopeNext) ? ' • جدید→بعد <b class="num">' + C.fmt(r.slopeNext, 2) + '٪</b>' : '');
    if (!pl.ok) h += '<div class="msg ' + (r && r.ok ? 'warn' : 'err') + ' small" style="margin-top:6px">' + pl.errors.map(esc).join('<br>') + '</div>';
    box.innerHTML = h;
  }

  function addPointFromForm() {
    const p = P(), f = ptFormRead();
    const mark = function (ids) { $$('#qa_st,#qa_x,#qa_y,#qa_z,#qa_slope').forEach(function (el) { el.classList.toggle('bad', ids.indexOf(el.id) >= 0); }); };
    const pl = ptFormPlan(f);
    if (!pl.ok) {
      const ids = [];
      if (f.stText === '' || !fin(f.station) || (pl.r && pl.r.dup !== undefined)) ids.push('qa_st');
      if (pl.r && pl.r.ok) { if (pl.r.x === null) ids.push('qa_x', 'qa_y'); if (pl.r.z === null) ids.push('qa_z'); }
      if (f.xText !== '' && !fin(f.x)) ids.push('qa_x'); if (f.yText !== '' && !fin(f.y)) ids.push('qa_y');
      if (f.zText !== '' && !fin(f.z)) ids.push('qa_z'); if (f.slText !== '' && !fin(f.slope)) ids.push('qa_slope');
      mark(ids); toast(pl.errors[0], 'err'); const el = $('#' + (ids[0] || 'qa_st')); if (el) el.focus(); return;
    }
    const r = pl.r;
    const desc = f.desc !== '' ? f.desc : (r.xyAuto || r.zMode !== 'manual') && r.prev && r.next ? 'درون‌یابی' : '';
    const q = { id: f.id !== '' ? f.id : nextPointId(), station: f.station, x: r.x, y: r.y, z: r.z, desc: desc };
    p.points.splice(r.index, 0, q);
    S.ptPage = Math.floor(r.index / PAGE_SIZE);
    // شیب عرضی کیلومتر جدید: اگر یکی از دو همسایه‌ی محور شیب دارد، ردیف «خودکار» ساخته می‌شود (درون‌یابی یا کپی؛ در تب شیب قابل ویرایش)
    const hasRow = function (pt) { return !!pt && p.sections.some(function (x) { return fin(x.station) && Math.abs(x.station - pt.s) < 1e-6; }); };
    let autoRow = false;
    if (hasRow(r.prev) || hasRow(r.next)) {
      p.sections.push({ station: f.station, wL: 0, wR: 0, mode: 'crown', sL: 0, sR: 0, unsigned: true, auto: true });
      p.sections.sort(function (a, b) { return (fin(a.station) ? a.station : Infinity) - (fin(b.station) ? b.station : Infinity); });
      autoRow = true;
    }
    structural();
    const sy = autoRow ? ' شیب عرضی از نقطه‌های همسایه خودکار گرفته شد (در تب شیب قابل ویرایش).' : (p.sections.length ? ' شیب عرضی این کیلومتر هنوز تعریف نشده است (تب شیب).' : '');
    toast('نقطه ' + (q.id || (r.index + 1)) + (r.prev && r.next ? ' بین ردیف ' + (r.prev.i + 1) + ' و ' + (r.next.i >= r.index ? r.next.i + 2 : r.next.i + 1) : ' افزوده شد') + ' درج شد.' + sy);
    const el = $('#qa_st'); if (el) el.focus();
  }

  /* ---------- میخ‌ها با فاصله‌ی ثابت ---------- */
  function pegOpts() {
    const g = function (id) { const el = $('#' + id); return el ? el.value.trim() : ''; };
    const st = function (t) { return t === '' ? '' : C.parseStation(t); };
    return { spacing: C.toNumber(g('pg_sp')), from: st(g('pg_from')), to: st(g('pg_to')) };
  }
  function pegPreview() {
    const box = $('#pgPre'); if (!box) return;
    const g = C.generatePegs(P().points, pegOpts());
    if (!g.ok) { box.innerHTML = '<span class="muted">' + esc(g.error) + '</span>'; return; }
    const arcN = g.items.filter(function (q) { return q.arc; }).length;
    box.innerHTML = '<b class="num">' + g.items.length + '</b> میخ جدید' + (g.items.length ? ' (' + arcN + ' تا روی قوس)' : '') +
      (g.skipped ? ' • ' + g.skipped + ' کیلومتر موجود رد می‌شود' : '') + (g.noZ ? ' • ' + g.noZ + ' بدون Z همسایه رد می‌شود' : '');
  }
  function pegGenerate() {
    const p = P(), g = C.generatePegs(p.points, pegOpts());
    if (!g.ok) { toast(g.error, 'err'); return; }
    if (!g.items.length) { toast('میخ جدیدی ساخته نشد.', 'err'); return; }
    const sorted = p.points.every(function (q, i) { return fin(q.station) && (i === 0 || q.station >= p.points[i - 1].station); });
    if (!sorted) { toast('اول نقاط محور را با «مرتب‌سازی با کیلومتراژ» مرتب کنید.', 'err'); return; }
    const had = new Set(p.sections.filter(function (x) { return fin(x.station); }).map(function (x) { return Math.round(x.station * 1e6); }));
    const hasRow = function (s) { return s !== null && had.has(Math.round(s * 1e6)); };
    let nid = parseInt(nextPointId(), 10); if (!Number.isFinite(nid)) nid = p.points.length + 1;
    g.items.forEach(function (it) {
      p.points.push({ id: String(nid++), station: it.station, x: it.x, y: it.y, z: it.z, desc: 'میخ', peg: true });
      if (hasRow(it.prevS) || hasRow(it.nextS)) p.sections.push({ station: it.station, wL: 0, wR: 0, mode: 'crown', sL: 0, sR: 0, unsigned: true, auto: true });
    });
    p.points.sort(function (a, c) { return a.station - c.station; });   // پایدار: نقاط موجود هم‌ترتیب می‌مانند
    p.sections.sort(function (a, c) { return (fin(a.station) ? a.station : Infinity) - (fin(c.station) ? c.station : Infinity); });
    structural();
    toast(g.items.length + ' میخ ساخته شد.' + (p.sections.length ? ' شیب عرضی آن‌ها خودکار گرفته شد.' : ''));
  }
  async function pegRemove() {
    const p = P(), pegs = p.points.filter(function (q) { return q.peg; });
    if (!pegs.length) return;
    if (!(await ask('فقط ' + pegs.length + ' میخ ساخته‌شده حذف شود؟ (نقاط اصلی و میخ‌هایی که دستی ویرایش کرده‌اید می‌مانند.)', { danger: true, ok: 'حذف' }))) return;
    const gone = new Set(pegs.map(function (q) { return Math.round(q.station * 1e6); }));
    p.points = p.points.filter(function (q) { return !q.peg; });
    p.sections = p.sections.filter(function (x) { return !(x.auto && fin(x.station) && gone.has(Math.round(x.station * 1e6))); });
    structural();
    toast(pegs.length + ' میخ حذف شد.');
  }

  /** ویرایش شیب طولی یک ردیف: Z نقطه‌ی بعدی از Z این نقطه و شیب ساخته می‌شود */
  function setLonSlope(i, text) {
    const pts = P().points, a = pts[i], b = pts[i + 1];
    const v = C.toNumber(text);
    if (!a || !b || !fin(v)) { toast('شیب نامعتبر است.', 'err'); render(); return; }
    const s1 = C.toNumber(a.station), s2 = C.toNumber(b.station), z1 = C.toNumber(a.z);
    if (![s1, s2, z1].every(fin) || !(s2 > s1)) { toast('برای این ردیف Z و کیلومتراژ کامل لازم است.', 'err'); render(); return; }
    b.z = Math.round((z1 + v / 100 * (s2 - s1)) * 1e6) / 1e6;
    delete b.peg;
    structural();
    toast('Z ردیف ' + (i + 2) + ' از شیب ' + C.fmt(v, 2) + '٪ تنظیم شد.');
  }

  async function toggleWake() {
    try {
      if (S.wake) { await S.wake.release(); S.wake = null; }
      else {
        S.wake = await navigator.wakeLock.request('screen');
        S.wake.addEventListener('release', function () { S.wake = null; });
      }
    } catch (e) { toast('روشن نگه‌داشتن صفحه در این دستگاه ممکن نشد.', 'err'); }
    render();
  }

  /* ============================== راه‌اندازی ============================== */
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') autoSave(); });
  window.addEventListener('pagehide', autoSave);
  window.addEventListener('beforeunload', autoSave);
  setInterval(autoSave, 30000);
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', function (e) {
    const el = e.target;
    if (!el || !el.id) return;
    if (el.id === 'mdCount') midOffUi();
    else if (el.id.indexOf('qa_') === 0) ptPreview();
    else if (el.id.indexOf('pg_') === 0) { const pg = S.peg || (S.peg = {}); pg[el.id.slice(3)] = el.value; pegPreview(); }
    else if (el.id.indexOf('svRd_') === 0) { S.sv.reads[el.id.slice(5)] = el.value; svRefreshLive(); }
    else if (el.id === 'svBs') { S.sv.bs = el.value; svRefreshLive(); }
    else if (el.id === 'suBs') setupAddHi();
  });
  document.addEventListener('keydown', function (e) {
    const el = e.target;
    if (e.key !== 'Enter' || !el || !el.id || el.id.indexOf('svRd_') !== 0) return;
    e.preventDefault();
    svTap(el.id.slice(5));
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('beforeunload', function (e) {
    if (S.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.wake === null && S.page === 'stake' && S.wantWake) toggleWake();
    if (document.visibilityState === 'hidden' && S.dirty && S.project) ST.saveDraft(S.project);
  });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* ignore */ });
  }

  (async function init() {
    const last = ST.getLast();
    if (last && ST.exists(last)) { await openProject(last, true); }
    route();
  })();

  window.__RS = { S: S, calc: calc, render: render, printTable: printTable, lkRcptText: lkRcptText };
})();

</script>
